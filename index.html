function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function ensureLesson(c){
  if(!c.lesson || typeof c.lesson !== "object") c.lesson = { date:"", absent:[], picked:[], notes:{} };
  if(c.lesson.date !== todayKey()){                          // neuer Tag: Anwesenheit startet frisch
    if(c.lesson.date && c.lesson.absent.length){             // vorher den alten Tag archivieren
      if(!Array.isArray(c.attendance)) c.attendance = [];
      c.attendance.push({ date: c.lesson.date, absent: c.lesson.absent.slice() });
      while(c.attendance.length > 300) c.attendance.shift();
    }
    c.lesson.date = todayKey();
    c.lesson.absent = [];
    c.lesson.picked = [];
  }
  return c.lesson;
}
/* Wer heute im Unterrichtsmodus als abwesend markiert ist */
/* Wer heute nicht da ist: im Unterricht als abwesend markiert, bei Feiern abgesagt */
function absentToday(c){
  const out = new Set();
  if(!c) return out;
  if(c.lesson && c.lesson.date === todayKey() && Array.isArray(c.lesson.absent)) c.lesson.absent.forEach(id => out.add(id));
  if(DB.settings.mode === "event") c.students.forEach(s => { if(s.rsvp === "no") out.add(s.id); });
  return out;
}

function attendanceRows(c){
  const rows = Array.isArray(c.attendance) ? c.attendance.slice() : [];
  if(c.lesson && c.lesson.date && c.lesson.absent.length){
    rows.push({ date: c.lesson.date, absent: c.lesson.absent.slice() });   // heutiger Stand
  }
  return rows.sort((a,b) => a.date.localeCompare(b.date));
}
function csvCell(v){
  const x = String(v == null ? "" : v);
  return /[";\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
}
function exportAttendance(){
  const c = curClass(); if(!c) return;
  const rows = attendanceRows(c);
  if(!rows.length || !c.students.length){ toast(t("attendanceEmpty")); return; }
  const dates = rows.map(r => r.date);
  const head = [t("csvName")].concat(dates).concat([t("attendanceSum")]);
  const lines = [head.map(csvCell).join(";")];
  c.students.slice().sort((a,b) => a.name.localeCompare(b.name, LANG)).forEach(st => {
    let sum = 0;
    const cells = rows.map(r => {
      const absent = r.absent.indexOf(st.id) >= 0;
      if(absent) sum++;
      return absent ? t("attendanceAbsent") : "";
    });
    lines.push([csvCell(st.name)].concat(cells.map(csvCell)).concat([String(sum)]).join(";"));
  });
  /* Byte-Reihenfolge-Marke, sonst zeigt Excel Umlaute falsch an */
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  if(download(blob, safeName(c.name) + "-" + t("attendance") + ".csv", "text/csv")) toast(t("attendanceOk"));
  else toast(t("exportFail"));
}

/* ============ 21. Export: PNG, PDF, Sicherung ============ */
/* Speichern/Teilen mit drei Wegen: nativ über Capacitor, sonst Web Share, sonst Download.
   Der reine Blob-Download landet im WKWebView unter iOS sonst nirgendwo sichtbar. */
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("read failed"));
    r.onload = () => {
      const res = String(r.result);
      const i = res.indexOf(",");
      resolve(i >= 0 ? res.slice(i + 1) : res);
    };
    r.readAsDataURL(blob);
  });
}
function capPlugins(){
  const C = window.Capacitor;
  return (C && C.Plugins) ? C.Plugins : null;
}
async function shareNative(blob, filename){
  const P = capPlugins();
  if(!P || !P.Filesystem || !P.Share) return false;
  try{
    const data = await blobToBase64(blob);
    const written = await P.Filesystem.writeFile({
      path: filename, data: data, directory: "CACHE", recursive: true
    });
    const uri = written && (written.uri || written.path);
    if(!uri) return false;
    await P.Share.share({ title: filename, files: [uri] });
    return true;
  }catch(e){ return false; }
}
async function shareWeb(blob, filename, mime){
  try{
    if(!navigator.canShare || typeof File !== "function") return false;
    const file = new File([blob], filename, { type: mime });
    if(!navigator.canShare({ files: [file] })) return false;

function downloadBlob(blob, filename){

/* iPad: Das Teilen-Menü ist ein Popover und braucht einen Ankerpunkt, sonst

let lastTapRect = null;
document.addEventListener("click", e => {

  if(b && !b.closest("#sheet")) lastTapRect = b.getBoundingClientRect();

function shareAnchor(){
  const visible = el => el && el.offsetParent !== null && el.getBoundingClientRect().width > 0;
  let r = null;
  if($("#screen-editor").classList.contains("active") && visible($("#btn-share"))) r = $("#btn-share").getBoundingClientRect();
  else if(lastTapRect && lastTapRect.width) r = lastTapRect;
  const w = window.innerWidth || 800, h = window.innerHeight || 600;
  if(!r) return Math.round(w / 2) + "," + Math.round(h / 2) + ",1,1";
  return [r.left, r.top, r.width, r.height].map(v => Math.max(0, Math.round(v))).join(",");

function cordovaShare(blob, filename){
  const sharer = window.plugins && window.plugins.socialsharing;
  if(!window.cordova || !sharer || !sharer.shareWithOptions) return false;
  const r = new FileReader();
  r.onerror = () => toast(t("exportFail"));
  r.onload = () => {
    sharer.shareWithOptions({
      subject: filename, files: [String(r.result)], chooserTitle: filename,
      iPadPopupCoordinates: shareAnchor()

function download(blob, filename, mime){
  if(window.cordova) return cordovaShare(blob, filename);
  const okNow = downloadBlob(blob, filename);
  /* Native Wege laufen asynchron nach; schlägt der Download fehl, greifen sie als Ersatz. */
  (async () => {
    if(okNow && !capPlugins()) return;
    const done = await shareNative(blob, filename);
    if(!done && !okNow) await shareWeb(blob, filename, mime || "application/octet-stream");
  })();

}

function roundRectPath(ctx, x, y, w, h, r){          // Fallback für Safari < 16
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
const PRINT_FILL = { desk:"#FFFDF7", teacherdesk:"#E7EEF1", board:"#2E4034", digitalboard:"#1F2933",

function exportPNG(){
  try{
    /* iOS begrenzt Zeichenflächen auf etwa 16 Megapixel – große Säle werden
       deshalb mit kleinerem Faktor gezeichnet statt gar nicht */
    const headH = 90, pad = 16;
    const W = ROOM_W + 2 * pad, H = ROOM_H + headH + 2 * pad;
    const scale = Math.max(0.5, Math.min(2, Math.sqrt(16e6 / (W * H))));
    const cv = document.createElement("canvas");
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    const g = cv.getContext("2d");
    if(!g) throw new Error("no 2d context");
    g.scale(scale, scale);
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#16232B";
    g.font = "700 30px -apple-system,Segoe UI,Roboto,sans-serif";
    g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(planTitle(), 30, 42, W - 320);
    g.font = "400 18px -apple-system,Segoe UI,Roboto,sans-serif";
    g.fillStyle = "#5A6B75"; g.textAlign = "right";
    const r = curRoom();
    g.fillText(t("roomSizeSub").replace("{w}", fmtM(ROOM_W)).replace("{h}", fmtM(ROOM_H)) + " · " +
      t("printDate") + " " + new Date().toLocaleDateString(), W - 30, 42);
    g.save();
    g.translate(pad, headH + pad);
    g.fillStyle = FLOOR_COLORS[(r && r.floor) || "plain"] || "#FFFFFF";
    g.fillRect(0, 0, ROOM_W, ROOM_H);
    g.strokeStyle = "rgba(0,89,179,.14)"; g.lineWidth = 1;
    for(let x = 0; x <= ROOM_W; x += PX_PER_M){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ROOM_H); g.stroke(); }
    for(let y = 0; y <= ROOM_H; y += PX_PER_M){ g.beginPath(); g.moveTo(0, y); g.lineTo(ROOM_W, y); g.stroke(); }
    g.strokeStyle = "#46505E"; g.lineWidth = 10;
    g.strokeRect(-5, -5, ROOM_W + 10, ROOM_H + 10);
    /* Tischplatten zuerst, damit die Stühle darüber liegen */
    if(curPlan()) tableShapes(planDesks()).forEach(sh => {
      g.save();
      g.translate(sh.cx, sh.cy); g.rotate((sh.rot || 0) * Math.PI / 180);
      g.fillStyle = PRINT_TABLE; g.strokeStyle = PRINT_TABLE_LINE; g.lineWidth = 2;
      g.beginPath();
      if(sh.kind === "round") g.arc(0, 0, sh.r, 0, Math.PI * 2);
      else if(sh.kind === "oval") g.ellipse(0, 0, sh.len / 2, sh.dep / 2, 0, 0, Math.PI * 2);
      else roundRectPath(g, -sh.len / 2, -sh.dep / 2, sh.len, sh.dep, 10);
      g.fill(); g.stroke();
      g.rotate(-(sh.rot || 0) * Math.PI / 180);
      g.fillStyle = PRINT_TABLE_INK; g.textAlign = "center"; g.textBaseline = "middle";
      g.font = "700 18px -apple-system,Segoe UI,Roboto,sans-serif";
      g.fillText(t("tableNo").replace("{n}", String(sh.no)), 0, 0);
      g.restore();
    });
    const pngNums = examNumbers(curPlan());
    allItems().forEach(it => {
      g.save();
      g.translate(it.x + it.w / 2, it.y + it.h / 2);
      g.rotate((it.rot || 0) * Math.PI / 180);
      g.fillStyle = PRINT_FILL[it.type] || "#FFFFFF";
      g.strokeStyle = "#16232B";
      g.lineWidth = 1.5;
      const round = ROUND_TYPES.indexOf(it.type) >= 0 || (it.type === "desk" && it.w === it.h && it.w <= 70);
      g.beginPath();
      if(round) g.ellipse(0, 0, it.w / 2, it.h / 2, 0, 0, Math.PI * 2);
      else roundRectPath(g, -it.w / 2, -it.h / 2, it.w, it.h, 5);
      g.fill(); g.stroke();
      g.rotate(-(it.rot || 0) * Math.PI / 180);                // Schrift waagerecht
      g.fillStyle = PRINT_TEXT[it.type] || "#16232B";
      const lbl = it.type === "pillar" ? "" : it.type === "desk" ? deskPrintLabel(curClass(), curPlan(), it, pngNums) : itemLabel(it);
      const box = itemBox(it);
      const fs = clamp(Math.min(13, (box.w - 8) / (Math.max(1, lbl.length) * 0.56), (box.h - 6) / 1.2), 6, 13);
      g.font = "600 " + fs.toFixed(1) + "px -apple-system,Segoe UI,Roboto,sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(lbl, 0, 0, box.w - 6);
      g.restore();
    });
    g.restore();
    cv.toBlob(blob => {
      if(!blob || !download(blob, safeName(planTitle()) + ".png", "image/png")) toast(t("exportFail"));
      else toast(t("exportedPng"));
    }, "image/png");
  }catch(e){ toast(t("exportFail")); }
}

/* --- Minimaler PDF-Erzeuger (A4 quer, Helvetica/WinAnsi) --- */
/* PDF-Text in WinAnsi (Standardschrift Helvetica). Was WinAnsi nicht kennt,
   wird sinnvoll ersetzt statt zu „?“ zu werden: „Ayşe Yıldız“ → „Ayse Yildiz“,
   „Łukasz“ → „Lukasz“. Š, Ž, Œ, € und typografische Zeichen liegen in WinAnsi
   auf eigenen Codes (0x80–0x9F) und bleiben erhalten. */
const WINANSI_EXTRA = { 0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86,
  0x2021:0x87, 0x02C6:0x88, 0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C, 0x017D:0x8E,
  0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
  0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B, 0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F };
/* Buchstaben ohne Zerlegung in Grundbuchstabe + Akzent */
const PDF_TRANSLIT = { "ı":"i", "İ":"I", "ł":"l", "Ł":"L", "đ":"d", "Đ":"D", "ħ":"h", "Ħ":"H",
  "ŀ":"l", "Ŀ":"L", "ĳ":"ij", "Ĳ":"IJ", "ſ":"s", "ə":"e", "Ə":"E", "ŋ":"n", "Ŋ":"N", "ŧ":"t", "Ŧ":"T" };
/* Kyrillisch (Russisch, Ukrainisch) in deutscher Umschrift – Namen geflüchteter
   Kinder stehen manchmal so in der Liste */
const CYR = "а:a,б:b,в:w,г:g,ґ:g,д:d,е:e,ё:jo,є:je,ж:sch,з:s,и:i,і:i,ї:ji,й:j,к:k,л:l,м:m,н:n,о:o,п:p,р:r,с:s,т:t,у:u,ф:f,х:ch,ц:z,ч:tsch,ш:sch,щ:schtsch,ъ:,ы:y,ь:,э:e,ю:ju,я:ja";
CYR.split(",").forEach(pair => {
  const [k, v] = pair.split(":");
  PDF_TRANSLIT[k] = v;
  PDF_TRANSLIT[k.toUpperCase()] = v ? v.charAt(0).toUpperCase() + v.slice(1) : "";
});
function pdfChar(ch){
  const code = ch.codePointAt(0);
  if(code < 32 || (code >= 0x7F && code < 0xA0)) return " ";
  if(code < 256) return ch;
  if(WINANSI_EXTRA[code] !== undefined) return String.fromCharCode(WINANSI_EXTRA[code]);
  if(PDF_TRANSLIT[ch] !== undefined) return PDF_TRANSLIT[ch];
  const base = ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
  if(base && base !== ch && Array.from(base).every(c => c.codePointAt(0) < 256)) return base;
  return "?";
}
function pdfPlain(s){ return Array.from(String(s)).map(pdfChar).join(""); }
function pdfEscape(s){
  let out = "";
  for(const ch0 of String(s)){
    for(const ch of pdfChar(ch0)){
      const code = ch.charCodeAt(0);
      if(ch === "(" || ch === ")" || ch === "\\") out += "\\" + ch;
      else if(code < 127) out += ch;
      else out += "\\" + code.toString(8).padStart(3, "0");   // Umlaute und WinAnsi-Sonderzeichen als Oktal
    }
  }
  return out;
}
const PDF_W = 842, PDF_H = 595, PDF_M = 28;               // A4 quer in Punkt
/* Ellipse aus vier Bézierkurven (PDF kennt keinen Kreisbefehl) */
function pdfEllipse(cx, cy, rx, ry){
  const k = 0.5523, f = v => v.toFixed(2);
  return [f(cx + rx) + " " + f(cy) + " m",
    f(cx + rx) + " " + f(cy + ry * k) + " " + f(cx + rx * k) + " " + f(cy + ry) + " " + f(cx) + " " + f(cy + ry) + " c",
    f(cx - rx * k) + " " + f(cy + ry) + " " + f(cx - rx) + " " + f(cy + ry * k) + " " + f(cx - rx) + " " + f(cy) + " c",
    f(cx - rx) + " " + f(cy - ry * k) + " " + f(cx - rx * k) + " " + f(cy - ry) + " " + f(cx) + " " + f(cy - ry) + " c",
    f(cx + rx * k) + " " + f(cy - ry) + " " + f(cx + rx) + " " + f(cy - ry * k) + " " + f(cx + rx) + " " + f(cy) + " c h"].join(" ");
}
function pdfRgb(hex){
  const h = String(hex).replace("#", "");
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]
    .map(v => (isFinite(v) ? v : 0).toFixed(3)).join(" ");
}
/* Zeichnet einen Sitzplan als Seiteninhalt */
function pdfPlanPage(cls, plan, room, title, opts){
  const nums = (opts && opts.numbers) || examNumbers(plan);
  const M = PDF_M, headH = 42;
  const availW = PDF_W - 2 * M, availH = PDF_H - 2 * M - headH;
  const sc = Math.min(availW / ROOM_W, availH / ROOM_H);
  const offX = M + (availW - ROOM_W * sc) / 2;
  const offY = M + (availH - ROOM_H * sc) / 2;
  const X = x => (offX + x * sc).toFixed(2);
  const Y = y => (PDF_H - M - headH - (y * sc) - (offY - M)).toFixed(2);
  const items = (room ? room.items : []).concat(plan ? plan.desks : []);
  const c = [];
  c.push("0.086 0.137 0.169 rg BT /F1 15 Tf " + M + " " + (PDF_H - M - 12) + " Td (" + pdfEscape(title) + ") Tj ET");
  c.push("0.353 0.420 0.459 rg BT /F1 9 Tf " + M + " " + (PDF_H - M - 28) + " Td (" +
    pdfEscape(t("printDate") + " " + new Date().toLocaleDateString()) + ") Tj ET");
  /* Boden und Wände */
  c.push(pdfRgb(FLOOR_COLORS[(room && room.floor) || "plain"] || "#FFFFFF") + " rg 0.275 0.314 0.369 RG " +
    Math.max(1.5, 10 * sc).toFixed(2) + " w " + X(0) + " " + Y(ROOM_H) + " " +
    (ROOM_W * sc).toFixed(2) + " " + (ROOM_H * sc).toFixed(2) + " re B");
  c.push("0.353 0.420 0.459 rg BT /F1 8 Tf " + (PDF_W - M - 120) + " " + (PDF_H - M - 28) + " Td (" +
    pdfEscape(t("roomSizeSub").replace("{w}", fmtM(ROOM_W)).replace("{h}", fmtM(ROOM_H))) + ") Tj ET");
  /* Tischplatten unter den Stühlen */
  if(plan) tableShapes(plan.desks).forEach(sh => {
    const rot = ((sh.rot || 0) * Math.PI) / 180;
    c.push("q");
    c.push([Math.cos(rot).toFixed(5), Math.sin(rot).toFixed(5), (-Math.sin(rot)).toFixed(5), Math.cos(rot).toFixed(5),
            X(sh.cx), Y(sh.cy)].join(" ") + " cm");
    c.push(pdfRgb(PRINT_TABLE) + " rg " + pdfRgb(PRINT_TABLE_LINE) + " RG 0.9 w");
    if(sh.kind === "round") c.push(pdfEllipse(0, 0, sh.r * sc, sh.r * sc) + " B");
    else if(sh.kind === "oval") c.push(pdfEllipse(0, 0, sh.len * sc / 2, sh.dep * sc / 2) + " B");
    else c.push((-sh.len * sc / 2).toFixed(2) + " " + (-sh.dep * sc / 2).toFixed(2) + " " +
                (sh.len * sc).toFixed(2) + " " + (sh.dep * sc).toFixed(2) + " re B");
    c.push("Q");
    const lab = t("tableNo").replace("{n}", String(sh.no));
    const fs = Math.max(5, Math.min(10, (sh.kind === "round" ? sh.r : sh.dep / 2) * sc * 0.45));
    c.push(pdfRgb(PRINT_TABLE_INK) + " rg BT /F1 " + fs.toFixed(1) + " Tf " +
      (parseFloat(X(sh.cx)) - pdfPlain(lab).length * fs * 0.25).toFixed(2) + " " + (parseFloat(Y(sh.cy)) - fs / 3).toFixed(2) +
      " Td (" + pdfEscape(lab) + ") Tj ET");
  });
  items.forEach(it => {
    const rot = ((it.rot || 0) * Math.PI) / 180;
    const w = it.w * sc, h = it.h * sc;
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    c.push("q");
    c.push([Math.cos(rot).toFixed(5), Math.sin(rot).toFixed(5),
            (-Math.sin(rot)).toFixed(5), Math.cos(rot).toFixed(5), X(cx), Y(cy)].join(" ") + " cm");
    c.push(pdfRgb(PRINT_FILL[it.type] || "#FFFFFF") + " rg 0.086 0.137 0.169 RG 0.7 w");
    const round = ROUND_TYPES.indexOf(it.type) >= 0 || (it.type === "desk" && it.w === it.h && it.w <= 70);
    if(round) c.push(pdfEllipse(0, 0, w / 2, h / 2) + " B");
    else c.push((-w/2).toFixed(2) + " " + (-h/2).toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re B");
    /* Beschriftung waagerecht, auch bei gedrehten Objekten */
    c.push([Math.cos(-rot).toFixed(5), Math.sin(-rot).toFixed(5), (-Math.sin(-rot)).toFixed(5), Math.cos(-rot).toFixed(5), 0, 0].join(" ") + " cm");
    const label = it.type === "pillar" ? "" : it.type === "desk" ? deskPrintLabel(cls, plan, it, nums) : pdfItemLabel(cls, it);
    if(label){
      const plainLen = Math.max(1, pdfPlain(label).length);      // nach Umschrift, z. B. „Шевченко“ → 12 Zeichen
      const bx = itemBox(it), bw = bx.w * sc, bh = bx.h * sc;
      const fs = Math.max(4, Math.min(9, bh * 0.42, (bw - 4) / (plainLen * 0.52)));
      const tw = plainLen * fs * 0.5;
      const col = PRINT_TEXT[it.type] ? pdfRgb(PRINT_TEXT[it.type]) : "0.086 0.137 0.169";
      c.push(col + " rg BT /F1 " + fs.toFixed(1) + " Tf " +
        (-tw/2).toFixed(2) + " " + (-fs/3).toFixed(2) + " Td (" + pdfEscape(label) + ") Tj ET");
    }
    c.push("Q");
  });
  return c.join("\n");
}
/* Beschriftung unabhängig vom gerade geöffneten Plan — für den Sammelexport nötig */
function pdfItemLabel(cls, it){
  if(it.type === "desk"){
    const st = cls ? cls.students.find(x => x.id === it.studentId) : null;
    if(st) return st.name;
    return typeof it.label === "string" ? it.label : "";
  }
  return typeof it.label === "string" ? it.label : tItem(it.type);
}
/* Namensliste, dreispaltig — bei langen Listen über mehrere Seiten.
   Vorher wurden Namen unterhalb des Seitenrands stillschweigend verschluckt. */
function pdfListPages(cls, title){
  const M = PDF_M, lineH = 16, topY = PDF_H - M - 52;
  const rowsPerCol = Math.max(1, Math.floor((topY - M) / lineH) + 1);
  const perPage = rowsPerCol * 3;
  const colW = (PDF_W - 2 * M) / 3;
  const names = cls.students.slice().sort((a,b) => a.name.localeCompare(b.name, LANG));
  const pages = [];
  const total = Math.max(1, Math.ceil(names.length / perPage));
  for(let pg = 0; pg < total; pg++){
    const chunk = names.slice(pg * perPage, (pg + 1) * perPage);
    const c = [];
    const heading = total > 1 ? title + " (" + (pg + 1) + "/" + total + ")" : title;
    c.push("0.086 0.137 0.169 rg BT /F1 15 Tf " + M + " " + (PDF_H - M - 12) +
      " Td (" + pdfEscape(heading) + ") Tj ET");
    chunk.forEach((st, i) => {
      const col = Math.floor(i / rowsPerCol), row = i % rowsPerCol;
      const x = M + col * colW;
      const y = topY - row * lineH;
      const num = pg * perPage + i + 1;
      const seatInfo = cls.plans.some(p => p.desks.some(d => d.studentId === st.id)) ? "" : "  (" + t("notSeated") + ")";
      c.push("0.086 0.137 0.169 rg BT /F1 10 Tf " + x.toFixed(1) + " " + y.toFixed(1) +
        " Td (" + pdfEscape(num + ".  " + st.name + seatInfo) + ") Tj ET");
    });
    pages.push(c.join("\n"));
  }
  return pages;
}
function buildPDF(pages){
  const objs = [];
  const kids = [];
  pages.forEach((_, i) => kids.push((4 + i * 2) + " 0 R"));
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  objs.push("<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + pages.length + " >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  /* Eine Seite ist ein Text (A4 quer) oder { content, w, h } für andere Formate */
  pages.forEach((pg, i) => {
    const content = typeof pg === "string" ? pg : pg.content;
    const pw = typeof pg === "string" ? PDF_W : pg.w, ph = typeof pg === "string" ? PDF_H : pg.h;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph +
      "] /Resources << /Font << /F1 3 0 R >> >> /Contents " + (5 + i * 2) + " 0 R >>");
    objs.push("<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream");
  });
  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((o, i) => { offsets.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
  const xref = pdf.length;
  pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach(o => { pdf += String(o).padStart(10, "0") + " 00000 n \n"; });
  pdf += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  const bytes = new Uint8Array(pdf.length);
  for(let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;   // reines Latin-1
  return new Blob([bytes], { type: "application/pdf" });
}

/* --- Sicherung --- */
/* Sicherungen lassen sich mit einem Passwort verschlüsseln (AES-GCM 256, Schlüssel per
   PBKDF2-SHA-256 mit 250 000 Runden). Ohne WebCrypto bleibt nur die einfache Sicherung. */
const BACKUP_ITER = 250000;
const hasCrypto = () => !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues && window.TextEncoder);
const b64 = u8 => { let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
async function backupKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptBackup(text, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await backupKey(pw, salt, BACKUP_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)));
  return { app: "fairseat", v: 2, exported: new Date().toISOString(),
           enc: { alg: "AES-GCM-256", kdf: "PBKDF2-SHA-256", iter: BACKUP_ITER, salt: b64(salt), iv: b64(iv), data: b64(ct) } };
}
async function decryptBackup(enc, pw){
  const iter = Number.isInteger(enc.iter) && enc.iter >= 10000 && enc.iter <= 5000000 ? enc.iter : BACKUP_ITER;
  const key = await backupKey(pw, unb64(enc.salt), iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.data));
  return new TextDecoder().decode(pt);
}
function writeBackup(obj, encrypted){
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  const stamp = new Date().toISOString().slice(0, 10);
  if(download(blob, "fairseat-backup-" + stamp + (encrypted ? "-geschuetzt" : "") + ".json", "application/json")){
    DB.lastBackup = new Date().toISOString(); save(); renderStart(); toast(t(encrypted ? "backupOkEnc" : "backupOk"));
  }
  else toast(t("exportFail"));
}

/* Fragt das Passwort einer geschützten Sicherung ab und reicht den Inhalt weiter */
function askBackupPassword(enc, done){
  if(!hasCrypto()){ toast(t("backupNoCrypto")); return; }
  const sheet = sheetBase(t("backupPwTitle"));
  const f = document.createElement("input");
  f.className = "field"; f.type = "password"; f.autocomplete = "current-password"; f.id = "bk-pw-open";
  f.placeholder = t("backupPw1"); f.maxLength = 128;
  sheet.appendChild(f);
  let busy = false;
  const go = async () => {
    if(busy || !f.value) return;
    busy = true;
    try{
      const text = await decryptBackup(enc, f.value);
      closeModal(); done(JSON.parse(text));
    }catch(e){ busy = false; toast(t("backupPwWrong")); f.select(); }
  };
  f.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  sheetButtons(sheet, t("restore"), go);
  setTimeout(() => f.focus(), 60);
}

/* ============ 21b. Import aus FairMix ============ */
/* Liest eine FairMix-Sicherung (FairMix_Backup_….json). Übernommen werden je Klasse
   die Namen, Stufen, „immer/nie zusammen“ und – für die zuletzt aktive Klasse – die
   gebildeten Gruppen. FairMix selbst wird dabei nicht verändert. */
/* Zahl mit passender Einzahl/Mehrzahl: „1 Sitzplan“ statt „1 Sitzpläne“ */
const SINGULAR = { nStudents:"nStudent", nPlans:"nPlan", nDesks:"nDesk", nObjects:"nObject" };
function cnt(n, key){ return n + " " + t(n === 1 && SINGULAR[key] ? SINGULAR[key] : key); }
function nRulesTxt(n){ return n + " " + (n === 1 ? t("nRule") : t("nRules")); }
function nGroupsTxt(n){ return n + " " + (n === 1 ? t("nFmGroup") : t("nFmGroups")); }
function fmNameList(arr){
  return Array.isArray(arr) ? arr.map(x => typeof x === "string" ? x : (x && typeof x.name === "string" ? x.name : ""))
    .map(x => x.trim().slice(0, 40)).filter(Boolean) : [];
}
function fmLevels(obj){
  const out = {};
  if(obj && typeof obj === "object" && !Array.isArray(obj)){
    Object.keys(obj).forEach(k => { const v = parseInt(obj[k], 10); if(v >= 1 && v <= 3) out[k] = v; });
  }
  return out;
}
function fmRules(pr){
  const out = [];
  if(!pr || typeof pr !== "object") return out;
  ["together", "apart"].forEach(type => {
    (Array.isArray(pr[type]) ? pr[type] : []).forEach(x => {
      if(Array.isArray(x) && x.length === 2 && typeof x[0] === "string" && typeof x[1] === "string" && x[0] !== x[1])
        out.push({ type, a: x[0], b: x[1] });
    });
  });
  return out;
}
function fmGroupsFromState(st){
  const res = [];
  const teams = Array.isArray(st.teams) ? st.teams : [];
  const names = Array.isArray(st.teamNames) ? st.teamNames : [];
  teams.forEach((tm, i) => {
    const m = fmNameList(tm);
    if(m.length) res.push({ name: typeof names[i] === "string" && names[i] ? names[i].slice(0,40) : "", members: m });
  });
  if(res.length) return res.slice(0, MAX_GROUPS);
  /* Sonst die von Hand gebildeten Gruppen */
  if(st.groups && typeof st.groups === "object" && !Array.isArray(st.groups)){
    Object.keys(st.groups).forEach(k => {
      const m = fmNameList(st.groups[k]);
      if(m.length) res.push({ name: k.slice(0,40), members: m });
    });
  }
  return res.slice(0, MAX_GROUPS);
}
/* Partnerhistorie: wer in FairMix schon zusammen war, Schlüssel "A␟B" → Anzahl */
function fmPairs(obj){
  const out = [];
  if(!obj || typeof obj !== "object" || Array.isArray(obj)) return out;
  Object.keys(obj).forEach(k => {
    const v = parseInt(obj[k], 10);
    if(!(v > 0)) return;
    const parts = k.indexOf("\u001F") >= 0 ? k.split("\u001F") : k.split("||");
    if(parts.length === 2 && parts[0] && parts[1] && parts[0] !== parts[1]) out.push([parts[0], parts[1], v]);
  });
  return out.sort((a, b) => b[2] - a[2]).slice(0, 400);
}
function parseFairMix(data){
  if(!data || typeof data !== "object" || data.app !== "FairMix") return null;
  const st = (data.state && typeof data.state === "object") ? data.state : {};
  const saved = (data.savedLists && typeof data.savedLists === "object" && !Array.isArray(data.savedLists)) ? data.savedLists : {};
  const list = [];
  Object.keys(saved).forEach(name => {
    const e = saved[name];
    if(!e || !Array.isArray(e.original)) return;
    list.push({ name: name.slice(0,60), names: fmNameList(e.original), levels: fmLevels(e.levels),
                rules: fmRules(e.pairRules), groups: [], pairs: fmPairs(e.pairHistory) });
  });
  const curNames = fmNameList(st.originalNames);
  if(curNames.length){
    const cname = (typeof st.currentClass === "string" && st.currentClass.trim()) ? st.currentClass.trim().slice(0,60) : "FairMix";
    const entry = { name: cname, names: curNames, levels: fmLevels(st.levels), rules: fmRules(st.pairRules),
                    groups: fmGroupsFromState(st), pairs: fmPairs(st.pairHistory), current: true };
    const i = list.findIndex(x => x.name === cname);
    if(i >= 0) list[i] = entry; else list.unshift(entry);       // der aktive Stand ist der neueste
  }
  return list.filter(x => x.names.length);
}
function applyFairMixEntry(e){
  let c = DB.classes.find(x => x.name.toLowerCase() === e.name.toLowerCase());
  let created = false;
  if(!c){
    c = newClassObj(e.name);
    DB.classes.push(c); created = true;
  }
  if(!Array.isArray(c.groups)) c.groups = [];
  const byName = new Map(c.students.map(s => [s.name.toLowerCase(), s]));
  let added = 0;
  e.names.forEach(n => {
    if(byName.has(n.toLowerCase()) || c.students.length >= MAX_STUDENTS) return;
    const s = { id: uid(), name: n, tags: [], level: 0 };
    c.students.push(s); byName.set(n.toLowerCase(), s); added++;
  });
  Object.keys(e.levels).forEach(n => { const s = byName.get(n.toLowerCase()); if(s) s.level = e.levels[n]; });
  let rulesAdded = 0;
  e.rules.forEach(r => {
    const a = byName.get(r.a.toLowerCase()), b = byName.get(r.b.toLowerCase());
    if(!a || !b || a === b) return;
    const ex = c.rules.find(x => (x.a === a.id && x.b === b.id) || (x.a === b.id && x.b === a.id));
    if(ex){ ex.type = r.type; return; }
    if(c.rules.length >= MAX_RULES) return;
    c.rules.push({ id: uid(), type: r.type, a: a.id, b: b.id }); rulesAdded++;
  });
  if(e.groups.length){
    c.groups = e.groups.map(g => ({
      id: uid(), name: g.name, fm: true,
      members: g.members.map(n => byName.get(n.toLowerCase())).filter(Boolean).map(s => s.id)
        .filter((x, i, arr) => arr.indexOf(x) === i)
    })).filter(g => g.members.length);
  }
  if(e.pairs && e.pairs.length){
    /* Als eine gemerkte Sitzordnung ablegen: „Automatisch setzen“ meidet diese Paare dann */
    const pairs = e.pairs.map(([x, y]) => {
      const a = byName.get(x.toLowerCase()), b = byName.get(y.toLowerCase());
      return a && b && a !== b ? pairKey(a.id, b.id) : null;
    }).filter(Boolean);
    if(pairs.length){
      if(!Array.isArray(c.history)) c.history = [];
      c.history = c.history.filter(h => h.src !== "fairmix");
      c.history.unshift({ t: new Date().toISOString(), src: "fairmix", pairs });
      while(c.history.length > HISTORY_MAX) c.history.shift();
    }
  }
  if(Object.keys(e.levels).length && (!c.levelMode || c.levelMode === "off")) c.levelMode = "hetero";
  return { c, created, added, rulesAdded, groups: e.groups.length };
}
function openFairMixImport(list){
  const sheet = sheetBase(t("fmImportTitle"));
  const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = t("fmImportPick");
  sheet.appendChild(hint);
  const chosen = new Set(list.map((_, i) => i).filter(i => list[i].current || list.length === 1));
  if(!chosen.size) chosen.add(0);
  list.forEach((e, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    const mk = document.createElement("span"); mk.className = "mk"; mk.style.borderRadius = "6px";
    const txt = document.createElement("span"); txt.className = "txt";
    const h = document.createElement("b"); h.textContent = e.name;
    const exists = DB.classes.some(x => x.name.toLowerCase() === e.name.toLowerCase());
    const parts = [cnt(e.names.length, "nStudents")];
    if(Object.keys(e.levels).length) parts.push(t("levelsTitle"));
    if(e.rules.length) parts.push(nRulesTxt(e.rules.length));
    if(e.groups.length) parts.push(nGroupsTxt(e.groups.length));
    if(e.pairs && e.pairs.length) parts.push(t("fmHistory"));
    parts.push(exists ? t("fmMerge") : t("fmNew"));
    const sub = document.createElement("span"); sub.className = "sub"; sub.textContent = parts.join(" · ");
    txt.appendChild(h); txt.appendChild(sub);
    b.appendChild(mk); b.appendChild(txt);
    const paint = () => b.classList.toggle("on", chosen.has(i));
    b.onclick = () => { if(chosen.has(i)) chosen.delete(i); else chosen.add(i); paint(); };
    paint();
    sheet.appendChild(b);
  });
  sheetButtons(sheet, t("fmImportGo"), () => {
    if(!chosen.size){ toast(t("fmImportNone")); return; }
    closeModal();
    let classes = 0, names = 0, groups = 0, last = null;
    Array.from(chosen).sort((a, b) => a - b).forEach(i => {
      const r = applyFairMixEntry(list[i]);
      classes++; names += r.added; groups += r.groups;
      if(!last || list[i].current) last = r.c;
    });
    if(last) setCurClass(last.id);
    save(); goNames();
    toast(t("fmImported").replace("{c}", String(classes)).replace("{n}", String(names)) +
          (groups ? " · " + t("fmImportedGroups").replace("{g}", String(groups)) : ""));
  });
}

$("#fmpick").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ toast(t("fmBad")); return; }

/* Nach dem Drehen des Geräts ändert sich die Höhe der Fläche stark. Ohne Neueinpassen
   rechnet die App mit den alten Maßen weiter und der Plan rutscht aus dem Bild. */
let lastWrapW = 0, lastWrapH = 0, resizeTimer = null;
function handleViewportChange(force){
  if(!$("#screen-editor").classList.contains("active")) return;
  const el = $("#stage-wrap");
  const w = el.clientWidth, h = el.clientHeight;
  if(w < 40 || h < 40) return;
  const changed = Math.abs(w - lastWrapW) > 24 || Math.abs(h - lastWrapH) > 24;
  lastWrapW = w; lastWrapH = h;
  if(force || changed || presenting) fitToScreen();     // deutliche Änderung: neu einpassen
  else applyTransform();
}
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => handleViewportChange(false), 120);
});
window.addEventListener("orientationchange", () => {
  setTimeout(() => handleViewportChange(true), 260);    // Maße stehen erst nach dem Umbau fest
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => handleViewportChange(false), 160);
  });
}
/* Ohne eigene Behandlung beendet die Zurücktaste unter Android sofort die App */
function navBack(){
  if($("#modal").classList.contains("on")){ closeModal(); return true; }
  if($("#screen-editor").classList.contains("active")){
    if(presenting){ setPresenting(false); return true; }
    if(lessonMode){ setLesson(false); return true; }
    if(editMode === "room" && curPlanId){ setEditMode("desks"); return true; }
    if(swapSrc){ swapSrc = null; renderStage(false); updateEditorChrome(); return true; }
    if(curPlanId){ goPlans(); return true; }
    goRooms(); return true;
  }
  if(["names","rooms","plans","info","settings"].some(id => $("#screen-" + id).classList.contains("active"))){
    goHome(); return true;
  }
  return false;                                    // Startseite: App darf sich schließen
}
(function registerBackButton(){
  document.addEventListener("deviceready", () => {        // Cordova unter Android
    document.addEventListener("backbutton", e => {
      e.preventDefault();
      if(!navBack() && navigator.app && navigator.app.exitApp) navigator.app.exitApp();
    }, false);
  }, false);
  const P = capPlugins();
  if(P && P.App && P.App.addListener){
    P.App.addListener("backButton", () => {
      if(!navBack() && P.App.exitApp) P.App.exitApp();
    });
  }
  try{ history.replaceState({ app: 1 }, ""); history.pushState({ app: 1 }, ""); }catch(e){}
  window.addEventListener("popstate", () => {
    const handled = navBack();
    try{ history.pushState({ app: 1 }, ""); }catch(e){}
    if(!handled){ /* Startseite erreicht — der Browser darf beim nächsten Mal zurück */ }
  });
})();
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => {
  if(e.target.closest && e.target.closest("#stage")) e.preventDefault();
});
/* Service Worker nur im Web: in der Cordova-App liegen die Dateien ohnehin auf dem Gerät */
if(!window.cordova && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
/* Letzte Änderungen sichern, bevor das System die App anhält oder beendet.
   Cordova meldet das über "pause"; im Browser über visibilitychange/pagehide. */
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushSave(); });
document.addEventListener("pause", flushSave, false);

</script>
<script src="cordova.js"></script>
