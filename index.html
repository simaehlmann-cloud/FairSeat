/* Exakte achsenparallele Hülle — bei freien Winkeln reicht das alte Vertauschen von
   Breite und Höhe nicht mehr aus. */
function itemBox(it){
  const a = ((it.rot || 0) * Math.PI) / 180;
  const c = Math.abs(Math.cos(a)), s2 = Math.abs(Math.sin(a));
  const w = it.w * c + it.h * s2;
  const h = it.w * s2 + it.h * c;
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
  return { x: cx - w / 2, y: cy - h / 2, w: w, h: h, cx: cx, cy: cy };
}
/* Kurzform für die Übersicht: Vorname, sehr lange Namen gekürzt */
function shortLabel(name){
  const first = String(name || "").trim().split(/\s+/)[0] || "";
  return first.length > 9 ? first.slice(0, 8) + "." : first;
}
function itemLabel(it){
  if(it.type === "desk"){
    const s = studentById(curClass(), it.studentId);
    if(s) return s.name;
    return typeof it.label === "string" ? it.label : "";
  }
  return typeof it.label === "string" ? it.label : tItem(it.type);
}
function placeEl(el, it){
  el.style.transform = "translate(" + it.x + "px," + it.y + "px) rotate(" + (it.rot || 0) + "deg)";
  if(it.tbl) queueTables();                            // Tischplatte folgt den Stühlen
  const lbl = el.firstChild;
  if(lbl && lbl.classList && lbl.classList.contains("lbl")){
    const counter = -(it.rot || 0) + (mirrored ? 180 : 0);   // Text bleibt lesbar
    lbl.style.transform = "rotate(" + counter + "deg)";
  }
}
let examNoCache = null;
function renderStage(full){
  const stage = $("#stage");
  examNoCache = null;
  useRoomSize(curRoom());
  if(full){ stage.textContent = ""; elCache.clear(); tableEls.clear(); }
  applyTransform();
  const list = allItems();
  const seen = new Set();
  list.forEach(it => {
    seen.add(it.id);
    let el = elCache.get(it.id);
    if(!el){
      el = document.createElement("div");
      const lbl = document.createElement("span");
      lbl.className = "lbl";
      el.appendChild(lbl);
      el.dataset.id = it.id;
      stage.appendChild(el);
      elCache.set(it.id, el);
    }
    const isDesk = it.type === "desk";
    const active = (presenting || lessonMode) ? isDesk : ((editMode === "room") ? !isDesk : isDesk);
    const full = itemLabel(it);
    const label = isDesk && shortBand ? shortLabel(full) : full;
    const isAbsent = lessonMode && isDesk && it.studentId && lessonAbsent(it.studentId);
    el.className = "item t-" + it.type
      + (isDesk && it.w === it.h && it.w <= 70 ? " seat" : "")
      + (isDesk && it.w >= 150 ? " wide" : "")
      + (isDesk && !label ? " empty" : "")
      + (selected.has(it.id) ? " sel" : "")
      + (isAbsent ? " absent" : "")
      + (pickedId && it.studentId === pickedId ? " picked" : "")
      + (swapSrc === it.id ? " swapsrc" : "")
      + (searchHits.has(it.id) ? " found" : "")
      + (!presenting && !lessonMode && !active ? " dim" : "")
      + (lessonMode && !isDesk ? " dim" : "");
    el.style.width = it.w + "px";
    el.style.height = it.h + "px";
    el.firstChild.textContent = label;
    /* Lange Namen wurden bisher umgebrochen oder abgeschnitten */
    /* Herausgezoomt wächst die Schrift bis an den Tischrand, damit Vornamen lesbar bleiben */
    const base0 = presenting ? 17 : (it.type === "desk" ? 12.5 : 11.5);
    const base = isDesk && shortBand ? Math.min(30, base0 * 0.5 / Math.max(zoom, 0.05)) : base0;
    const len = Math.max(1, label.length);
    const byWidth = (it.w - 10) / (len * 0.56);
    const byHeight = (it.h - 8) / 1.2;
    el.style.fontSize = clamp(Math.min(base, byWidth, byHeight), 6.5, base).toFixed(1) + "px";
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", (full || tItem(it.type)) +
      (isDesk ? ", " + tItem("desk") : "") + (isAbsent ? ", " + t("absent") : ""));
    placeEl(el, it);
    let dot = el.querySelector(".dot");
    const wantDot = lessonMode && isDesk && it.studentId && !!lessonNote(it.studentId);
    if(wantDot && !dot){ dot = document.createElement("i"); dot.className = "dot"; el.appendChild(dot); }
    else if(!wantDot && dot) dot.remove();
    /* Klassenarbeit: Gruppe A/B und Platznummer auf dem Tisch */
    let ex = el.querySelector(".exbadge");
    const wantEx = isDesk && curPlan() && curPlan().exam && it.var;
    if(wantEx && !ex){ ex = document.createElement("i"); ex.className = "exbadge"; el.appendChild(ex); }
    else if(!wantEx && ex) ex.remove();
    if(wantEx){
      ex.textContent = it.var; ex.classList.toggle("b", it.var === "B");
      if(!examNoCache) examNoCache = examNumbers(curPlan());
      ex.dataset.no = String(examNoCache.get(it.id) || "");
    }
    let lk = el.querySelector(".lockmark");
    const wantLock = isDesk && it.locked && it.studentId && !viewLocked();
    if(wantLock && !lk){ lk = document.createElement("i"); lk.className = "lockmark"; lk.appendChild(icon("lock")); el.appendChild(lk); }
    else if(!wantLock && lk) lk.remove();
    let pd = el.querySelector(".pdot");
    const pc = isDesk && it.studentId ? seatGroupColor(it.studentId) : null;
    if(pc && !pd){ pd = document.createElement("i"); pd.className = "pdot"; el.appendChild(pd); }
    else if(!pc && pd) pd.remove();
    if(pc) pd.style.background = pc;
    let tag = el.querySelector(".grouptag");
    if(it.groupId && !it.tbl){                         // an Tischen zeigt die Tischplatte die Gruppe
      if(!tag){ tag = document.createElement("i"); tag.className = "grouptag"; el.appendChild(tag); }
      tag.style.background = GROUP_COLORS[hashIdx(it.groupId)];
    } else if(tag) tag.remove();
  });
  elCache.forEach((el, id) => { if(!seen.has(id)){ el.remove(); elCache.delete(id); } });
  renderTables();
  $("#selbar").classList.toggle("on", selected.size > 0 && !viewLocked() && !lessonMode);
  const selDesks = planDesks().filter(d => selected.has(d.id) && d.studentId);
  const lockBtn = $("#sb-lock");
  /* Ein einzelner besetzter Platz: Tauschen, Leeren, Notiz/Anwesenheit direkt in der Leiste */
  const one = selDesks.length === 1 && planDesks().filter(d => selected.has(d.id)).length >= 1 ? selDesks[0] : null;
  const showOne = !!(one && editMode === "desks");
  ["#sb-swap", "#sb-clear"].forEach(id => { const b = $(id); if(b) b.style.display = showOne ? "" : "none"; });
  if($("#sb-note")) $("#sb-note").style.display = showOne && DB.settings.lesson ? "" : "none";
  if(lockBtn){
    lockBtn.style.display = (editMode === "desks" && selDesks.length) ? "" : "none";
    $("#sb-lock-t").textContent = selDesks.length && selDesks.every(d => d.locked) ? t("unlockSeat") : t("lockSeat");
  }
  const cnt = $("#sb-count");
  if(cnt) cnt.textContent = selected.size ? t("selCount").replace("{n}", String(selected.size)) : "";
  updateRotHandle();
}
function applyTransform(){
  applyTransformOnly();
  updateRotHandle();
}
let shortBand = false;
function applyTransformOnly(){
  const stage = $("#stage");
  stage.dataset.grid = zoom < 0.4 ? "off" : "on";
  const band = zoom < 0.55;
  if(band !== shortBand){ shortBand = band; if(elCache.size) requestAnimationFrame(() => renderStage(false)); }
  if(mirrored){
    stage.style.transformOrigin = "0 0";
    stage.style.transform = "translate(" + (panX + ROOM_W * zoom) + "px," + (panY + ROOM_H * zoom) + "px) scale(" + zoom + ") rotate(180deg)";
  } else {
    stage.style.transformOrigin = "0 0";
    stage.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
  }
}
const ZOOM_MIN = 0.03;                     // ein 40-m-Saal passt noch auf ein Handy
function fitToScreen(){
  const wrap = $("#stage-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(w < 40 || h < 40){ zoom = 0.5; panX = 0; panY = 0; applyTransform(); return; }   // Schutz vor zoom = 0
  zoom = Math.min(w / ROOM_W, h / ROOM_H) * 0.94;
  panX = (w - ROOM_W * zoom) / 2;
  panY = (h - ROOM_H * zoom) / 2;
  applyTransform();
}
function zoomBy(f){
  const wrap = $("#stage-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const nz = clamp(zoom * f, ZOOM_MIN, 4);
  panX = w / 2 - (w / 2 - panX) * (nz / zoom);
  panY = h / 2 - (h / 2 - panY) * (nz / zoom);
  zoom = nz; applyTransform();
}
$("#btn-zin").onclick = () => zoomBy(1.25);
$("#btn-zout").onclick = () => zoomBy(0.8);
$("#btn-fit").onclick = fitToScreen;
$("#btn-mirror").onclick = () => { mirrored = !mirrored; applyTransform(); renderStage(false); updateEditorChrome(); };
$("#btn-tool").onclick = () => {

let presentLocked = false;
$("#btn-lock").onclick = () => {

$("#btn-present").onclick = () => setPresenting(true);
/* Auf dem Handy wandern selten genutzte Knöpfe in dieses Menü, damit der Planname lesbar bleibt */
$("#btn-more").onclick = () => {

/* ============ 14. Zeigergesten: Ziehen, Schwenken, Zoomen, Rahmenauswahl ============ */
const wrap = $("#stage-wrap");
const pointers = new Map();
let dragging = null, panning = null, pinch = null, marquee = null, movedFar = false;
let tapCandidate = null, wasSelectedBeforeTap = false, downOnSelected = false;
let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
let guideEls = [], marqueeEl = null;

/* Raumkoordinate -> Bildschirmkoordinate innerhalb der Fläche (Gegenstück zu screenToRoom) */
function roomToScreen(x, y){
  if(mirrored) return { x: panX + (ROOM_W - x) * zoom, y: panY + (ROOM_H - y) * zoom };
  return { x: panX + x * zoom, y: panY + y * zoom };
}
function selectionBounds(){
  const set = movingSet();
  if(!set.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  set.forEach(i => {
    const b = itemBox(i);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  });
  return { x0: x0, y0: y0, x1: x1, y1: y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
/* Setzt den Drehgriff mittig über die Auswahl — in Bildschirmkoordinaten,
   damit er unabhängig vom Zoom immer gleich groß und gut greifbar bleibt. */
function updateRotHandle(){
  const handle = $("#rothandle"), badge = $("#rotbadge");
  if(!handle) return;
  const visible = selected.size > 0 && !viewLocked() && !lessonMode && !dragging;
  handle.classList.toggle("on", visible);
  if(!visible){ badge.classList.remove("on"); return; }
  const b = selectionBounds();
  if(!b){ handle.classList.remove("on"); return; }
  const corners = [[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].map(p => roomToScreen(p[0], p[1]));
  const cx = corners.reduce((a,p) => a + p.x, 0) / 4;
  const topY = Math.min.apply(null, corners.map(p => p.y));
  const wrapEl = $("#stage-wrap");
  const px = clamp(cx, 26, Math.max(26, wrapEl.clientWidth - 26));
  const py = clamp(topY - 40, 30, Math.max(30, wrapEl.clientHeight - 70));
  handle.style.left = px + "px";
  handle.style.top = py + "px";
  badge.style.left = px + "px";
  badge.style.top = py + "px";
}

function screenToRoom(clientX, clientY){
  const r = wrap.getBoundingClientRect();
  let x = (clientX - r.left - panX) / zoom;
  let y = (clientY - r.top - panY) / zoom;
  if(mirrored){ x = ROOM_W - x; y = ROOM_H - y; }
  return { x, y };
}
/* Vollbild: Solange die Ansicht nicht gesperrt ist, lassen sich Plätze
   verschieben, zoomen und schwenken – nur die Leisten sind ausgeblendet. */
const viewLocked = () => presenting && presentLocked;
function isInteractive(it){
  if(lessonMode || viewLocked()) return false;
  if(presenting) return it.type === "desk";
  return editMode === "room" ? it.type !== "desk" : it.type === "desk";
}
function selectWithGroup(it){
  const list = activeList();
  if(it.groupId) list.filter(i => i.groupId === it.groupId).forEach(i => selected.add(i.id));
  else selected.add(it.id);
}
function movingSet(){
  const list = activeList();
  const ids = new Set();
  list.filter(i => selected.has(i.id)).forEach(i => {
    if(i.groupId) list.filter(x => x.groupId === i.groupId).forEach(x => ids.add(x.id));
    else ids.add(i.id);
  });
  return list.filter(i => ids.has(i.id));
}
const selItems = () => activeList().filter(i => selected.has(i.id));

/* Die Bedienleisten liegen über der Fläche. Ohne diese Sperre löscht ein Tippen auf
   „Gruppieren“ erst die Auswahl und der Knopf läuft anschließend ins Leere. */
function onOverlayControl(target){
  return !!(target && target.closest &&
    target.closest(".selbar, .lessonbar, .zoombar, .stagehint, .rothandle, .rotbadge, .lockbtn, .coach"));
}
wrap.addEventListener("pointerdown", e => {
  if(viewLocked()) return;                        // gesperrte Vollansicht nimmt keine Gesten an
  if(onOverlayControl(e.target)) return;
  try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pointers.size === 2){
    if(nameDrag) endNameDrag();
    dragging = null; panning = null; marquee = null; clearGuides(); clearMarquee();
    const pts = Array.from(pointers.values());
    const secondEl = e.target && e.target.closest ? e.target.closest(".item") : null;
    const secondIt = secondEl ? findItem(secondEl.dataset.id) : null;
    const onSel = downOnSelected || !!(secondIt && selected.has(secondIt.id));
    const rotating = selected.size > 0 && onSel && !lessonMode && !viewLocked();
    const set = rotating ? movingSet() : null;
    const b = rotating ? selectionBounds() : null;
    pinch = { d: Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)), z: zoom,
              cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2, px: panX, py: panY,
              /* Liegt ein Finger auf der Auswahl, dreht die Geste statt zu zoomen */
              rotate: !!(rotating && set && set.length && b),
              set: set, orig: set ? snapshotSet(set) : null,
              roomCentre: b ? { cx: b.cx, cy: b.cy } : null,
              baseRot: (set && set.length) ? (set[0].rot || 0) : 0,
              a0: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x),
              pushed: false };
    return;
  }
  if(pointers.size > 2) return;

  movedFar = false;
  const itemEl = e.target.closest ? e.target.closest(".item") : null;
  const it = itemEl ? findItem(itemEl.dataset.id) : null;
  downOnSelected = !!(it && selected.has(it.id));

  /* Ohne Modi: Ein Name lässt sich jederzeit auf einen anderen Platz ziehen (tauscht).
     Den Tisch selbst verschiebt man, nachdem man ihn angetippt hat – oder sofort mit
     langem Drücken. Leere und festgehaltene Plätze verschieben sich direkt. */
  const deskHit = it && it.type === "desk" && (editMode === "desks" || presenting) && !lessonMode && curPlanId;
  if(deskHit && armedStudent){
    placeStudent(armedStudent, it, null);
    return;
  }
  if(deskHit && swapSrc){
    const src = findItem(swapSrc);
    swapSrc = null;
    if(src && src !== it && src.studentId) placeStudent(src.studentId, it, src);
    else renderStage(false);
    updateEditorChrome();
    return;
  }
  if(deskHit && it.studentId && !it.locked && !selected.has(it.id) && tool !== "select"){
    const startX = e.clientX, startY = e.clientY;
    startNameDrag(e, it.studentId, it.id,
      () => { selected.clear(); selectWithGroup(it); renderStage(false); },          // Antippen: auswählen
      () => {                                                                          // lang drücken: Tisch greifen
        selected.clear(); selectWithGroup(it); renderStage(false); haptic(18);
        const set = movingSet();
        pushUndo();
        dragging = { sx: startX, sy: startY, orig: set.map(i => ({ i: i, x: i.x, y: i.y })) };
      });
    return;
  }

  if(it && isInteractive(it)){
    if(tool === "select"){
      /* Im Auswahlmodus sammelt jedes Antippen weitere Tische an, statt die Auswahl zu ersetzen */
      tapCandidate = it.id;
      wasSelectedBeforeTap = selected.has(it.id);
      if(!selected.has(it.id)){ selectWithGroup(it); renderStage(false); }
    } else if(!selected.has(it.id)){
      selected.clear(); selectWithGroup(it); renderStage(false);
    }
    const set = movingSet();
    pushUndo();
    dragging = { sx: e.clientX, sy: e.clientY, orig: set.map(i => ({ i: i, x: i.x, y: i.y })) };
  } else if(tool === "select" && !lessonMode){
    const p0 = screenToRoom(e.clientX, e.clientY);
    marquee = { x0: p0.x, y0: p0.y, x1: p0.x, y1: p0.y, add: e.shiftKey };
    if(!marquee.add) { selected.clear(); renderStage(false); }
  } else {
    panning = { sx: e.clientX, sy: e.clientY, px: panX, py: panY };
  }
});

wrap.addEventListener("pointermove", e => {
  if(!pointers.has(e.pointerId)) return;
  if(onOverlayControl(e.target) && !dragging && !panning && !marquee && !pinch) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pinch && pointers.size >= 2){
    const pts = Array.from(pointers.values());
    if(pinch.rotate){
      const a1 = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      let target = pinch.baseRot + ((a1 - pinch.a0) * 180) / Math.PI;
      const nearest = Math.round(target / 15) * 15;
      if(Math.abs(target - nearest) < 4) target = nearest;
      if(!pinch.pushed){ pushUndo(); pinch.pushed = true; }
      rotateSet(pinch.set, pinch.orig, pinch.roomCentre, target - pinch.baseRot);
      const badge = $("#rotbadge");
      badge.classList.add("on");
      badge.textContent = (((Math.round(target) % 360) + 360) % 360) + "°";
      updateRotHandle();
      return;
    }
    const d = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
    const nz = clamp(pinch.z * (d / pinch.d), ZOOM_MIN, 4);
    const r = wrap.getBoundingClientRect();
    const cx = pinch.cx - r.left, cy = pinch.cy - r.top;
    panX = cx - (cx - pinch.px) * (nz / pinch.z);
    panY = cy - (cy - pinch.py) * (nz / pinch.z);
    zoom = nz; applyTransform();
    return;
  }
  if(dragging){
    let dx = (e.clientX - dragging.sx) / zoom;
    let dy = (e.clientY - dragging.sy) / zoom;
    if(mirrored){ dx = -dx; dy = -dy; }
    if(Math.abs(e.clientX - dragging.sx) > 3 || Math.abs(e.clientY - dragging.sy) > 3) movedFar = true;
    const snap = computeSnap(dragging.orig, dx, dy);
    dragging.orig.forEach(o => {
      o.i.x = clamp(Math.round(o.x + dx + snap.dx), -80, ROOM_W - 20);
      o.i.y = clamp(Math.round(o.y + dy + snap.dy), -80, ROOM_H - 20);
      const el = elCache.get(o.i.id);
      if(el) placeEl(el, o.i);                       // nur Transform aktualisieren, kein Neuaufbau
    });
    drawGuides(snap.guides);
    return;
  }
  if(marquee){
    const p1 = screenToRoom(e.clientX, e.clientY);
    marquee.x1 = p1.x; marquee.y1 = p1.y;
    movedFar = true;
    drawMarquee();
    return;
  }
  if(panning){
    panX = panning.px + (e.clientX - panning.sx);
    panY = panning.py + (e.clientY - panning.sy);
    if(Math.abs(e.clientX - panning.sx) > 3 || Math.abs(e.clientY - panning.sy) > 3) movedFar = true;
    applyTransform();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  try{ wrap.releasePointerCapture(e.pointerId); }catch(err){}
  if(pointers.size < 2){
    if(pinch && pinch.rotate){
      $("#rotbadge").classList.remove("on");
      if(pinch.pushed){ save(); haptic(); }
      renderStage(false);
    }
    pinch = null;
  }

  if(dragging){
    const movedItems = dragging.orig.map(o => o.i);
    dragging = null; clearGuides();
    /* Einzeln verschobene Türen, Fenster und Tafeln rasten an der nächsten Wand ein */
    if(movedFar && movedItems.length === 1 && snapToWall(movedItems[0])){ renderStage(false); haptic(); }
    save();
    if(!movedFar){
      undoStack.pop();                              // reiner Tap erzeugt keinen Undo-Schritt
      if(tool === "select" && tapCandidate){
        /* Erneutes Antippen nimmt den Tisch wieder aus der Auswahl */
        const it2 = findItem(tapCandidate);
        if(it2 && wasSelectedBeforeTap){
          const grp = it2.groupId
            ? activeList().filter(x => x.groupId === it2.groupId).map(x => x.id)
            : [it2.id];
          grp.forEach(id => selected.delete(id));
        }
        renderStage(false);
      }
    }
    tapCandidate = null;
    updateUndoButtons();
    return;
  }
  if(marquee){
    const x0 = Math.min(marquee.x0, marquee.x1), x1 = Math.max(marquee.x0, marquee.x1);
    const y0 = Math.min(marquee.y0, marquee.y1), y1 = Math.max(marquee.y0, marquee.y1);
    activeList().forEach(it => {
      const b = itemBox(it);
      if(b.cx >= x0 && b.cx <= x1 && b.cy >= y0 && b.cy <= y1) selected.add(it.id);
    });
    marquee = null; clearMarquee(); renderStage(false);
    return;
  }
  if(panning){
    const onItem = e.target && e.target.closest && e.target.closest(".item");
    /* Doppeltipp auf freie Fläche: heranzoomen und wieder einpassen */
    if(!movedFar && !onItem && !lessonMode){
      const now = Date.now();
      if(now - lastTapAt < 320 && Math.abs(e.clientX - lastTapX) < 34 && Math.abs(e.clientY - lastTapY) < 34){
        lastTapAt = 0;
        const wrapRect = wrap.getBoundingClientRect();
        const fit = Math.min(wrap.clientWidth / ROOM_W, wrap.clientHeight / ROOM_H) * 0.94;
        if(zoom > fit * 1.4) fitToScreen();
        else {
          const px = e.clientX - wrapRect.left, py = e.clientY - wrapRect.top;
          const nz = clamp(fit * 2.2, ZOOM_MIN, 4);
          panX = px - (px - panX) * (nz / zoom);
          panY = py - (py - panY) * (nz / zoom);
          zoom = nz; applyTransform();
        }
        panning = null;
        haptic();
        return;
      }
      lastTapAt = now; lastTapX = e.clientX; lastTapY = e.clientY;
    }
    if(!movedFar && onItem && lessonMode){
      const it = findItem(onItem.dataset.id);
      if(it && it.type === "desk" && it.studentId) openLessonSheet(it);
    } else if(!movedFar && !onItem && !(e.target.closest && e.target.closest(".selbar"))){
      selected.clear(); renderStage(false);
    }
    panning = null;
  }
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("lostpointercapture", e => { if(pointers.has(e.pointerId)) endPointer(e); });
wrap.addEventListener("wheel", e => {
  if(viewLocked()) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });

/* --- Ausrichtungshilfen: Kanten und Mitten anderer Objekte --- */
const SNAP_PX = 7;
function computeSnap(orig, dx, dy){
  const moving = orig.map(o => o.i);
  const movingIds = new Set(moving.map(i => i.id));
  const boxes = moving.map(i => {
    const b = itemBox({ x: (orig.find(o => o.i === i).x + dx), y: (orig.find(o => o.i === i).y + dy),
                        w: i.w, h: i.h, rot: i.rot });
    return b;
  });
  const bx0 = Math.min.apply(null, boxes.map(b => b.x));
  const bx1 = Math.max.apply(null, boxes.map(b => b.x + b.w));
  const by0 = Math.min.apply(null, boxes.map(b => b.y));
  const by1 = Math.max.apply(null, boxes.map(b => b.y + b.h));
  const bcx = (bx0 + bx1) / 2, bcy = (by0 + by1) / 2;

  const others = activeList().filter(i => !movingIds.has(i.id)).map(itemBox);
  const tol = SNAP_PX / Math.max(zoom, .2);
  let best = { dx: 0, dy: 0, gx: null, gy: null, dxd: tol + 1, dyd: tol + 1 };

  const tryX = (mine, theirs, line) => {
    const d = theirs - mine;
    if(Math.abs(d) < best.dxd){ best.dxd = Math.abs(d); best.dx = d; best.gx = line; }
  };
  const tryY = (mine, theirs, line) => {
    const d = theirs - mine;
    if(Math.abs(d) < best.dyd){ best.dyd = Math.abs(d); best.dy = d; best.gy = line; }
  };
  others.forEach(o => {
    const ox = [o.x, o.x + o.w, o.x + o.w / 2];
    [[bx0, 0], [bx1, 1], [bcx, 2]].forEach(([mine]) => {
      ox.forEach(v => { if(Math.abs(v - mine) <= tol) tryX(mine, v, v); });
    });
    const oy = [o.y, o.y + o.h, o.y + o.h / 2];
    [[by0, 0], [by1, 1], [bcy, 2]].forEach(([mine]) => {
      oy.forEach(v => { if(Math.abs(v - mine) <= tol) tryY(mine, v, v); });
    });
  });
  const guides = [];
  if(best.gx !== null) guides.push({ vertical: true, at: best.gx });
  if(best.gy !== null) guides.push({ vertical: false, at: best.gy });
  if(best.dxd > tol) best.dx = 0;
  if(best.dyd > tol) best.dy = 0;
  if((best.dx || best.dy) && !computeSnap.buzzed){ computeSnap.buzzed = true; haptic(6); }
  if(!best.dx && !best.dy) computeSnap.buzzed = false;
  return { dx: best.dx, dy: best.dy, guides };
}

/* ---- Drehgriff: mit dem Finger im Kreis ziehen, wie bei einem Textprogramm ---- */
let rotDrag = null;
const rotHandleEl = $("#rothandle");
rotHandleEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  e.stopPropagation();
  const set = movingSet();
  if(!set.length) return;
  const b = selectionBounds();
  if(!b) return;
  const wrapRect = $("#stage-wrap").getBoundingClientRect();
  const centre = roomToScreen(b.cx, b.cy);
  const scx = wrapRect.left + centre.x, scy = wrapRect.top + centre.y;
  rotDrag = {
    set: set,
    orig: snapshotSet(set),
    roomCentre: { cx: b.cx, cy: b.cy },
    scx: scx, scy: scy,
    start: Math.atan2(e.clientY - scy, e.clientX - scx),
    baseRot: set[0].rot || 0,
    moved: false
  };
  try{ rotHandleEl.setPointerCapture(e.pointerId); }catch(err){}
  rotHandleEl.classList.add("active");
  $("#rotbadge").classList.add("on");
  pushUndo();
});
rotHandleEl.addEventListener("pointermove", e => {
  if(!rotDrag) return;
  e.preventDefault();
  const now = Math.atan2(e.clientY - rotDrag.scy, e.clientX - rotDrag.scx);
  let deg = ((now - rotDrag.start) * 180) / Math.PI;
  if(mirrored) deg = deg;                       // 180-Grad-Spiegelung dreht den Drehsinn nicht um
  let target = rotDrag.baseRot + deg;
  const nearest = Math.round(target / 15) * 15;
  const snapped = Math.abs(target - nearest) < 5;   // rastet sanft auf glatte Winkel ein
  if(snapped) target = nearest;
  const delta = target - rotDrag.baseRot;
  rotateSet(rotDrag.set, rotDrag.orig, rotDrag.roomCentre, delta);
  rotDrag.moved = true;
  const shown = ((Math.round(target) % 360) + 360) % 360;
  const badge = $("#rotbadge");
  badge.textContent = shown + "°";
  badge.classList.toggle("snap", snapped);
  updateRotHandle();
});
function endRotDrag(e){
  if(!rotDrag) return;
  try{ rotHandleEl.releasePointerCapture(e.pointerId); }catch(err){}
  rotHandleEl.classList.remove("active");
  $("#rotbadge").classList.remove("on");
  if(!rotDrag.moved) undoStack.pop();            // reines Antippen ändert nichts
  else { save(); haptic(); }
  rotDrag = null;
  updateUndoButtons();
  renderStage(false);
}
rotHandleEl.addEventListener("pointerup", endRotDrag);
rotHandleEl.addEventListener("pointercancel", endRotDrag);

function selectionCentre(set){
  return {
    cx: set.reduce((a,i) => a + i.x + i.w/2, 0) / set.length,
    cy: set.reduce((a,i) => a + i.y + i.h/2, 0) / set.length
  };
}
/* Dreht die Auswahl um einen beliebigen Winkel um ihre gemeinsame Mitte */
function rotateSet(set, orig, centre, deg){
  if(!set || !set.length || !orig || !centre) return;      // schützt vor unvollständigen Gesten
  const a = (deg * Math.PI) / 180, cos = Math.cos(a), sin = Math.sin(a);
  set.forEach((it, k) => {
    const o = orig[k];
    const ix = o.x + it.w/2 - centre.cx, iy = o.y + it.h/2 - centre.cy;
    it.x = Math.round(centre.cx + (ix * cos - iy * sin) - it.w/2);
    it.y = Math.round(centre.cy + (ix * sin + iy * cos) - it.h/2);
    it.rot = ((Math.round(o.rot + deg) % 360) + 360) % 360;
    keepInRoom(it, 0);
    const el = elCache.get(it.id);
    if(el) placeEl(el, it);
  });
}
const snapshotSet = set => set.map(i => ({ x: i.x, y: i.y, rot: i.rot || 0 }));

     den Raum, Tische immer in den Plan. Andernfalls landen Möbel in plan.desks und
     werden beim nächsten Laden als ungültig verworfen — stiller Datenverlust. */
  const list = (type === "desk") ? planDesks() : roomItems();

    : { id: uid(), type, w: def.w, h: def.h, rot: 0,

        y: Math.round((ROOM_H / 2 - def.h / 2) / 5) * 5 + (n % 5) * 14 };

}

const FLOOR_COLORS = { plain:"#FFFFFF", parquet:"#ECD8B8", tiles:"#F1F4F6", carpet:"#E4E8F1", stone:"#E9E6E0" };
function miniPlan(room, cls){
  const NS = "http://www.w3.org/2000/svg";
  const W = room.w || ROOM_DEF_W, H = room.h || ROOM_DEF_H;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", (-W * 0.03) + " " + (-H * 0.03) + " " + (W * 1.06) + " " + (H * 1.06));
  svg.setAttribute("class", cls || "miniplan");
  svg.setAttribute("aria-hidden", "true");
  const fl = document.createElementNS(NS, "rect");
  fl.setAttribute("width", W); fl.setAttribute("height", H);
  fl.setAttribute("fill", FLOOR_COLORS[room.floor] || "#FFFFFF");
  fl.setAttribute("stroke", "#4A5563"); fl.setAttribute("stroke-width", Math.max(W, H) / 70);
  svg.appendChild(fl);
  (room.items || []).forEach(it => {
    const round = ROUND_TYPES.indexOf(it.type) >= 0;
    const el = document.createElementNS(NS, round ? "ellipse" : "rect");
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    if(round){ el.setAttribute("cx", cx); el.setAttribute("cy", cy); el.setAttribute("rx", it.w / 2); el.setAttribute("ry", it.h / 2); }
    else { el.setAttribute("x", it.x); el.setAttribute("y", it.y); el.setAttribute("width", it.w); el.setAttribute("height", it.h); el.setAttribute("rx", 4); }
    if(it.rot) el.setAttribute("transform", "rotate(" + it.rot + " " + cx + " " + cy + ")");
    el.setAttribute("fill", PRINT_FILL[it.type] || "#FFFFFF");
    el.setAttribute("stroke", "#16232B"); el.setAttribute("stroke-width", Math.max(W, H) / 400);
    svg.appendChild(el);
  });
  return svg;
}

/* ---- Wand-Einrasten: Türen und Fenster immer, Tafeln in Wandnähe ---- */
function snapToWall(it, force){
  if(!it || (WALL_ALWAYS.indexOf(it.type) < 0 && WALL_NEAR.indexOf(it.type) < 0)) return false;
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
  const d = [["top", cy], ["right", ROOM_W - cx], ["bottom", ROOM_H - cy], ["left", cx]].sort((a, b) => a[1] - b[1])[0];
  const always = WALL_ALWAYS.indexOf(it.type) >= 0;
  if(!always && !force && d[1] > 150) return false;
  const along = (lo, hi, v) => clamp(v, lo, hi);
  let ncx = cx, ncy = cy;
  if(d[0] === "top" || d[0] === "bottom"){
    it.rot = d[0] === "top" ? 0 : 180;
    ncy = d[0] === "top" ? it.h / 2 : ROOM_H - it.h / 2;
    ncx = along(it.w / 2, ROOM_W - it.w / 2, cx);
  } else {
    it.rot = d[0] === "left" ? 270 : 90;
    ncx = d[0] === "left" ? it.h / 2 : ROOM_W - it.h / 2;
    ncy = along(it.w / 2, ROOM_H - it.w / 2, cy);
  }
  it.x = Math.round(ncx - it.w / 2); it.y = Math.round(ncy - it.h / 2);
  return true;
}

/* ---- Möbel-Palette: Antippen setzt in die Mitte der Ansicht, Ziehen legt genau ab ---- */
function buildItemGrid(){

/* Mitte des sichtbaren Ausschnitts in Raumkoordinaten */
function viewCentre(){
  const r = wrap.getBoundingClientRect();
  const p = screenToRoom(r.left + r.width / 2, r.top + r.height / 2);
  return { x: clamp(p.x, 40, ROOM_W - 40), y: clamp(p.y, 40, ROOM_H - 40) };
}
function placeFromPalette(type, at){
  if(editMode !== "room" && curPlanId) setEditMode("room");          // Möbel gehören in den Raum
  const go = label => {
    const it = addItem(type, label, at || viewCentre());
    if(it && snapToWall(it)){ save(); renderStage(false); toast(t("wallSnapped")); }
  };
  if(type === "label") askText(t("labelText"), "", "", t("create"), v => go(v));
  else go();
}
let itemDrag = null;
function startItemDrag(e, type){
  /* Mit der Maus lässt sich in jede Richtung ziehen. Mit dem Finger beginnt das
     Ziehen nur waagerecht (Tablet: Seitenleiste neben dem Plan) – senkrecht
     scrollt die Palette, das Antippen setzt das Objekt in die Mitte. */
  itemDrag = { type, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, mouse: e.pointerType === "mouse" };
  const move = ev => {
    if(!itemDrag) return;
    const dx = Math.abs(ev.clientX - itemDrag.sx), dy = Math.abs(ev.clientY - itemDrag.sy);
    if(!itemDrag.moved && Math.hypot(dx, dy) > 6 && (itemDrag.mouse || dx > dy)){
      itemDrag.moved = true;
      const g = document.createElement("div");
      g.className = "dragghost"; g.textContent = tItem(type);
      document.body.appendChild(g); itemDrag.ghost = g;
    }
    if(itemDrag.moved){ ev.preventDefault(); itemDrag.ghost.style.left = ev.clientX + "px"; itemDrag.ghost.style.top = ev.clientY + "px"; }
  };
  const end = ev => {
    document.removeEventListener("pointermove", move, true);
    document.removeEventListener("pointerup", end, true);
    document.removeEventListener("pointercancel", end, true);
    const d = itemDrag; itemDrag = null;
    if(!d) return;
    if(d.ghost) d.ghost.remove();
    if(!d.moved || ev.type === "pointercancel"){ if(ev.type !== "pointercancel") placeFromPalette(type, null); return; }
    const r = wrap.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return;
    const p = screenToRoom(ev.clientX, ev.clientY);
    placeFromPalette(type, { x: clamp(p.x, 0, ROOM_W), y: clamp(p.y, 0, ROOM_H) });
  };
  document.addEventListener("pointermove", move, true);
  document.addEventListener("pointerup", end, true);
  document.addEventListener("pointercancel", end, true);
}

let swapSrc = null, armedStudent = null, nameDrag = null;
function deskUnder(x, y){
  const el = document.elementFromPoint(x, y);
  const itEl = el && el.closest ? el.closest("#stage .item") : null;
  if(!itEl) return null;
  const it = findItem(itEl.dataset.id);
  return it && it.type === "desk" && planDesks().indexOf(it) >= 0 ? it : null;
}
const HOLD_MS = 420;
function startNameDrag(e, studentId, fromDeskId, onTap, onHold){
  if(nameDrag) return;
  nameDrag = { id: studentId, from: fromDeskId, sx: e.clientX, sy: e.clientY, moved: false,
               ghost: null, target: null, onTap: onTap, hold: null };
  if(onHold) nameDrag.hold = setTimeout(() => {
    if(!nameDrag || nameDrag.moved) return;
    endNameDrag();                                   // ab jetzt übernimmt das normale Ziehen
    onHold();
  }, HOLD_MS);
  document.addEventListener("pointermove", onNameDragMove, true);
  document.addEventListener("pointerup", onNameDragEnd, true);
  document.addEventListener("pointercancel", onNameDragCancel, true);
}
function setDropTarget(it){
  if(nameDrag.target === (it ? it.id : null)) return;
  if(nameDrag.target){ const old = elCache.get(nameDrag.target); if(old) old.classList.remove("droptarget"); }
  nameDrag.target = it ? it.id : null;
  if(it){ const el = elCache.get(it.id); if(el) el.classList.add("droptarget"); }
}
function onNameDragMove(e){
  if(!nameDrag) return;
  if(!nameDrag.moved && Math.hypot(e.clientX - nameDrag.sx, e.clientY - nameDrag.sy) > 6 && nameDrag.id){
    nameDrag.moved = true;
    clearTimeout(nameDrag.hold);
    const st = studentById(curClass(), nameDrag.id);
    const g = document.createElement("div");
    g.className = "dragghost"; g.textContent = st ? st.name : "";
    document.body.appendChild(g);
    nameDrag.ghost = g;
    haptic();
  }
  if(!nameDrag.moved) return;
  e.preventDefault();
  nameDrag.ghost.style.left = e.clientX + "px";
  nameDrag.ghost.style.top = e.clientY + "px";
  const it = deskUnder(e.clientX, e.clientY);
  setDropTarget(it && it.id !== nameDrag.from ? it : null);
}
function endNameDrag(){
  document.removeEventListener("pointermove", onNameDragMove, true);
  document.removeEventListener("pointerup", onNameDragEnd, true);
  document.removeEventListener("pointercancel", onNameDragCancel, true);
  if(nameDrag){
    clearTimeout(nameDrag.hold);
    if(nameDrag.ghost) nameDrag.ghost.remove();
    if(nameDrag.target){ const el = elCache.get(nameDrag.target); if(el) el.classList.remove("droptarget"); }
  }
  nameDrag = null;
}
function onNameDragCancel(){ endNameDrag(); }
function onNameDragEnd(e){
  const d = nameDrag;
  if(!d) return;
  if(!d.moved){ endNameDrag(); if(d.onTap) d.onTap(); return; }
  const target = d.target ? findItem(d.target) : null;
  const overPanel = (() => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    return !!(el && el.closest && el.closest(".panels"));
  })();
  endNameDrag();
  const from = d.from ? findItem(d.from) : null;
  if(target) placeStudent(d.id, target, from);
  else if(from && overPanel) unseatDesk(from);
}
/* Setzt einen Namen auf einen Tisch. Kommt er von einem anderen Tisch, wird getauscht. */
function placeStudent(studentId, desk, fromDesk){
  if(!desk || desk === fromDesk) return;
  /* Festgehaltene Plätze ändern sich nur nach „Lösen“ – sonst wanderte die Sperre zum neuen Namen */
  if(desk.locked && desk.studentId || fromDesk && fromDesk.locked){ toast(t("seatLocked")); haptic(); return; }
  pushUndo();
  const prev = desk.studentId || null;
  planDesks().forEach(x => { if(x !== desk && x !== fromDesk && x.studentId === studentId) delete x.studentId; });
  desk.studentId = studentId; delete desk.label;
  if(fromDesk){ if(prev) fromDesk.studentId = prev; else { delete fromDesk.studentId; delete fromDesk.locked; } }
  armedStudent = null; swapSrc = null;
  clearConflicts();
  save(); renderStage(false); renderUnseated(); haptic(12);
}
function unseatDesk(desk){
  if(!desk || !desk.studentId) return;
  pushUndo();
  delete desk.studentId; delete desk.locked;
  swapSrc = null; clearConflicts();
  save(); renderStage(false); renderUnseated(); haptic();
}

  };

function pClusters(n, size){

  const f = fitRowsCols(clusters, size === 4 ? 5 : 4, ch, 220, ROOM_H - 60, 100);
  const perRow = Math.min(f.perRow, maxColsFor(cw, 22, 80));
  const gapY = gapForRows(clusters, perRow, ch, 220, ROOM_H - 60, 100);
  const gapX = clamp((ROOM_W - 80 - perRow * cw) / Math.max(1, perRow - 1), 22, 100);

    const cl = Math.floor(i / size), k = i % size;
    const cr = Math.floor(cl / perRow), cc = cl % perRow;
    res.push({ x: x0 + cc * (cw + gapX) + (k % cols) * LW,

  const perRow = Math.min(f.perRow, maxColsFor(cw, 22, 80));
  const gapY = gapForRows(k, perRow, ch, 220, ROOM_H - 50, 90);
  const gapX = clamp((ROOM_W - 80 - perRow * cw) / Math.max(1, perRow - 1), 22, 100);
  const totalW = perRow * cw + (perRow - 1) * gapX;
  const x0 = (ROOM_W - totalW) / 2;

    const d = dims[g];
    const cr = Math.floor(g / perRow), cc = g % perRow;
    const ox = x0 + cc * (cw + gapX) + (cw - d.cols * LW) / 2;      // kleine Gruppen mittig in der Zelle

    }

function uRings(n, minRings){
  const res = [];

  const perRingTarget = minRings ? Math.ceil(n / minRings) : Infinity;
  let remaining = n, ring = 0;
  while(remaining > 0 && ring < RINGS_MAX){
    const inset = 190 + ring * ringGap;
    const topY  = 190 + ring * ringGap;
    const botRowY = ROOM_H - 160 - ring * ringGap;
    const sideCap = Math.max(0, Math.floor((botRowY - topY - 30) / stepY));
    const bottomCap = Math.max(1, Math.floor((ROOM_W - 2 * inset - 2 * LH - 30) / (LW + 12)));
    const cap = 2 * sideCap + bottomCap;
    if(cap <= 0) break;

    let take = Math.min(remaining, cap, perRingTarget);
    if(take <= 0) take = Math.min(remaining, cap);
    let side = Math.min(sideCap, Math.floor(take / 3));
    let bottom = take - 2 * side;
    if(bottom > bottomCap){
      bottom = bottomCap;
      side = Math.min(sideCap, Math.ceil((take - bottom) / 2));
      take = 2 * side + bottom;
    }
    if(take <= 0) break;                       // schützt vor Endlosschleife

    const left = [], right = [];
    for(let i = 0; i < side; i++){
      left.push({ x: inset, y: topY + i * stepY, rot: 90 });
      right.push({ x: ROOM_W - inset - LW, y: topY + i * stepY, rot: 270 });
    }
    const bw = bottom * (LW + 12) - 12;
    const bx = (ROOM_W - bw) / 2;
    for(let i = 0; i < side; i++) res.push(left[i]);
    for(let i = 0; i < bottom; i++) res.push({ x: bx + i * (LW + 12), y: botRowY, rot: 180 });
    for(let i = 0; i < side; i++) res.push(right[i]);

  const perRow = Math.min(f.perRow, maxCols);
  const gapX = clamp((availW - perRow * LW) / Math.max(1, perRow - 1), 10, 60);
  const w = perRow * LW + (perRow - 1) * gapX;
  const sx = x0 + (availW - w) / 2;
  const res = [];
  for(let i = 0; i < n; i++){
    const r = Math.floor(i / perRow), c = i % perRow;
    res.push({ x: sx + c * (LW + gapX), y: y0 + r * (LH + f.gap), rot: 0 });

    ds.forEach(d => { a.x += d.x + d.w / 2; a.y += d.y + d.h / 2; a.n++; });

    const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;

    const ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;

    } else {                                              // nur eine Seite besetzt
      const f = fam.get(famOf(gid));
      let side = -1;
      if(f && f.n > ds.length){
        const fv = (f.x / f.n - cx) * vx + (f.y / f.n - cy) * vy;

      }

    l.style.fontSize = clamp(Math.min(w, h) * 0.16, 11, 22) + "px";
  });
  tableEls.forEach((el, id) => { if(!seen.has(id)){ el.remove(); tableEls.delete(id); } });
}

/* ---- Anordnungen für Feiern ----
   Tische weichen Möbeln aus (Bühne, Tanzfläche, Buffet, Säulen …): Das Raster
   wird so lange enger gezogen, bis genug freie Felder da sind. Reicht der
   Raum nicht, werden belegte Felder mitbenutzt – layoutDesks meldet dann die
   Überlappung. */
const EVENT_LAYOUTS = ["rounds", "longtables", "squares", "ovals", "utable", "ttable"];
/* Nur bei diesen Anordnungen wird nach Plätzen pro Tisch gefragt */
const PER_TABLE_LAYOUTS = ["rounds", "longtables", "squares", "ovals"];
function freeCells(cellW, cellH, count){
  const obstacles = roomItems().filter(i => i.type !== "label" && i.type !== "window" && i.type !== "clock")
    .map(itemBox).map(b => ({ x: b.x - 24, y: b.y - 24, w: b.w + 48, h: b.h + 48 }));
  const top = 30, bottom = 30;
  let last = null;
  /* Großzügige Abstände zuerst: so verteilen sich wenige Tische über den ganzen
     Saal, statt sich vorne zu drängen */
  for(const gap of [360, 280, 210, 160, 120, 90, 60, 36, 16]){
    const cols = Math.floor((ROOM_W - 40 + gap) / (cellW + gap));
    const rows = Math.floor((ROOM_H - top - bottom + gap) / (cellH + gap));
    if(cols < 1 || rows < 1) continue;
    const x0 = (ROOM_W - (cols * cellW + (cols - 1) * gap)) / 2;
    const y0 = top + ((ROOM_H - top - bottom) - (rows * cellH + (rows - 1) * gap)) / 2;
    const free = [], blocked = [];
    for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
      const x = x0 + c * (cellW + gap), y = y0 + r * (cellH + gap);
      const hit = obstacles.some(o => x < o.x + o.w && o.x < x + cellW && y < o.y + o.h && o.y < y + cellH);
      (hit ? blocked : free).push({ x, y });
    }
    if(free.length >= count) return free.slice(0, count);
    last = { free, blocked, x0, y0, cols, rows, gap };
  }
  const cells = last ? last.free.concat(last.blocked) : [];
  let extra = 0;
  while(cells.length < count){                         // Raum zu klein: über den Rand hinaus, wird gemeldet
    cells.push({ x: (ROOM_W - cellW) / 2, y: ROOM_H - cellH - 10 + (extra++) * 10 });
  }
  return cells.slice(0, count);
}
function roundTableRadius(per){ return per <= 4 ? 60 : per <= 6 ? 85 : per <= 8 ? 110 : per <= 10 ? 125 : 140; }
function pRounds(n){
  const p = curPlan();
  const per = (p && p.seatsPerTable) || 8;
  const S = DESK_SIZES.seat.w;
  const rc = roundTableRadius(per) + TABLE_GAP + S / 2;
  const cell = 2 * (rc + S / 2);
  const tables = Math.ceil(n / per);
  const cells = freeCells(cell, cell, tables);
  const res = [];
  for(let tb = 0; tb < tables; tb++){
    const count = Math.min(per, n - tb * per);
    const cx = cells[tb].x + cell / 2, cy = cells[tb].y + cell / 2;
    for(let k = 0; k < count; k++){
      const ang = (k / count) * Math.PI * 2 - Math.PI / 2;
      res.push({ x: cx + Math.cos(ang) * rc - S / 2, y: cy + Math.sin(ang) * rc - S / 2, rot: 0, g: tb, tbl: "round" });
    }
  }
  return res;
}
function pLongTables(n){
  const p = curPlan();
  const per = (p && p.seatsPerTable) || 8;
  const S = DESK_SIZES.seat.w, SP = 84, DEP = 120;
  const perSide = Math.ceil(per / 2);
  const cellW = perSide * SP + 24, cellH = DEP + 2 * (TABLE_GAP + S);
  const tables = Math.ceil(n / per);
  const cells = freeCells(cellW, cellH, tables);
  const off = DEP / 2 + TABLE_GAP + S / 2;
  const res = [];
  for(let tb = 0; tb < tables; tb++){
    const count = Math.min(per, n - tb * per);
    const cy = cells[tb].y + cellH / 2;
    for(let k = 0; k < count; k++){
      const side = k % 2 ? 1 : -1, idx = Math.floor(k / 2);
      const cx = cells[tb].x + 12 + SP / 2 + idx * SP;
      res.push({ x: cx - S / 2, y: cy + side * off - S / 2, rot: 0, g: tb, tbl: "long" });
    }
  }
  return res;
}
/* Quadratische Tische: Stühle reihum auf alle vier Seiten verteilt */
function squareSides(per){ const s = [0, 0, 0, 0]; for(let k = 0; k < per; k++) s[k % 4]++; return s; }
function pSquares(n){
  const p = curPlan();
  const per = (p && p.seatsPerTable) || 8;
  const S = DESK_SIZES.seat.w, SP = 84;
  const sides = squareSides(per);
  const side = Math.max(110, Math.max.apply(null, sides) * SP + 16);
  const off = side / 2 + TABLE_GAP + S / 2;
  const cell = side + 2 * (TABLE_GAP + S);
  const tables = Math.ceil(n / per);
  const cells = freeCells(cell, cell, tables);
  const res = [];
  for(let tb = 0; tb < tables; tb++){
    const count = Math.min(per, n - tb * per);
    const sd = squareSides(count);
    const cx = cells[tb].x + cell / 2, cy = cells[tb].y + cell / 2;
    /* Seiten: oben, unten, links, rechts */
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy], si) => {
      for(let k = 0; k < sd[si]; k++){
        const along = (k - (sd[si] - 1) / 2) * SP;
        const x = dx ? cx + dx * off : cx + along, y = dy ? cy + dy * off : cy + along;
        res.push({ x: x - S / 2, y: y - S / 2, rot: 0, g: tb, tbl: "square" });
      }
    });
  }
  return res;
}
/* Ovale Tische: Stühle mit gleichem Abstand auf einer Ellipse (Verhältnis 1,7 : 1) */
function ovalPoints(count, A, B){
  const N = 720, pts = [], acc = [0];
  for(let i = 0; i <= N; i++){ const w = i / N * Math.PI * 2; pts.push([A * Math.cos(w), B * Math.sin(w)]); }
  for(let i = 1; i <= N; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = acc[N], res = [];
  let j = 0;
  for(let k = 0; k < count; k++){
    const target = k / count * L;
    while(j < N && acc[j + 1] < target) j++;
    res.push(pts[j]);
  }
  return { pts: res, perimeter: L };
}
function pOvals(n){
  const p = curPlan();
  const per = (p && p.seatsPerTable) || 8;
  const S = DESK_SIZES.seat.w;
  /* Halbachsen der Stuhl-Ellipse so wählen, dass etwa 84 px Abstand bleiben */
  let B = 90;
  while(B < 400 && ovalPoints(4, 1.7 * B, B).perimeter < per * 84) B += 4;
  const A = 1.7 * B;
  B = Math.max(B, 60 + TABLE_GAP + S / 2);
  const cellW = 2 * (A + S / 2), cellH = 2 * (B + S / 2);
  const tables = Math.ceil(n / per);
  const cells = freeCells(cellW, cellH, tables);
  const res = [];
  for(let tb = 0; tb < tables; tb++){
    const count = Math.min(per, n - tb * per);
    const cx = cells[tb].x + cellW / 2, cy = cells[tb].y + cellH / 2;
    ovalPoints(count, A, B).pts.forEach(([x, y]) => res.push({ x: cx + x - S / 2, y: cy + y - S / 2, rot: 0, g: tb, tbl: "oval" }));
  }
  return res;
}
/* U-Tafel: Kopftafel vorne, zwei Seitentafeln; Plätze außen, damit alle in die Mitte schauen.
   Werden die Seitentafeln für den Raum zu lang, sitzen Gäste auch innen. */
function pUTable(n){
  const S = DESK_SIZES.seat.w, SP = 84, DEP = 120;
  const room = ROOM_H - 60 - (S + TABLE_GAP + DEP);
  const maxRows = Math.max(1, Math.floor(room / SP));
  const bMax = Math.max(2, Math.floor((ROOM_W - 2 * (TABLE_GAP + S) - 60 - S) / SP) + 1);
  /* Passen die Seitentafeln nicht in den Raum, wird zuerst die Kopftafel länger */
  let b = Math.max(2, Math.min(n, Math.round(n * 0.2)));
  if(n - b > 2 * maxRows) b = Math.min(bMax, n - 2 * maxRows);
  b = Math.min(b, n);
  const rest = n - b, armL = Math.ceil(rest / 2), armR = rest - armL;
  const two = armL > maxRows;
  const rowsL = two ? Math.ceil(armL / 2) : armL;
  const L = Math.max((b - 1) * SP + S, 2 * DEP + (two ? 2 * (TABLE_GAP + S) : 0) + 300);
  const SPb = b > 1 ? (L - S) / (b - 1) : 0;
  const totW = L + 2 * (TABLE_GAP + S), totH = S + TABLE_GAP + DEP + Math.max(1, rowsL) * SP;
  const cell = { x: 0, y: 0 };
  const xL = cell.x + TABLE_GAP + S, yC = cell.y + S / 2;          // linke Kante der Kopftafel, Mitte der Kopfstühle
  const tableBottom = yC + S / 2 + TABLE_GAP + DEP;
  const res = [];
  for(let k = 0; k < b; k++) res.push({ x: xL + S / 2 + k * SPb - S / 2, y: yC - S / 2, rot: 0, g: 0, tbl: "long" });
  const arm = (count, g, xTable) => {
    const outer = g === 1 ? xTable - TABLE_GAP - S / 2 : xTable + DEP + TABLE_GAP + S / 2;
    const inner = g === 1 ? xTable + DEP + TABLE_GAP + S / 2 : xTable - TABLE_GAP - S / 2;
    for(let k = 0; k < count; k++){
      const row = two ? Math.floor(k / 2) : k, x = two && k % 2 ? inner : outer;
      res.push({ x: x - S / 2, y: tableBottom + S / 2 + row * SP - S / 2, rot: 0, g, tbl: "longv" });
    }
  };
  arm(armL, 1, xL); arm(armR, 2, xL + L - DEP);
  return placeShape(res, totW, totH);
}
/* Schiebt eine große Tafelanordnung (U, T) an die Stelle, an der Stühle und Tischplatten
   keine Möbel berühren – möglichst mittig und weit vorne. Das Innere des U darf über
   der Tanzfläche liegen. */
function placeShape(res, w, h){
  const S = DESK_SIZES.seat.w;
  const desks = res.map((q, i) => ({ x: q.x, y: q.y, w: S, h: S, rot: 0, tbl: q.tbl, groupId: "s_" + q.g }));
  const boxes = desks.map(d => ({ x: d.x, y: d.y, w: S, h: S }))
    .concat(tableShapes(desks).map(sh => {
      const v = Math.abs((sh.rot || 0) % 180) === 90;
      const bw = v ? sh.dep : sh.len, bh = v ? sh.len : sh.dep;
      return { x: sh.cx - bw / 2, y: sh.cy - bh / 2, w: bw, h: bh };
    }));
  const obstacles = roomItems().filter(i => i.type !== "label" && i.type !== "window" && i.type !== "clock" && i.type !== "door")
    .map(itemBox).map(b => ({ x: b.x - 16, y: b.y - 16, w: b.w + 32, h: b.h + 32 }));
  const hits = (dx, dy) => {
    let n = 0;
    boxes.forEach(b => { obstacles.forEach(o => { if(b.x + dx < o.x + o.w && o.x < b.x + dx + b.w && b.y + dy < o.y + o.h && o.y < b.y + dy + b.h) n++; }); });
    return n;
  };
  const x0 = (ROOM_W - w) / 2;
  let best = null;
  for(let dy = 20; dy <= Math.max(20, ROOM_H - h - 20); dy += 30){
    for(let dx = 20; dx <= Math.max(20, ROOM_W - w - 20); dx += 30){
      const n = hits(dx, dy);
      const score = n * 1e6 + Math.abs(dx - x0) + dy * 0.6;
      if(!best || score < best.score) best = { dx, dy, score };
    }
  }
  if(!best) best = { dx: Math.max(10, x0), dy: 20 };
  return res.map(q => Object.assign(q, { x: q.x + best.dx, y: q.y + best.dy }));
}
/* T-Tafel: Kopftafel vorne (Plätze mit Blick in den Saal), lange Tafel mittig davor */
function pTTable(n){
  const S = DESK_SIZES.seat.w, SP = 84, DEP = 120;
  const maxRows = Math.max(1, Math.floor((ROOM_H - 60 - (S + TABLE_GAP + DEP)) / SP));
  const hMax = Math.max(2, Math.floor((ROOM_W - 60 - S) / SP) + 1);
  let h = Math.max(2, Math.min(n, Math.round(n * 0.2)));
  if(n - h > 2 * maxRows) h = Math.min(hMax, n - 2 * maxRows);    // Kopftafel länger statt Stiel aus dem Raum
  h = Math.min(h, n);
  const rest = n - h, rows = Math.ceil(rest / 2);
  const L = Math.max((h - 1) * SP + S, 3 * SP + S);
  const SPh = h > 1 ? (L - S) / (h - 1) : 0;
  const totW = Math.max(L, DEP + 2 * (TABLE_GAP + S)), totH = S + TABLE_GAP + DEP + Math.max(1, rows) * SP;
  const cx = totW / 2, yC = S / 2;
  const tableBottom = yC + S / 2 + TABLE_GAP + DEP;
  const res = [];
  for(let k = 0; k < h; k++) res.push({ x: cx - L / 2 + k * SPh, y: yC - S / 2, rot: 0, g: 0, tbl: "long" });
  const off = DEP / 2 + TABLE_GAP + S / 2;
  for(let k = 0; k < rest; k++){
    const side = k % 2 ? 1 : -1, row = Math.floor(k / 2);
    res.push({ x: cx + side * off - S / 2, y: tableBottom + S / 2 + row * SP - S / 2, rot: 0, g: 1, tbl: "longv" });
  }
  return placeShape(res, totW, totH);
}
/* Fragt die Plätze pro Tisch ab, bevor runde Tische oder Tafeln gestellt werden */
function askSeatsPerTable(cb){

function pBoardroom(n){
  const res = [];
  const gap = 14;
  let remaining = n, ring = 0;
  while(remaining > 0 && ring < 4){
    const halfH = 95 + ring * (LH + 34);
    const wCap = Math.min(ROOM_W - 340 + ring * 120, ROOM_W - 240);
    const perSideCap = Math.max(1, Math.floor((wCap + gap) / (LW + gap)));
    const ends = (ring === 0 && remaining >= 6) ? 2 : 0;
    const cap = 2 * perSideCap + ends;
    const take = Math.min(remaining, cap);
    if(take <= 0) break;                                   // schützt vor Endlosschleife
    const sideTotal = Math.max(0, take - ends);
    const top = Math.min(perSideCap, Math.ceil(sideTotal / 2));
    const bottom = sideTotal - top;
    const w = Math.max(top, bottom, 1) * (LW + gap) - gap;
    const x0 = ROOM_W / 2 - w / 2, cy = ROOM_H / 2;
    for(let i = 0; i < top; i++)    res.push({ x: x0 + i * (LW + gap), y: cy - halfH - LH, rot: 180 });
    for(let i = 0; i < bottom; i++) res.push({ x: x0 + i * (LW + gap), y: cy + halfH, rot: 0 });
    if(ends){
      res.push({ x: x0 - LW - 34, y: cy - LH / 2, rot: 90 });
      res.push({ x: x0 + w + 34,      y: cy - LH / 2, rot: 270 });
    }
    remaining -= take;
    ring++;
  }
  if(remaining > 0) pGrid(remaining, 500, ROOM_W - 500, ROOM_H / 2 - 30, ROOM_H / 2 + 30).forEach(q => res.push(q));
  return res.slice(0, n);
}
function pExam(n){
  const f = fitRowsCols(n, 8, LH, 210, ROOM_H - 60, 95);
  const perRow = Math.min(f.perRow, maxColsFor(LW, 34, 170));
  const gapY = gapForRows(n, perRow, LH, 210, ROOM_H - 60, 95);
  const gapX = clamp((ROOM_W - 170 - perRow * LW) / Math.max(1, perRow - 1), 34, 95);
  const w = perRow * LW + (perRow - 1) * gapX;
  const x0 = (ROOM_W - w) / 2;
  const res = [];
  for(let i = 0; i < n; i++){
    const r = Math.floor(i / perRow), c = i % perRow;
    res.push({ x: x0 + c * (LW + gapX), y: 210 + r * (LH + gapY), rot: 0 });
  }
  return res;
}

/* ============ 19. Sitzplan-Historie & automatische Verteilung ============ */
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
function currentPairs(desks){
  const nb = neighbourMatrix(desks);
  const pairs = [];
  for(let i = 0; i < desks.length; i++){
    for(let j = i + 1; j < desks.length; j++){
      if(!nb[i][j]) continue;
      const a = desks[i].studentId, b = desks[j].studentId;
      if(a && b) pairs.push(pairKey(a, b));
    }
  }
  return pairs;
}
/* Speichert die aktuelle Nachbarschaft, damit die nächste Verteilung sie meidet */
function recordSeating(silent){
  const c = curClass(), p = curPlan();
  if(!c || !p || !DB.settings.history) return;
  const pairs = currentPairs(p.desks);
  if(!pairs.length){ if(!silent) toast(t("noDesks")); return; }
  if(!Array.isArray(c.history)) c.history = [];
  const last = c.history[c.history.length - 1];
  const same = last && last.pairs.length === pairs.length &&
    last.pairs.slice().sort().join() === pairs.slice().sort().join();
  if(!same){
    c.history.push({ t: new Date().toISOString(), pairs: pairs.slice(0, 400) });
    while(c.history.length > HISTORY_MAX) c.history.shift();   // begrenzt den Speicherbedarf
    save();
  }
  if(!silent) toast(t("remembered").replace("{n}", String(c.history.length)));
}


function neighbourMatrix(desks){
  const n = desks.length;
  const boxes = desks.map(itemBox);
  const m = [];
  for(let i = 0; i < n; i++){
    m.push(new Array(n).fill(false));
  }
  for(let i = 0; i < n; i++){
    for(let j = i + 1; j < n; j++){
      const a = boxes[i], b = boxes[j];
      const sameGroup = desks[i].groupId && desks[i].groupId === desks[j].groupId;
      const gapX = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w));
      const gapY = Math.max(0, Math.max(a.y, b.y) - Math.min(a.y + a.h, b.y + b.h));
      const near = gapX <= 26 && gapY <= 26;
      const v = !!(sameGroup || near);
      m[i][j] = v; m[j][i] = v;
    }
  }
  return m;
}
const FRONT_TYPES = ["board", "digitalboard", "whiteboard", "screen", "pinboard", "stage", "headtable"];
/* Wo ist vorne? Nicht zwangsläufig oben — maßgeblich ist, wo die Tafel hängt. */
function frontAxis(){
  const boards = roomItems().filter(i => FRONT_TYPES.indexOf(i.type) >= 0);
  if(!boards.length) return null;
  let bx = 0, by = 0;
  boards.forEach(b => { const bb = itemBox(b); bx += bb.cx; by += bb.cy; });
  bx /= boards.length; by /= boards.length;
  let dx = ROOM_W / 2 - bx, dy = ROOM_H / 2 - by;
  const len = Math.hypot(dx, dy);
  if(len < 1) return null;
  return { bx: bx, by: by, dx: dx / len, dy: dy / len };
}
/* Reihen zählen ab der Tafel, nicht ab dem oberen Bildrand */
function rowIndices(desks){
  if(!desks.length) return [];
  const axis = frontAxis();
  const depth = desks.map(d => {
    const b = itemBox(d);
    return axis ? (b.cx - axis.bx) * axis.dx + (b.cy - axis.by) * axis.dy : b.cy;
  });
  const band = Math.max(30, (desks[0].h || DESK_H) * 0.9);
  const sorted = depth.slice().sort((a,b) => a - b);
  const bands = [];
  sorted.forEach(v => { if(!bands.length || v - bands[bands.length - 1] > band) bands.push(v); });
  return depth.map(v => {
    let best = 0, bd = Infinity;
    bands.forEach((b, i) => { const d = Math.abs(b - v); if(d < bd){ bd = d; best = i; } });
    return best;
  });
}
function autoSeat(quiet){
  const c = curClass(), p = curPlan();
  if(!c || !p) return;
  if(!p.desks.length){ toast(t("noDesks")); return; }
  if(!c.students.length){ toast(t("noStudents")); return; }
  pushUndo();

  const desks = p.desks;
  const nb = neighbourMatrix(desks);
  const rows = rowIndices(desks);
  const maxRow = Math.max.apply(null, rows.concat([0]));
  const sIdx = new Map(c.students.map((s, i) => [s.id, i]));

  /* Vorberechnungen für Sitzwünsche und Historie — einmal statt in jeder Iteration */
  const useTags = DB.settings.tags, useHist = DB.settings.history;
  const adjPairs = [];
  for(let i = 0; i < desks.length; i++){
    for(let j = i + 1; j < desks.length; j++) if(nb[i][j]) adjPairs.push([i, j]);
  }
  const nbCount = desks.map((_, i) => nb[i].reduce((a, v) => a + (v ? 1 : 0), 0));
  const diag = Math.hypot(ROOM_W, ROOM_H);
  const distTo = type => {
    const targets = roomItems().filter(i => i.type === type).map(itemBox);
    if(!targets.length) return null;
    return desks.map(d => {
      const b = itemBox(d);
      let best = Infinity;
      targets.forEach(o => { const v = Math.hypot(o.cx - b.cx, o.cy - b.cy); if(v < best) best = v; });
      return best / diag;
    });
  };
  const distDoor = useTags ? distTo("door") : null;
  const distTeacher = useTags ? distTo("teacherdesk") : null;
  const histW = {};
  if(useHist && Array.isArray(c.history) && c.history.length){
    const L = c.history.length;
    c.history.forEach((h, idx) => {
      const w = 2 + 5 * ((idx + 1) / L);                      // jüngere Sitzordnungen wiegen schwerer
      h.pairs.forEach(k => { histW[k] = (histW[k] || 0) + w; });
    });
  }

  const absentIds = absentToday(c);
  const rules = c.rules.filter(r => sIdx.has(r.a) && sIdx.has(r.b) && !absentIds.has(r.a) && !absentIds.has(r.b));
  /* Stufenmischung wie in FairMix: gemischt = Nachbarn möglichst verschiedener Stufe,
     gleichstark = Nachbarn möglichst gleicher Stufe. Ohne Stufe zählt nicht. */
  const keepTogether = new Set(rules.filter(r => r.type === "together").map(r => pairKey(r.a, r.b)));
  const lvMode = c.levelMode || "off";
  const lv = c.students.map(s => s.level || 0);
  const useLv = lvMode !== "off" && lv.some(v => v);
  const nSeats = desks.length;
  const nStud = c.students.length;

  // seat -> Index in c.students (oder -1 für leer)
  /* Festgehaltene Plätze bleiben, wie sie sind. Wer heute fehlt, bekommt keinen Platz. */
  const absent = absentToday(c);
  const lockedSeats = new Set();
  const lockedStud = new Set();
  desks.forEach((d, i) => {
    if(d.locked && d.studentId && sIdx.has(d.studentId)){ lockedSeats.add(i); lockedStud.add(sIdx.get(d.studentId)); }
  });
  const freeSeats = desks.map((_, i) => i).filter(i => !lockedSeats.has(i));
  const pool = shuffled(c.students.map((_, i) => i).filter(i => !lockedStud.has(i) && !absent.has(c.students[i].id)));
  let assign = new Array(nSeats).fill(-1);
  lockedSeats.forEach(i => { assign[i] = sIdx.get(desks[i].studentId); });
  freeSeats.forEach((seat, k) => { if(k < pool.length) assign[seat] = pool[k]; });

  const seatOf = new Array(nStud).fill(-1);
  const rebuild = a => { seatOf.fill(-1); a.forEach((st, seat) => { if(st >= 0) seatOf[st] = seat; }); };
  rebuild(assign);

  function cost(a){
    rebuild(a);
    let bad = 0;
    rules.forEach(r => {
      const sa = seatOf[sIdx.get(r.a)], sb = seatOf[sIdx.get(r.b)];
      if(sa < 0 || sb < 0){ bad += 2; return; }
      const adj = nb[sa][sb];
      if(r.type === "apart" && adj) bad += 10;
      if(r.type === "together" && !adj) bad += 8;
    });
    if(useTags) c.students.forEach((s, i) => {
      if(!s.tags || !s.tags.length || absentIds.has(s.id)) return;
      const seat = seatOf[i];
      if(seat < 0){ bad += 3; return; }
      if(hasTag(s, "front")){
        const over = rows[seat] - Math.min(1, maxRow);
        if(over > 0) bad += over * 5;
      }
      if(hasTag(s, "quiet")) bad += nbCount[seat] * 3;
      if(hasTag(s, "door") && distDoor) bad += distDoor[seat] * 12;
      if(hasTag(s, "teacher") && distTeacher) bad += distTeacher[seat] * 12;
    });
    if(useLv) adjPairs.forEach(pr => {
      const si = a[pr[0]], sj = a[pr[1]];
      if(si < 0 || sj < 0 || !lv[si] || !lv[sj]) return;
      if(lvMode === "hetero" ? lv[si] === lv[sj] : lv[si] !== lv[sj]) bad += 1.5;
    });
    if(useHist) adjPairs.forEach(pr => {
      const si = a[pr[0]], sj = a[pr[1]];
      if(si < 0 || sj < 0) return;
      const k = pairKey(c.students[si].id, c.students[sj].id);
      if(keepTogether.has(k)) return;                         // „immer zusammen“ darf nie als alte Nachbarschaft bestraft werden
      const w = histW[k];
      if(w) bad += w;                                        // alte Nachbarschaft kostet
    });
    return bad;
  }

  let best = assign.slice(), bestCost = cost(best);
  const iterations = Math.min(9000, 400 + nSeats * nSeats * 12);   // begrenzt: keine Endlosschleife
  let cur = best.slice(), curCost = bestCost;
  const nFree = freeSeats.length;
  for(let k = 0; k < iterations && bestCost > 0 && nFree > 1; k++){
    const i = freeSeats[Math.floor(Math.random() * nFree)];
    const j = freeSeats[Math.floor(Math.random() * nFree)];
    if(i === j) continue;
    const tmp = cur[i]; cur[i] = cur[j]; cur[j] = tmp;
    const nc = cost(cur);
    const temp = 1 - k / iterations;
    if(nc <= curCost || Math.random() < 0.02 * temp){
      curCost = nc;
      if(nc < bestCost){ bestCost = nc; best = cur.slice(); }
    } else {
      const t2 = cur[i]; cur[i] = cur[j]; cur[j] = t2;              // Tausch zurücknehmen
    }
  }

  best.forEach((studentIdx, seat) => {
    if(studentIdx >= 0 && c.students[studentIdx]) desks[seat].studentId = c.students[studentIdx].id;
    else delete desks[seat].studentId;
  });
  save(); renderStage(false); renderUnseated(); haptic(14);
  recordSeating(true);                                       // Ergebnis für die nächste Runde merken

  rebuild(best);
  lastConflicts = [];
  const nameOf = id => { const st = studentById(c, id); return st ? st.name : "?"; };
  rules.forEach(r => {
    const sa = seatOf[sIdx.get(r.a)], sb = seatOf[sIdx.get(r.b)];
    if(sa < 0 || sb < 0){
      lastConflicts.push({ text: t("conflictNoSeat").replace("{a}", nameOf(sa < 0 ? r.a : r.b)), seats: [] });
      return;
    }
    if(r.type === "apart" && nb[sa][sb])
      lastConflicts.push({ text: t("conflictApart").replace("{a}", nameOf(r.a)).replace("{b}", nameOf(r.b)), seats: [sa, sb] });
    if(r.type === "together" && !nb[sa][sb])
      lastConflicts.push({ text: t("conflictTogether").replace("{a}", nameOf(r.a)).replace("{b}", nameOf(r.b)), seats: [sa, sb] });
  });
  if(useTags) c.students.forEach((st, i) => {
    if(!st.tags || !st.tags.length) return;
    const seat = seatOf[i];
    if(seat < 0) return;
    if(hasTag(st, "front") && rows[seat] > Math.min(1, maxRow))
      lastConflicts.push({ text: t("conflictTag").replace("{a}", st.name).replace("{tag}", tTag("front")), seats: [seat] });
    if(hasTag(st, "quiet") && nbCount[seat] > 2)
      lastConflicts.push({ text: t("conflictTag").replace("{a}", st.name).replace("{tag}", tTag("quiet")), seats: [seat] });
  });
  renderConflicts();
  const broken = lastConflicts.length;
  if(!quiet){
    let msg = broken === 0 ? t("seatedOk") : t("seatedPartial").replace("{n}", String(broken));
    if(absentIds.size) msg += " · " + t("absentSkipped").replace("{n}", String(absentIds.size));
    if(lockedSeats.size) msg += " · " + t("lockedKept").replace("{n}", String(lockedSeats.size));
    toastUndo(msg);
  }
}

/* Tischgruppen aus zusammenhängenden Tischen: gruppiert oder direkt benachbart */
function deskClusters(desks){
  /* Gruppierte Tische bilden ihre Tischgruppe über die Kennung – das gilt auch,
     wenn sie im Gitter dicht an anderen Gruppen stehen. Nur ungruppierte Tische
     werden über die Nachbarschaft zusammengefasst. */
  const byGroup = new Map();
  desks.forEach((d, i) => { if(d.groupId){ if(!byGroup.has(d.groupId)) byGroup.set(d.groupId, []); byGroup.get(d.groupId).push(i); } });
  const nb = neighbourMatrix(desks);
  const parent = desks.map((_, i) => i);
  const find = i => { while(parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  for(let i = 0; i < desks.length; i++) for(let j = i + 1; j < desks.length; j++)
    if(nb[i][j] && !desks[i].groupId && !desks[j].groupId) parent[find(i)] = find(j);
  const map = new Map();
  desks.forEach((d, i) => { if(d.groupId) return; const r = find(i); if(!map.has(r)) map.set(r, []); map.get(r).push(i); });
  return Array.from(byGroup.values()).concat(Array.from(map.values()));
}
function shuffled(arr){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
/* Setzt jede FairMix-Gruppe geschlossen an eine Tischgruppe */
function seatByGroups(quiet){
  const c = curClass(), p = curPlan();
  if(!c || !p) return;
  if(!p.desks.length){ toast(t("noDesks")); return; }
  const skip = new Set(absentToday(c));
  p.desks.forEach(d => { if(d.locked && d.studentId) skip.add(d.studentId); });
  const groups = (c.groups || []).map(g => g.members.filter(id => studentById(c, id) && !skip.has(id))).filter(m => m.length);
  if(!groups.length){ autoSeat(quiet); return; }
  pushUndo();
  const absent = absentToday(c);
  const lockedIds = new Set(p.desks.filter(d => d.locked && d.studentId).map(d => d.studentId));
  p.desks.forEach(d => { if(!(d.locked && d.studentId)) delete d.studentId; });
  const isFree = i => !p.desks[i].studentId;
  /* Nur freie Plätze zählen; Festgehaltene und Abwesende werden nicht verteilt */
  const clusters = deskClusters(p.desks).map(cl => cl.filter(isFree)).filter(cl => cl.length)
    .sort((a, b) => b.length - a.length);
  const used = new Set();
  const overflow = [];
  groups.slice().sort((a, b) => b.length - a.length).forEach(members => {
    let pick = -1;
    clusters.forEach((cl, i) => {                     // kleinste passende Tischgruppe
      if(used.has(i) || cl.length < members.length) return;
      if(pick < 0 || cl.length < clusters[pick].length) pick = i;
    });
    if(pick < 0) clusters.forEach((cl, i) => { if(!used.has(i) && (pick < 0 || cl.length > clusters[pick].length)) pick = i; });
    const order = shuffled(members);
    if(pick < 0){ overflow.push.apply(overflow, order); return; }
    used.add(pick);
    clusters[pick].forEach((seat, k) => { if(k < order.length) p.desks[seat].studentId = order[k]; });
    order.slice(clusters[pick].length).forEach(id => overflow.push(id));
  });
  /* Alle ohne Gruppe und übrig Gebliebene auf die freien Plätze */
  const grouped = new Set(groups.flat());
  const rest = shuffled(overflow.concat(c.students.filter(s => !grouped.has(s.id) && !absent.has(s.id) && !lockedIds.has(s.id)).map(s => s.id)));
  const free = shuffled(p.desks.map((d, i) => i).filter(i => !p.desks[i].studentId && !used.has(clusters.findIndex(cl => cl.indexOf(i) >= 0))));
  const free2 = p.desks.map((d, i) => i).filter(i => !p.desks[i].studentId && free.indexOf(i) < 0);
  free.concat(free2).forEach(i => { if(rest.length) p.desks[i].studentId = rest.shift(); });
  lastConflicts = [];
  rest.forEach(id => {
    const st = studentById(c, id);
    lastConflicts.push({ text: t("conflictNoSeat").replace("{a}", st ? st.name : "?"), seats: [] });
  });
  save(); renderStage(false); renderUnseated(); haptic(14);
  if(!quiet || rest.length) toastUndo(rest.length ? t("seatedMissing").replace("{n}", String(rest.length)) : t("seatedGroups"));
}

/* ============ 19c. Klassenarbeit: Platznummern und Aufgabengruppen A/B ============
   Nummern laufen von vorne (Tafel) nach hinten, in jeder Reihe von links nach
   rechts. Die Gruppen A/B wechseln wie auf einem Schachbrett: (Reihe + Spalte)
   gerade → A, ungerade → B. So sitzt links, rechts, vorne und hinten jeweils
   die andere Gruppe. */
function seatOrder(desks){
  const rows = rowIndices(desks);
  const axis = frontAxis();
  const across = d => {
    const b = itemBox(d);
    return axis ? (b.cx - axis.bx) * (-axis.dy) + (b.cy - axis.by) * axis.dx : b.cx;   // quer zur Blickrichtung
  };
  const idx = desks.map((d, i) => i).sort((a, b) => rows[a] - rows[b] || across(desks[a]) - across(desks[b]));
  const no = new Map(), col = new Map();
  let lastRow = -1, c = 0;
  idx.forEach((i, k) => {
    if(rows[i] !== lastRow){ lastRow = rows[i]; c = 0; }
    no.set(desks[i].id, k + 1); col.set(desks[i].id, { row: rows[i], col: c++ });
  });
  return { no, col };
}
function assignExamGroups(p){
  const { col } = seatOrder(p.desks);
  p.desks.forEach(d => { const rc = col.get(d.id); d.var = ((rc.row + rc.col) % 2) ? "B" : "A"; });
}
function examNumbers(p){ return p && p.exam ? seatOrder(p.desks).no : null; }
function deskPrintLabel(cls, plan, it, nums){

  const n = nums && nums.get(it.id);
  const v = plan && plan.exam && it.var ? " (" + it.var + ")" : "";
  return (n ? n + "  " : "") + name + v;
}

/* ============ 19d. Vertretungsmappe ============ */
function pdfWrap(text, maxChars){
  const out = [];
  String(text || "").split(/\r?\n/).forEach(par => {
    let line = "";
    par.split(/\s+/).forEach(w => {
      if(!w) return;
      if((line + " " + w).trim().length > maxChars){ if(line) out.push(line); line = w; }
      else line = (line + " " + w).trim();
    });
    out.push(line);
  });
  return out;
}

function substitutePages(c, p, room, withTags){
  const title = t("subDocTitle").replace("{c}", c.name).replace("{d}", new Date().toLocaleDateString(LANG === "en" ? "en-GB" : "de-DE"));
  const nums = seatOrder(p.desks).no;
  const pages = [pdfPlanPage(c, p, room, title, { numbers: nums })];
  /* Hochformat: Liste mit Platznummer, Name, Sitzwunsch – danach die Hinweise */
  const W = 595, H = 842, M = 40;
  const rows = p.desks.filter(d => d.studentId).map(d => {
    const st = studentById(c, d.studentId);
    const tags = withTags && st && st.tags && st.tags.length ? st.tags.map(tTag).join(", ") : "";
    return { no: nums.get(d.id), name: st ? st.name : "", tags, v: p.exam && d.var ? d.var : "" };
  }).sort((a, b) => a.no - b.no);
  const lines = [];
  let cur = [];
  const head = y => {
    cur.push("0.086 0.137 0.169 rg BT /F1 14 Tf " + M + " " + y + " Td (" + pdfEscape(title) + ") Tj ET");
    cur.push("0.353 0.420 0.459 rg BT /F1 9 Tf " + M + " " + (y - 22) + " Td (" + pdfEscape(t("subColNo")) + ") Tj ET");
    cur.push("0.353 0.420 0.459 rg BT /F1 9 Tf " + (M + 50) + " " + (y - 22) + " Td (" + pdfEscape(t("subColName")) + ") Tj ET");
    if(withTags) cur.push("0.353 0.420 0.459 rg BT /F1 9 Tf " + (M + 280) + " " + (y - 22) + " Td (" + pdfEscape(t("subColTags")) + ") Tj ET");
  };
  let y = H - M - 10;
  head(y); y -= 44;
  const flush = () => { lines.push({ content: cur.join("\n"), w: W, h: H }); cur = []; y = H - M - 10; head(y); y -= 44; };
  rows.forEach(r => {
    if(y < M + 20) flush();
    cur.push("0.086 0.137 0.169 rg BT /F1 10.5 Tf " + M + " " + y + " Td (" + pdfEscape(String(r.no) + (r.v ? " " + r.v : "")) + ") Tj ET");
    cur.push("0.086 0.137 0.169 rg BT /F1 10.5 Tf " + (M + 50) + " " + y + " Td (" + pdfEscape(r.name) + ") Tj ET");
    if(r.tags) cur.push("0.353 0.420 0.459 rg BT /F1 9.5 Tf " + (M + 280) + " " + y + " Td (" + pdfEscape(r.tags) + ") Tj ET");
    y -= 17;
  });
  if(c.subNote){
    y -= 14;
    if(y < M + 60) flush();
    cur.push("0.086 0.137 0.169 rg BT /F1 12 Tf " + M + " " + y + " Td (" + pdfEscape(t("subNotes")) + ") Tj ET");
    y -= 20;
    pdfWrap(c.subNote, 92).forEach(l => {
      if(y < M + 10) flush();
      cur.push("0.086 0.137 0.169 rg BT /F1 10.5 Tf " + M + " " + y + " Td (" + pdfEscape(l) + ") Tj ET");
      y -= 15;
    });
  }
  lines.push({ content: cur.join("\n"), w: W, h: H });
  return pages.concat(lines);
}

/* ============ 19d. Feier: Tischkarten, „Wer sitzt wo?“, Küchenliste ============
   Alles als PDF im Hochformat. Tischnummern stammen aus tableShapes, ohne Tische
   gilt die Platznummer. */
const A4P_W = 595, A4P_H = 842;
function guestSeats(c, p){
  const shapes = tableShapes(p.desks);
  const tno = new Map(shapes.map(sh => [sh.id, sh.no]));
  const nums = seatOrder(p.desks).no;
  return p.desks.filter(d => d.studentId && studentById(c, d.studentId)).map(d => ({
    st: studentById(c, d.studentId), desk: d,
    table: d.groupId && tno.has(d.groupId) ? tno.get(d.groupId) : null,
    seat: nums.get(d.id) || 0
  }));
}
function seatWhere(e){
  return e.table ? t("tableNo").replace("{n}", String(e.table)) : t("seatNo").replace("{n}", String(e.seat));
}
function pdfText(x, y, size, txt, rgb){
  return (rgb || "0.086 0.137 0.169") + " rg BT /F1 " + size.toFixed(1) + " Tf " + x.toFixed(2) + " " + y.toFixed(2) + " Td (" + pdfEscape(txt) + ") Tj ET";
}
function pdfTextW(txt, size){ return pdfPlain(txt).length * size * 0.52; }
function pdfCentered(cx, y, size, txt, rgb){ return pdfText(cx - pdfTextW(txt, size) / 2, y, size, txt, rgb); }
/* Klappkarten: vier je Seite (2 × 2), jede Karte 297 × 421 pt, Falz in der Mitte.
   Die obere Hälfte steht auf dem Kopf – gefaltet ist der Text von beiden Seiten lesbar. */
function tentCardPages(cards){
  const pages = [], cw = A4P_W / 2, ch = A4P_H / 2;
  for(let i = 0; i < cards.length; i += 4){
    const c = [];
    c.push("0.75 0.78 0.82 RG 0.5 w [4 4] 0 d");
    c.push(cw.toFixed(1) + " 0 m " + cw.toFixed(1) + " " + A4P_H + " l S");
    c.push("0 " + ch.toFixed(1) + " m " + A4P_W + " " + ch.toFixed(1) + " l S");
    c.push("[1 3] 0 d");
    [ch / 2, ch + ch / 2].forEach(y => c.push("0 " + y.toFixed(1) + " m " + A4P_W + " " + y.toFixed(1) + " l S"));
    c.push("[] 0 d");
    cards.slice(i, i + 4).forEach((card, k) => {
      const x0 = (k % 2) * cw, y0 = (k < 2 ? 1 : 0) * ch;              // oben links zuerst
      const face = (cx, cy) => {
        const out = [];
        const fs = Math.max(12, Math.min(card.big || 30, (cw - 40) / Math.max(1, pdfPlain(card.main).length * 0.55)));
        out.push(pdfCentered(cx, cy + 4, fs, card.main));
        if(card.sub) out.push(pdfCentered(cx, cy - fs * 0.5 - 14, 12, card.sub, "0.353 0.420 0.459"));
        return out.join("\n");
      };
      const cx = x0 + cw / 2, fold = y0 + ch / 2;
      c.push(face(cx, y0 + ch / 4));                                   // Vorderseite unten
      c.push("q -1 0 0 -1 " + (2 * cx).toFixed(2) + " " + (2 * (fold + ch / 4)).toFixed(2) + " cm");
      c.push(face(cx, fold + ch / 4));                                 // Rückseite oben, auf dem Kopf
      c.push("Q");
    });
    pages.push({ content: c.join("\n"), w: A4P_W, h: A4P_H });
  }
  return pages;
}
function placeCardPages(c, p){
  const list = guestSeats(c, p).sort((a, b) => (a.table || 0) - (b.table || 0) || a.seat - b.seat);
  const cards = list.map(e => ({ main: e.st.name, sub: e.table ? seatWhere(e) : "" }));   // ohne Tisch (z. B. Brautpaar) nur der Name
  const tables = tableShapes(p.desks);
  tables.forEach(sh => cards.push({ main: t("tableNo").replace("{n}", String(sh.no)), sub: c.name, big: 46 }));
  return tentCardPages(cards);
}
function escortPages(c, p){
  const list = guestSeats(c, p).sort((a, b) => a.st.name.localeCompare(b.st.name, LANG));
  const M = 40, colW = (A4P_W - 2 * M - 20) / 2, lineH = 19;
  const title = t("escortDoc").replace("{c}", c.name);
  const pages = [];
  let cur = [], y = 0, col = 0;
  const start = () => { cur = [pdfText(M, A4P_H - M - 10, 18, title)]; y = A4P_H - M - 50; col = 0; };
  const finish = () => pages.push({ content: cur.join("\n"), w: A4P_W, h: A4P_H });
  start();
  const top = A4P_H - M - 50;
  let letter = "";
  list.forEach(e => {
    const L0 = (e.st.name[0] || "").toLocaleUpperCase();
    const need = L0 !== letter ? 2 : 1;
    if(y - (need - 1) * lineH < M){ if(col === 0){ col = 1; y = top; } else { finish(); start(); } }
    const x = M + col * (colW + 20);
    if(L0 !== letter){ letter = L0; cur.push(pdfText(x, y, 12, letter, "0.169 0.420 0.733")); y -= lineH; }
    const where = seatWhere(e);
    const fs = 11, nameMax = colW - pdfTextW(where, fs) - 14;
    let nm = e.st.name;
    while(nm.length > 3 && pdfTextW(nm, fs) > nameMax) nm = nm.slice(0, -2) + "…";
    cur.push(pdfText(x, y, fs, nm));
    cur.push(pdfText(x + colW - pdfTextW(where, fs), y, fs, where, "0.169 0.420 0.733"));
    cur.push("0.85 0.87 0.9 RG 0.4 w " + x.toFixed(1) + " " + (y - 5).toFixed(1) + " m " + (x + colW).toFixed(1) + " " + (y - 5).toFixed(1) + " l S");
    y -= lineH;
  });
  finish();
  return pages;
}
function kitchenPages(c, p){
  const list = guestSeats(c, p);
  const M = 40, title = t("kitchenDoc").replace("{c}", c.name);
  const pages = [];
  let cur = [], y = 0;
  const start = () => { cur = [pdfText(M, A4P_H - M - 10, 18, title)]; y = A4P_H - M - 46; };
  const need = h => { if(y - h < M){ pages.push({ content: cur.join("\n"), w: A4P_W, h: A4P_H }); start(); } };
  start();
  const count = arr => { const o = {}; arr.forEach(e => { const k = e.st.menu || "none"; o[k] = (o[k] || 0) + 1; }); return o; };
  const fmt = o => MENUS.concat(["none"]).filter(k => o[k]).map(k => o[k] + " × " + (k === "none" ? t("menuNone") : t("menu_" + k))).join("   ");
  cur.push(pdfText(M, y, 12, t("kitchenTotal").replace("{n}", String(list.length))));
  y -= 18;
  pdfWrap(fmt(count(list)), 80).forEach(l => { cur.push(pdfText(M, y, 11, l)); y -= 15; });
  y -= 10;
  const groups = new Map();
  list.forEach(e => { const k = e.table ? "t" + e.table : "s"; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const keys = Array.from(groups.keys()).sort((a, b) => (a === "s" ? 1e9 : +a.slice(1)) - (b === "s" ? 1e9 : +b.slice(1)));
  keys.forEach(k => {
    const arr = groups.get(k).sort((a, b) => a.seat - b.seat);
    need(40);
    cur.push("0.93 0.95 0.97 rg " + M + " " + (y - 5).toFixed(1) + " " + (A4P_W - 2 * M) + " 19 re f");
    cur.push(pdfText(M + 6, y, 12, (k === "s" ? t("kitchenNoTable") : t("tableNo").replace("{n}", k.slice(1))) + " · " + arr.length));
    const sm = fmt(count(arr));
    cur.push(pdfText(A4P_W - M - 6 - pdfTextW(sm, 9.5), y, 9.5, sm, "0.353 0.420 0.459"));
    y -= 22;
    arr.filter(e => e.st.menu || e.st.note).forEach(e => {
      need(16);
      cur.push(pdfText(M + 10, y, 10.5, e.st.name));
      cur.push(pdfText(M + 200, y, 10.5, e.st.menu ? t("menu_" + e.st.menu) : "–"));
      if(e.st.note){
        const ls = pdfWrap(e.st.note, 40);
        ls.forEach((l, i) => { if(i) { y -= 13; need(14); } cur.push(pdfText(M + 300, y, 10, l, "0.6 0.15 0.1")); });
      }
      y -= 15;
    });
    y -= 6;
  });
  pages.push({ content: cur.join("\n"), w: A4P_W, h: A4P_H });
  return pages;
}

let lessonMode = false, pickedId = null, pickTimer = null;
