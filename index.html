<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: content: filesystem:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob: content: filesystem:; connect-src 'self' blob: data: filesystem:; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="description" content="FairSeat – Sitzpläne, Stundenplan und Bewertungen für Lehrkräfte. Offline, ohne Cloud.">
<title>FairSeat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===================== Design-Tokens =====================
   Farbwelt wie FairMix: hellblauer Grund, dunkelblaue Kopfzeile,
   kräftige Kacheln. Grün = Namen, Blau = Räume, Lila = Sitzpläne. */
:root{
  --board:#003366; --board-dark:#002247; --chalk:#FFFFFF;
  --paper:#bcdcff; --surface:#FFFFFF; --surface-2:#EEF5FD;
  --ink:#003366; --ink-soft:#4a6a8a;
  --line:#a8cdf5; --line-soft:#d6e8fb;
  --border:#0055aa;
  --accent:#0059b3; --accent-soft:#dbe9fb; --accent-ink:#FFFFFF;
  --warn:#c40000;
  --c-green:#00752c; --c-blue:#0059b3; --c-purple:#5c2d91; --c-orange:#b35c00; --c-grey:#4f5a68; --c-teal:#006d77;
  --desk:#FFFDF7; --desk-line:#16232B;
  --grid:rgba(0,89,179,.07); --grid-strong:rgba(0,89,179,.16);
  --wall:#46505E; --chair:#C9D3DC; --table:#F3E6CF; --table-line:#B0915F; --table-ink:#7A5B30;
  --radius:12px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
[data-theme="dark"]{
  --board:#2c2033; --board-dark:#1d1522; --chalk:#e6e6ee;
  --paper:#121220; --surface:#1e1e30; --surface-2:#26263a;
  --ink:#e6e6ee; --ink-soft:#9aa3b5;
  --line:#3d3d55; --line-soft:#2c2c42;
  --border:#5b9ce6;
  --accent:#5b9ce6; --accent-soft:#22304a; --accent-ink:#0b1424;
  --warn:#e03535;
  --c-green:#17a34a; --c-blue:#2f86e0; --c-purple:#9a6ad6; --c-orange:#d97b0a; --c-grey:#6b7684; --c-teal:#1a9aa5;
  --desk:#2a2a40; --desk-line:#8e97b0;
  --grid:rgba(91,156,230,.08); --grid-strong:rgba(91,156,230,.18);
  --wall:#8A93A6; --chair:#3A4A5C; --table:#3B3428; --table-line:#9C8457; --table-ink:#E2CFA9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--paper)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-contrast:more){
  :root{--line:#7A8A93;--ink-soft:#3B4A52}
  .item{border-width:2px}
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); -webkit-user-select:none; user-select:none;
  font-size:15px; line-height:1.45;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
input,textarea,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===================== Screens ===================== */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* --------- Startseite im FairMix-Stil --------- */
#screen-start{background:var(--paper);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
#screen-start.active{display:block}
.appbar{background:var(--board);color:#fff;
  padding:calc(20px + var(--safe-t)) calc(18px + var(--safe-r)) 20px calc(18px + var(--safe-l))}
.appbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.app-logo{width:64px;height:64px;border-radius:15px;overflow:hidden;flex:0 0 auto;background:#f4f8fc}
.app-logo svg{width:100%;height:100%;display:block}
.brand{font-size:clamp(24px,6.6vw,42px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.brand span{display:block;font-weight:400;opacity:.8;font-size:14.5px;letter-spacing:.01em;margin-top:6px;line-height:1.4}
.appbar-tools{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.themebtn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.board-inner{padding:20px 18px calc(48px + var(--safe-b));max-width:760px;margin:0 auto}
.langbar{display:flex;gap:10px;justify-content:center;margin:0 0 18px}
.flagbtn{width:52px;height:34px;border-radius:6px;overflow:hidden;
  border:2px solid var(--border);opacity:.4;transition:.18s;display:block}
.flagbtn svg{width:100%;height:100%;display:block}
.flagbtn.on{opacity:1}
.classbar{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.classbar label{font-weight:700;font-size:15px;flex:0 0 auto}
.classbar select{flex:1 1 auto;min-width:0;margin:0}
.classbar .cnt{font-size:13px;color:var(--ink-soft);flex:0 0 auto}
.home-tile{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;margin:12px 0 0;
  border-radius:16px;padding:16px 18px;color:#fff;text-align:left;
  box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .1s,filter .15s}
.home-tile:active{transform:scale(.985)}
.home-tile:hover{filter:brightness(1.07)}
.home-tile .ht-ico{width:50px;height:50px;border-radius:13px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.home-tile .ht-ico svg.i{width:28px;height:28px}
.home-tile .ht-t{font-size:20px;font-weight:750;display:block}
.home-tile .ht-s{font-size:13.5px;opacity:.9;display:block;margin-top:3px;line-height:1.4}
.home-tile .ht-n{margin-left:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);
  padding:4px 10px;border-radius:99px;white-space:nowrap}
.bg-green{background:var(--c-green)} .bg-blue{background:var(--c-blue)}
.bg-purple{background:var(--c-purple)} .bg-orange{background:var(--c-orange)} .bg-grey{background:var(--c-grey)} .bg-teal{background:var(--c-teal)}
.board-card{background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;
  gap:12px;width:100%;text-align:left;color:var(--ink)}
.board-card .cc-name{font-size:16.5px;font-weight:650}
.board-card .cc-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.board-card .cc-go{margin-left:auto;color:var(--ink-soft)}
.board-search{width:100%;padding:11px 13px;border-radius:10px;margin-bottom:10px;
  background:var(--surface);border:2px solid var(--border);color:var(--ink);
  font-size:15px;-webkit-appearance:none;appearance:none}
.board-add{border:2px dashed var(--border);border-radius:var(--radius);padding:13px;
  width:100%;color:var(--accent);background:var(--surface);font-size:15px;font-weight:650;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.board-note{margin-top:22px;font-size:12.5px;line-height:1.65;color:var(--ink-soft);text-align:center}
.board-empty{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:6px 0 14px}
.sec-label{margin:28px 0 10px;color:var(--ink);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:750;display:flex;align-items:center;gap:8px}
.minirow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.minibtn{border:0;background:var(--c-grey);border-radius:10px;padding:11px 14px;
  font-size:14px;font-weight:650;color:#fff;display:flex;align-items:center;gap:7px}
.minibtn.green{background:var(--c-green)} .minibtn.blue{background:var(--c-blue)}
.minibtn.red{background:var(--warn)} .minibtn.purple{background:var(--c-purple)}
.minibtn.outline{background:var(--surface);color:var(--ink);border:2px solid var(--border)}

/* --------- Helle Screens --------- */
.topbar{display:flex;align-items:center;gap:4px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:0 0 auto;
  padding:calc(7px + var(--safe-t)) calc(8px + var(--safe-r)) 7px calc(8px + var(--safe-l))}
.topbar h2{font-size:15.5px;margin:0 0 0 4px;font-weight:650;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:var(--ink);flex:0 0 auto}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.iconbtn.danger{color:var(--warn)}
.iconbtn[disabled]{opacity:.3}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px calc(14px + var(--safe-r)) calc(34px + var(--safe-b)) calc(14px + var(--safe-l))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.card .t{font-size:15.5px;font-weight:600}
.card .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.card .go{margin-left:auto;color:var(--ink-soft)}
.addbtn{width:100%;padding:13px;border:1px dashed var(--line);border-radius:var(--radius);
  color:var(--accent);font-weight:650;background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:8px}
.chipwrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:7px 12px;font-size:13.5px;display:flex;align-items:center;gap:6px;font-weight:500}
.chip.front{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip svg.i{width:14px;height:14px}
.conflict{background:#F8E9E4;border:1px solid var(--warn);border-radius:9px;padding:10px 12px;
  margin-top:10px;font-size:13px;line-height:1.55;color:#7A3222}
[data-theme="dark"] .conflict{background:#33211C;color:#F0BCAA}
.conflict b{display:block;margin-bottom:4px}
.anglebox{text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.anglechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.anglechips button{flex:1 1 58px;border:1px solid var(--line);border-radius:8px;padding:9px 4px;
  font-size:13px;font-weight:600;background:var(--surface)}
.anglechips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input[type=range]{width:100%;margin:14px 0 0;accent-color:var(--accent);height:28px}
.previewbox{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7;max-height:160px;overflow-y:auto}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-size:15px;margin-top:8px}
textarea.field{min-height:104px;resize:vertical;line-height:1.5}
select.field{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
  linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:12px 16px;
  font-weight:650;width:100%;margin-top:10px;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:11px 14px;font-weight:600;font-size:14px;text-align:center}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:8px}
.rulerow{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;font-size:13.5px}
.rulerow .rt{flex:1}
.rulerow .badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.rulerow .badge.no{background:#F6E3DE;color:var(--warn)}
[data-theme="dark"] .rulerow .badge.no{background:#3A241F}

/* --------- Seiten im FairMix-Stil --------- */
.topbar{background:var(--board);color:#fff;border-bottom:0}
.topbar .iconbtn{color:#fff}
.topbar .iconbtn:active,.topbar .iconbtn.on{background:rgba(255,255,255,.2);color:#fff}
.topbar .iconbtn.danger{color:#ffb3b3}
.topbar h2{font-size:17px}
.screen .scroll{background:var(--paper)}
.wrapc{max-width:760px;margin:0 auto}
.card,.rulerow,.setrow,.infoblock{border:2px solid var(--border)}
.pagehead{font-size:clamp(22px,5.4vw,28px);font-weight:800;margin:4px 0 14px;text-align:center}
.box{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.box > .eyebrow:first-child{margin-top:0}
.box .eyebrow{color:var(--ink);font-weight:750;font-size:12px;margin-top:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow > *{flex:1 1 140px}
.cbtn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:650;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;background:var(--c-blue)}
.cbtn.green{background:var(--c-green)} .cbtn.red{background:var(--warn)}
.cbtn.purple{background:var(--c-purple)} .cbtn.grey{background:var(--c-grey)} .cbtn.orange{background:var(--c-orange)}
.cbtn.outline{background:var(--surface);color:var(--ink);border:2px solid var(--border)}
.cbtn:active{transform:scale(.98)}
.cbtn[disabled]{opacity:.45}
.classhead{display:flex;align-items:center;gap:4px;margin:-4px 0 6px}
.classhead h3{flex:1;margin:0;font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-top:6px;
  border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.ccard .cn{font-weight:700;font-size:15.5px}
.ccard .cm{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.ccard .ck{margin-left:auto;color:var(--accent);font-weight:800}
.ccard.on{border-color:var(--accent);background:var(--accent-soft)}
.namelist{list-style:none;margin:10px 0 0;padding:0}
.namerow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line-soft)}
.namerow:last-child{border-bottom:0}
.namerow .nr{flex:0 0 auto;min-width:2.1em;text-align:right;font-size:14px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.namerow .nm{flex:1;min-width:0;font-size:15.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namerow .tg{display:flex;gap:3px;color:var(--accent)}
.namerow .tg svg.i{width:15px;height:15px}
.lvl{width:44px;height:36px;border-radius:9px;border:2px dashed var(--line);font-weight:800;
  font-size:15px;color:var(--ink-soft);flex:0 0 auto;touch-action:manipulation}
.lvl.l1{border:2px solid #00752c;background:#dcf3e3;color:#00752c}
.lvl.l2{border:2px solid #b35c00;background:#fbe9d6;color:#8a4600}
.lvl.l3{border:2px solid #5c2d91;background:#ece2f7;color:#5c2d91}
[data-theme="dark"] .lvl.l1{background:#173a24;color:#7fe0a0}
[data-theme="dark"] .lvl.l2{background:#3d2a12;color:#f5b66b}
[data-theme="dark"] .lvl.l3{background:#2f2342;color:#c8a6f0}
.namerow .ed{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.lvlstats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gdot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.segmented.wrap{flex-wrap:wrap}.segmented.wrap button{flex:1 1 80px}
.lvlstats span{font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:99px;background:var(--surface-2)}
.pairpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pairpick select{flex:1 1 130px}
.grpcard{border:2px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);font:inherit}
.grpcard b{display:flex !important;align-items:center;gap:7px}
.pdot{position:absolute;left:50%;bottom:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.28);pointer-events:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.swatches button.on{border-color:var(--ink)}
.chklist{max-height:42vh;overflow:auto;border:2px solid var(--line);border-radius:10px;margin-top:6px}
.chklist button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14.5px}
.chklist button:last-child{border-bottom:0}
.chklist .box2{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.chklist button.on .box2{background:var(--accent);border-color:var(--accent);color:#fff}
.chklist .other{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.grpcard b{display:block;font-size:13.5px;margin-bottom:3px}
.grpcard div{font-size:13px;color:var(--ink-soft);line-height:1.5}
.chip.drag{touch-action:none;cursor:grab;border:2px solid var(--border)}
.chip.absentchip{opacity:.6;border-style:dashed}
.chip.armed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dragghost{position:fixed;z-index:300;pointer-events:none;padding:7px 13px;border-radius:99px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);transform:translate(-50%,-130%);white-space:nowrap}
.item.droptarget{box-shadow:0 0 0 4px var(--c-green)!important;border-color:var(--c-green)}
.item.found{box-shadow:0 0 0 5px #FFB300,0 0 0 9px rgba(255,179,0,.35)!important;z-index:9;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 9px #FFB300,0 0 0 16px rgba(255,179,0,.25)}}
.item.swapsrc{box-shadow:0 0 0 4px var(--c-orange)!important}
.choice{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;width:100%;
  display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface)}
.choice .txt{flex:1}
.choice .sub{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:400}
.choice b{font-weight:650;font-size:14.5px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.choice.on .mk{border:6px solid var(--accent)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:6px}
.paltile{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px 7px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1.15;
  color:var(--ink);touch-action:pan-y;cursor:grab;text-align:center}

/* ---- Stundenplan ---- */

.srow{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.wout{font-size:15px;font-weight:700;margin-top:10px}

/* Bewerten im Sitzplan */
.gradebar{display:none;flex:0 0 auto;background:var(--surface);border-top:2px solid var(--border);
  padding:8px 10px calc(8px + var(--safe-b));flex-direction:column;gap:6px}

  color:var(--ink-soft);touch-action:none;border-bottom:1px solid var(--line-soft)}

    padding:6px 8px calc(6px + var(--safe-b)) 8px;padding-right:calc(8px + var(--safe-r))}

}

  padding:calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 12px calc(16px + var(--safe-l))}

body.selfmode #screen-editor > .topbar,body.selfmode .panels,body.selfmode .lessonbar,body.selfmode .selbar,

.sh-tx{flex:1;min-width:0}

@keyframes shring{from{clip-path:polygon(50% 50%,50% 0,50% 0,50% 0,50% 0,50% 0)}25%{clip-path:polygon(50% 50%,50% 0,100% 0,100% 50%,100% 50%,100% 50%)}
  50%{clip-path:polygon(50% 50%,50% 0,100% 0,100% 100%,50% 100%,50% 100%)}75%{clip-path:polygon(50% 50%,50% 0,100% 0,100% 100%,0 100%,0 50%)}
  to{clip-path:polygon(50% 50%,50% 0,100% 0,100% 100%,0 100%,0 0)}}
body.selfmode #stage-wrap{background:#F1E9FC}

.item .ckmark{position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:#1E7A3C;color:#fff;

/* ===================== Editor ===================== */

/* Der Raum: Boden als Hintergrund, Wände als kräftiger Rahmen, darüber ein
   Raster in Metern (fein 50 cm, kräftiger je Meter). 150 px = 1 m. */
#stage{position:absolute;top:0;left:0;width:1400px;height:1000px;background:var(--surface);
  transform-origin:0 0;box-shadow:0 0 0 12px var(--wall),0 0 0 13px rgba(0,0,0,.25),0 10px 40px 12px rgba(0,30,60,.18)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--grid-strong) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--grid-strong) 1px,transparent 1px),
                   linear-gradient(to right,var(--grid) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:150px 150px,150px 150px,75px 75px,75px 75px}
/* Weit herausgezoomt würde das Raster flimmern – dann nur Boden und Wände */
#stage[data-grid="off"]::before{display:none}
#stage.floor-parquet{background:repeating-linear-gradient(90deg,transparent 0 179px,rgba(160,120,70,.18) 179px 180px) 0 0/180px 46px,
  repeating-linear-gradient(0deg,#F1E1C6 0 22px,#EDDCBF 22px 23px),#F1E1C6}
#stage.floor-tiles{background:linear-gradient(90deg,#DCE2E6 1.5px,transparent 1.5px) 0 0/75px 75px,
  linear-gradient(#DCE2E6 1.5px,transparent 1.5px) 0 0/75px 75px,#F5F7F8}
#stage.floor-carpet{background:radial-gradient(#D8DDEA 1px,transparent 1.4px) 0 0/9px 9px,#E8EBF3}
#stage.floor-stone{background:linear-gradient(90deg,#D3CFC7 2px,transparent 2px) 0 0/150px 150px,
  linear-gradient(#D3CFC7 2px,transparent 2px) 0 0/150px 150px,#ECE9E3}
[data-theme="dark"] #stage.floor-parquet{background:repeating-linear-gradient(0deg,#3B3125 0 22px,#2F271D 22px 23px),#3B3125}
[data-theme="dark"] #stage.floor-tiles{background:linear-gradient(90deg,#2C2C42 1.5px,transparent 1.5px) 0 0/75px 75px,
  linear-gradient(#2C2C42 1.5px,transparent 1.5px) 0 0/75px 75px,#23233A}
[data-theme="dark"] #stage.floor-carpet{background:radial-gradient(#33384F 1px,transparent 1.4px) 0 0/9px 9px,#272B40}
[data-theme="dark"] #stage.floor-stone{background:linear-gradient(90deg,#3A3833 2px,transparent 2px) 0 0/150px 150px,
  linear-gradient(#3A3833 2px,transparent 2px) 0 0/150px 150px,#2B2A27}
#stage.mirrored{}
.item{position:absolute;top:0;left:0;border-radius:5px;display:flex;align-items:center;
  justify-content:center;text-align:center;font-size:12px;line-height:1.15;padding:3px;
  overflow:hidden;border:1.5px solid var(--desk-line);background:var(--surface);
  transform-origin:center;will-change:transform}
.item.dim{opacity:.42}
.item.sel{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent);z-index:6}
.item .lbl{pointer-events:none;word-break:break-word;max-width:100%;transform-origin:center}
/* --- Objekte: eigenständige Optik statt einheitlicher Kästchen --- */
.item .lbl{position:relative;z-index:2}
.item{box-shadow:0 1px 2px rgba(0,0,0,.07)}

.t-desk{background:var(--desk);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.07)}
.t-desk.empty{border-style:dashed;color:var(--ink-soft);box-shadow:none}
.t-teacherdesk{background:linear-gradient(180deg,#F3F7F8,#DFE8EC);color:#22333C;font-weight:650;
  border-color:#5E7580;box-shadow:inset 0 -5px 0 rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.12)}

/* Kreidetafel mit Ablage */
.t-board{background:linear-gradient(180deg,#354C3D,#293A30);color:#EDEDE4;
  border-color:#16201A;border-width:2px;font-size:11px;letter-spacing:.03em}
.t-board::after{content:"";position:absolute;left:5%;right:5%;bottom:2px;height:3px;
  border-radius:2px;background:linear-gradient(180deg,#C9A97A,#9C8055)}
/* Whiteboard */
.t-whiteboard{background:linear-gradient(180deg,#FFFFFF,#E9EFF2);color:#31454F;
  border-color:#8FA4AE;border-width:2px;font-size:11px}
.t-whiteboard::after{content:"";position:absolute;left:5%;right:5%;bottom:2px;height:3px;
  border-radius:2px;background:#B7C4CB}
/* Digitale Tafel: Display mit leichtem Leuchten */
.t-digitalboard{background:linear-gradient(180deg,#26333D,#131B21);color:#8FD3E8;
  border-color:#080D11;border-width:2px;font-size:11px;
  box-shadow:inset 0 0 14px rgba(143,211,232,.22),0 1px 3px rgba(0,0,0,.3)}
/* Leinwand */
.t-screen{background:linear-gradient(180deg,#FAFBFB,#D9E1E5);color:#48575F;border-color:#95A5AD}
.t-screen::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#8B9AA2}
/* Pinnwand aus Kork */
.t-pinboard{background:repeating-linear-gradient(48deg,#C89C6E 0 4px,#BD8F5E 4px 8px);
  color:#3B2A18;border-color:#8A6236;border-width:2px}
/* Flipchart mit Papierlinien */
.t-flipchart{background:#FFFEF8;color:#63737C;border-color:#B7C2C8}
.t-flipchart::after{content:"";position:absolute;left:7px;right:7px;top:9px;height:2px;
  background:#E0E6EA;box-shadow:0 7px 0 #E0E6EA,0 14px 0 #E0E6EA,0 21px 0 #E0E6EA}

/* Tür mit Griff */
.t-door{background:linear-gradient(180deg,#F0DFC6,#E2CBA9);color:#4A3A28;border-color:#9C7B52}
.t-door::after{content:"";position:absolute;right:5px;top:50%;width:9px;height:2px;
  border-radius:1px;background:#8A6A45;transform:translateY(-50%)}
/* Fenster mit Sprossen */
.t-window{background:linear-gradient(180deg,#E6F3F9,#C6E1EE);color:#26454F;border-color:#7FAFC4}
.t-window::after{content:"";position:absolute;left:2px;right:2px;top:1px;bottom:1px;
  background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(110,160,182,.85) 26px 28px)}
/* Trennwand */
.t-wall{background:repeating-linear-gradient(45deg,#DADFE2 0 5px,#C6CDD1 5px 10px);
  color:#45525A;border-color:#95A0A6}

/* Schrank mit Flügeltüren */
.t-cabinet{background:linear-gradient(180deg,#F2EBDE,#E1D6C3);color:#463D2E;border-color:#9C8663}
.t-cabinet::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;
  margin-left:-1px;background:rgba(140,118,84,.75)}
/* Regal mit Böden */
.t-shelf{background:repeating-linear-gradient(180deg,#EFE8DC 0 11px,#D7CBB5 11px 13px);
  color:#463D2E;border-color:#9C8663}
/* Waschbecken */
.t-sink{background:linear-gradient(180deg,#EDF4F6,#CFE0E5);color:#284754;
  border-radius:6px 6px 42% 42%;border-color:#8FAEB9}
.t-sink::after{content:"";position:absolute;left:50%;bottom:22%;width:8px;height:8px;
  margin-left:-4px;border-radius:50%;background:rgba(90,130,145,.45)}
/* Rechnerarbeitsplatz mit Monitor */
.t-computer{background:linear-gradient(180deg,#F0F0F4,#DCDCE4);color:#33333D;border-color:#8B8B99}
.t-computer::after{content:"";position:absolute;left:16%;right:16%;top:14%;height:42%;
  border-radius:2px;background:linear-gradient(180deg,#4B5A67,#33404A)}
/* Pflanze */
.t-plant{background:radial-gradient(circle at 38% 32%,#C3DCB7,#7CA673);border-radius:50%;
  color:#25351F;border-color:#5E8455}
/* Sitzkreis-Teppich */
.t-carpet{background:radial-gradient(ellipse at 45% 40%,#F8F0F0,#E4D3D3);border-style:dotted;
  border-radius:20px;color:#5A4444;border-color:#C4A9A9}
/* Runder Tisch */
.t-roundtable{background:radial-gradient(circle at 36% 30%,#FFFDF7,#EDE3D1);border-radius:50%;
  color:#4A4030;border-color:#B4A188}
/* Uhr */
.t-clock{background:radial-gradient(circle at 40% 34%,#FFFFFF,#E6EBEE);border-radius:50%;
  color:#3B4A52;border-color:#6E808A;font-size:10px}
/* Papierkorb */
.t-trash{background:linear-gradient(180deg,#EAEDEF,#D6DCDF);border-radius:3px 3px 9px 9px;
  color:#44525A;border-color:#8A969C;font-size:10px}

/* Stühle an Schultischen: ein Stummel hinter dem Tisch, bei Doppeltischen zwei */
.t-desk{overflow:visible}
.t-desk:not(.seat)::after,.t-desk.wide::before{content:"";position:absolute;bottom:-10px;height:8px;
  border-radius:0 0 7px 7px;background:var(--chair);border:1.5px solid var(--desk-line);border-top:0;pointer-events:none}
.t-desk:not(.seat)::after{left:32%;right:32%}
.t-desk.wide::after{left:14%;right:62%}
.t-desk.wide::before{left:62%;right:14%}
.t-desk.seat{border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.12)}
/* Tischplatten unter den Stühlen (runde Tische, Tafeln) */
.ptable{position:absolute;top:0;left:0;background:var(--table);border:2px solid var(--table-line);
  display:flex;align-items:center;justify-content:center;pointer-events:none;transform-origin:center;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.12);border-radius:10px}
.ptable.round,.ptable.oval{border-radius:50%}
.ptable.square{border-radius:6px}
.ptable.dim{opacity:.42}
.ptable .tlbl{color:var(--table-ink);font-weight:750;white-space:nowrap}
/* Aula */
.t-stage{background:linear-gradient(180deg,#6B4532,#46291C);color:#F6E7D2;border-color:#2A1A10;border-width:2px;font-weight:700}
.t-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#3B2318 0 18px,#55362A 18px 20px)}
.t-coatrack{background:repeating-linear-gradient(90deg,#F1EBE1 0 12px,#D9CFBF 12px 14px);color:#5A4A33;border-color:#9C8663}
.t-pillar{background:radial-gradient(circle at 38% 32%,#EEF1F3,#AEB7BE);border-radius:50%;color:transparent;border-color:#78838B;border-width:2px}
.t-label{background:transparent;border:1px dashed var(--line);color:var(--ink-soft);
  font-style:italic;box-shadow:none}
.exbadge{position:absolute;left:-1.5px;top:-1.5px;min-width:18px;height:18px;border-radius:6px 0 8px 0;
  background:var(--c-blue);color:#fff;font-style:normal;font-weight:800;font-size:11px;line-height:18px;text-align:center;z-index:3}
.exbadge.b{background:var(--c-orange)}
.exbadge::after{content:attr(data-no);position:absolute;left:100%;top:0;margin-left:3px;color:var(--ink-soft);font-size:10px;font-weight:700}
.lockmark{position:absolute;right:1px;top:1px;width:15px;height:15px;border-radius:50%;
  background:var(--c-orange);color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.lockmark svg.i{width:10px;height:10px;stroke-width:2.6}
.grouptag{position:absolute;top:-1.5px;left:-1.5px;width:10px;height:10px;border-radius:50% 0 50% 0}
.guide{position:absolute;background:var(--accent);opacity:.85;pointer-events:none;z-index:40}
.marquee{position:absolute;border:1.5px dashed var(--accent);background:rgba(15,110,140,.09);
  pointer-events:none;z-index:41}

.rothandle{position:absolute;z-index:30;width:44px;height:44px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);color:var(--accent);
  display:none;align-items:center;justify-content:center;touch-action:none;cursor:grab;
  box-shadow:0 2px 8px rgba(0,0,0,.22);margin-left:-22px;margin-top:-22px}
.rothandle.on{display:flex}
.rothandle.active{background:var(--accent);color:var(--accent-ink);cursor:grabbing}
.rothandle::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:16px;
  margin-left:-1px;background:var(--accent);opacity:.6}
.rotbadge{position:absolute;z-index:31;display:none;background:var(--ink);color:var(--surface);
  border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;pointer-events:none;
  margin-left:-26px;margin-top:-58px;min-width:52px;text-align:center}
.rotbadge.on{display:block}
.rotbadge.snap{background:var(--accent);color:var(--accent-ink)}
.lockbtn{position:absolute;z-index:60;display:none;align-items:center;justify-content:center;
  top:calc(10px + var(--safe-t));right:calc(64px + var(--safe-r));width:44px;height:44px;
  border-radius:50%;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.2)}
body.presenting .lockbtn{display:flex}
.lockbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoombar{position:absolute;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:6px;
  right:calc(10px + var(--safe-r))}
.zoombar button{width:40px;height:40px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.10)}
.selbar{position:absolute;left:10px;right:62px;bottom:12px;z-index:25;
  background:var(--ink);color:var(--surface);border-radius:12px;padding:6px;display:none;
  gap:2px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.28);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.selbar::-webkit-scrollbar{display:none}
.selbar .sb-count{flex:0 0 auto;padding:0 9px 0 5px;font-size:12px;font-weight:700;opacity:.8;white-space:nowrap}
.selbar.on{display:flex}
.selbar button{padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;
  white-space:nowrap;display:flex;align-items:center;gap:5px;color:var(--surface)}
.selbar button:active{background:rgba(127,127,127,.3)}
.selbar button.del{color:#FF9B84}
.lessonbar{position:absolute;left:10px;right:62px;bottom:12px;z-index:26;
  background:var(--ink);color:var(--surface);border-radius:12px;padding:6px;display:none;
  gap:2px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.28);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lessonbar::-webkit-scrollbar{display:none}
#sb-grade.sb-main{background:var(--accent);color:#fff;border-radius:8px}
.lessonbar.on{display:flex;flex-wrap:wrap;overflow:visible}
.lessonbar button{padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;
  white-space:nowrap;display:flex;align-items:center;gap:5px;color:var(--surface)}
.lessonbar button:active{background:rgba(127,127,127,.3)}
.lessonbar .lb-count{padding:0 10px;font-size:12.5px;opacity:.75;white-space:nowrap}
.item.absent{opacity:.35;border-style:dashed;text-decoration:line-through}
.item.picked{box-shadow:0 0 0 4px #E8B44A;z-index:8}
.item .dot{position:absolute;right:2px;bottom:2px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.t-roundtable{background:var(--desk);border-radius:50%}
.infoblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;margin-bottom:10px}
.infoblock h3{margin:0 0 6px;font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.infoblock p{margin:0 0 8px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.infoblock p:last-child{margin-bottom:0}
.infoblock ol,.infoblock ul{margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
.setrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.setrow .st{font-size:15px;font-weight:600}
.setrow .ss{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
.switch{margin-left:auto;width:46px;height:27px;border-radius:99px;background:var(--line);
  position:relative;flex:0 0 auto;transition:background .18s}
.switch b{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on b{transform:translateX(19px)}
.segmented{display:flex;gap:6px;margin-top:10px}
.segmented button{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px 8px;
  font-size:13.5px;font-weight:600;background:var(--surface)}
.segmented button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stagehint{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:15;
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;
  font-size:12px;color:var(--ink-soft);max-width:calc(100% - 24px);text-align:center;
  transition:opacity .4s;pointer-events:none}
.stagehint.faded{opacity:0}
.coach{position:absolute;left:12px;bottom:14px;z-index:40;width:min(420px,calc(100% - 76px));
  background:var(--ink);color:var(--surface);border-radius:14px;padding:14px 14px 10px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.coach-t{font-size:15px;line-height:1.45;font-weight:600}
.coach-r{display:flex;align-items:center;gap:8px;margin-top:10px}
.coach-r span{flex:1;font-size:12px;opacity:.7}
.coach-r button{padding:8px 12px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--surface)}
.coach-r .primary{width:auto;margin:0;background:var(--c-orange);color:#fff}

.panels{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.tabbar{display:flex;flex:0 0 auto;order:2;padding-bottom:var(--safe-b);
  border-top:1px solid var(--line-soft)}
.tabbar button{flex:1;padding:9px 4px;font-size:11px;font-weight:600;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent)}
.panel{order:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:none;max-height:34vh}
.panel.on{display:block}
.panel h3{margin:0 0 3px;font-size:14px;font-weight:650}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center;
  font-size:12px;font-weight:600;background:var(--surface);line-height:1.25;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.tile svg.i{width:20px;height:20px;color:var(--accent)}
.tile:active{background:var(--accent-soft);border-color:var(--accent)}
.tile.wide{flex-direction:row;justify-content:flex-start;text-align:left;gap:9px;padding:11px}
.tile.wide .txt{flex:1}
.tile.wide .sub{font-weight:400;font-size:11.5px;color:var(--ink-soft);display:block;margin-top:2px}

/* Vorführmodus */
body.presenting .topbar,body.presenting .panels,body.presenting .stagehint,
body.presenting .lessonbar,body.presenting .checkbar,body.presenting .gradebar,body.viewlocked .zoombar,body.viewlocked .selbar,
body.viewlocked .rothandle{display:none!important}
body.presenting .selbar{right:62px}
body.presenting .item{font-size:15px;font-weight:600}
#exitPresent{position:fixed;z-index:60;display:none;
  top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));
  width:44px;height:44px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.2)}
body.presenting #exitPresent{display:flex}

/* iPad hochkant und schmale Tablets: Panel unten, Knöpfe in vier Spalten –
   der Plan ist querformatig und bekommt so die volle Breite */
@media (min-width:700px) and (max-width:859px), (min-width:860px) and (max-aspect-ratio:1/1){
  .panel .grid2{grid-template-columns:repeat(4,1fr)}
  .panel{max-height:30vh}
}
/* Tablet / iPad quer: Seitenleiste neben dem Plan */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .editor-body{flex-direction:row}
  .panels{order:0;width:330px;flex:0 0 330px;border-top:0;border-right:1px solid var(--line)}
  .tabbar{order:0;border-top:0;border-bottom:1px solid var(--line-soft);padding-bottom:0}
  .tabbar button{font-size:11.5px}
  .panel{max-height:none;flex:1}
  .panelgrip{display:none}
  body.panels-min .panel.on{display:block!important}
  .gradebar,.checkbar{order:0;width:330px;flex:0 0 330px;border-top:0;border-right:2px solid var(--border);overflow-y:auto}
}
@media (min-width:860px){
  .board-inner,.scroll{padding-left:max(24px,var(--safe-l));padding-right:max(24px,var(--safe-r))}
  .brand{font-size:44px}
}

/* ===================== Modal ===================== */
#modal{position:fixed;inset:0;background:rgba(12,20,25,.55);display:none;
  align-items:flex-end;justify-content:center;z-index:100}
#modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:20px 18px calc(20px + var(--safe-b));max-height:88vh;overflow-y:auto}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:16px;margin:20px}}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet .row{display:flex;gap:8px;margin-top:14px}
.sheet .row button{flex:1;margin-top:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:200;
  top:calc(62px + var(--safe-t));background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:opacity .22s;
  pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px}
#toast .toastbtn{background:var(--c-orange);color:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{display:none}}
</style>

I18N.de.info.push({ h:"Stundenplan und Bewertungen",
  p:["Auf der Startseite gibt es zwei weitere Kacheln. Im Stundenplan trägst du Fach, Klasse und Raum ein; Zeiten, Pausen und A/B-Wochen stellst du mit der Uhr ein, Farben je Fach mit dem Etikett. Auf der Startseite steht dann die laufende Stunde – ein Tipp öffnet den passenden Sitzplan.",
     "Unter Bewertungen legst du je Klasse und Fach Bewertungen an (Noten, Punkte oder Smileys), trägst sie über die Liste oder direkt im Sitzplan ein (Plätze antippen, Wert im Tastenfeld wählen) und siehst Durchschnitte, Notenspiegel und Verläufe. Im Sitzplan tippst du einen Namen an und wählst „Bewerten“ – im Unterrichtsmodus erscheint das Tastenfeld direkt beim Antippen. Ob dabei Noten, Punkte oder Smileys verwendet werden, legst du in den Einstellungen fest. Mit „Selbsteinschätzung“ in der Unterrichtsleiste schätzen sich die Schülerinnen und Schüler am Stundenende selbst ein: violetter Sitzplan, Name antippen, Smiley wählen. Beenden mit ✕ zwei Sekunden halten. Beides lässt sich in den Einstellungen ausblenden."] });
I18N.en.info.push({ h:"Timetable and assessments",
  p:["The start page has two more tiles. In the timetable you enter subject, class and room; set times, breaks and A/B weeks with the clock and colours per subject with the tag. The start page then shows the current period – one tap opens the matching seating plan.",
     "Under Assessments you create assessments per class and subject (grades, points or smileys), enter them in the list or right on the seating plan (tap seats, pick a value on the keypad) and see averages, distributions and trends. On the seating plan, tap a name and choose “Mark” – in lesson mode the keypad appears as soon as you tap. Whether grades, points or smileys are used is set in the settings. With “Self-assessment” in the lesson bar, pupils rate themselves at the end of the lesson: purple seating plan, tap your name, pick a smiley. To end, hold ✕ for two seconds. Both can be hidden in the settings."] });
I18N.de.info.forEach(sec => { if(sec.h === "Datenschutz") sec.p.splice(1, 0,
  "Für Lehrkräfte: Wer Schülerdaten auf einem privaten Gerät verarbeitet, braucht dafür in vielen Bundesländern eine schriftliche Genehmigung der Schulleitung (in Niedersachsen z. B. nach dem Erlass zu privaten IT-Systemen von Lehrkräften). Kläre das bitte vor der Nutzung mit echten Namen. Sichere das Gerät mit PIN oder Code, schütze Sicherungen mit einem Passwort und lösche Klassen, die du nicht mehr brauchst. In den Einstellungen kannst du Bewertungen und Beobachtungen zusätzlich mit Face ID, Fingerabdruck oder Geräte-PIN sperren."); });
I18N.en.info.forEach(sec => { if(sec.h === "Privacy") sec.p.splice(1, 0,
  "For teachers: processing pupils' data on a private device often needs written approval from the head teacher (in Lower Saxony, Germany, for example, under the ministry's decree on teachers' private IT systems). Please check this before using real names. Lock the device with a PIN or passcode, protect backups with a password and delete classes you no longer need. In the settings you can additionally lock assessments and observations with Face ID, fingerprint or the device PIN."); });

const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
/* Eigene Eigenschaft? Schützt Nachschlagetabellen vor Namen wie "constructor" oder "__proto__" */
const own = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);
/* IDs aus Dateien: Text, kurz, kein Name aus Object.prototype – sonst neu vergeben */
const safeId = v => typeof v === "string" && v.length > 0 && v.length <= 60 && !(v in Object.prototype) ? v : uid();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||8); }catch(e){} }
function icon(name){

let toastTimer = null;

  const el = $("#toast");
  el.textContent = msg;

/* Meldung mit „Rückgängig“ – nach Aktionen, die viel auf einmal ändern */
function toastUndo(msg){
  const el = $("#toast");
  el.textContent = "";
  const sp = document.createElement("span"); sp.textContent = msg;
  const b = document.createElement("button"); b.className = "toastbtn"; b.textContent = t("undoShort");
  b.onclick = () => { el.classList.remove("on"); undo(); };
  el.appendChild(sp); el.appendChild(b);
  el.classList.add("on", "act");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on", "act"), 5500);
}

const MAX_STUDENTS = 200, MAX_DESKS = 250, MAX_RULES = 500, MAX_ROOM_ITEMS = 300,

  available:true,
  get(k){
    try{ return window.localStorage.getItem(k); }
    catch(e){ this.available = false; return this.memory[k] ?? null; }
  },
  set(k,v){
    try{ window.localStorage.setItem(k,v); this.available = true; return true; }
    catch(e){ this.memory[k] = v; this.available = false; return false; }   // Quota o. Privatmodus
  }
};

/* Standard-Datensatz */
function defaultSettings(){
  return { lock:false, rules:true, tags:true, history:true, lesson:true, timetable:true, grades:true, quickScale:"grade" };

function emptyDB(){

/* --- Validierung: schützt vor beschädigten oder fremden Daten --- */
function sanitizeItem(raw){
  if(!raw || typeof raw !== "object") return null;
  const type = own(ITEMS, raw.type) ? raw.type : null;
  if(!type) return null;
  const def = ITEMS[type];
  const num = (v,fb) => (typeof v === "number" && isFinite(v)) ? v : fb;
  const it = {
    id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
    type,
    x: clamp(num(raw.x, 100), -400, ROOM_MAX_PX + 400),
    y: clamp(num(raw.y, 100), -400, ROOM_MAX_PX + 400),
    w: clamp(num(raw.w, def.w), 10, 1000),
    h: clamp(num(raw.h, def.h), 8, 1000),
    rot: ((Math.round(num(raw.rot, 0)) % 360) + 360) % 360
  };
  if(typeof raw.label === "string") it.label = raw.label.slice(0, 60);
  if(typeof raw.groupId === "string") it.groupId = raw.groupId.slice(0, 40);
  if(typeof raw.studentId === "string") it.studentId = raw.studentId.slice(0, 40);
  if(raw.locked === true && type === "desk") it.locked = true;
  if(type === "desk" && TABLE_KINDS.indexOf(raw.tbl) >= 0) it.tbl = raw.tbl;
  if(type === "desk" && (raw.var === "A" || raw.var === "B")) it.var = raw.var;
  return it;
}
function sizePx(v, fb){
  const n = (typeof v === "number" && isFinite(v)) ? v : fb;
  return Math.round(clamp(n, ROOM_MIN_M * PX_PER_M, ROOM_MAX_PX));
}
function sanitizeDB(raw){
  if(!raw || typeof raw !== "object") return null;
  const out = emptyDB();
  out.lang  = (raw.lang === "en") ? "en" : "de";
  out.theme = (raw.theme === "dark") ? "dark" : "light";
  const st = (raw.settings && typeof raw.settings === "object") ? raw.settings : {};
  out.settings = {
    lock:    st.lock    === true,
    rules:   st.rules   !== false,
    tags:    st.tags    !== false,
    history: st.history !== false,
    lesson:  st.lesson  !== false,
    timetable: st.timetable !== false,
    grades:  st.grades  !== false,
    quickScale: ["grade", "points", "smiley"].indexOf(st.quickScale) >= 0 ? st.quickScale : "grade",
    selfQuestion: typeof st.selfQuestion === "string" ? st.selfQuestion.slice(0, 100) : ""
  };

  out.rooms = Array.isArray(raw.rooms) ? raw.rooms.map(r => ({
    id: typeof r?.id === "string" && r.id ? r.id : uid(),
    name: typeof r?.name === "string" ? r.name.slice(0,60) : "Raum",
    /* Ältere Räume ohne Größe behalten die bisherige feste Fläche */
    w: sizePx(r?.w, ROOM_DEF_W), h: sizePx(r?.h, ROOM_DEF_H),
    floor: FLOORS.indexOf(r?.floor) >= 0 ? r.floor : "plain",
    items: Array.isArray(r?.items)
      ? r.items.map(sanitizeItem).filter(i => i && i.type !== "desk").slice(0, MAX_ROOM_ITEMS)
      : []
  })) : [];

  out.lastBackup = typeof raw.lastBackup === "string" ? raw.lastBackup.slice(0, 30) : "";
  /* Stundenplan */
  const isHex = v => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);
  out.subjects = Array.isArray(raw.subjects) ? raw.subjects.filter(x => x && typeof x.name === "string" && x.name.trim()).map(x => ({
    id: safeId(typeof x.id === "string" ? x.id.slice(0, 40) : ""), name: x.name.trim().slice(0, 30),
    short: typeof x.short === "string" ? x.short.slice(0, 6) : "", color: isHex(x.color) ? x.color.toUpperCase() : "#5C6B7A"
  })).slice(0, MAX_SUBJECTS) : [];
  const tt0 = raw.tt && typeof raw.tt === "object" ? raw.tt : {}, dt = defaultTT();
  const intIn = (v, lo, hi, d) => Number.isInteger(v) && v >= lo && v <= hi ? v : d;
  out.tt = {
    start: typeof tt0.start === "string" && /^\d{1,2}:\d{2}$/.test(tt0.start) ? tt0.start : dt.start,
    len: intIn(tt0.len, 20, 120, dt.len), count: intIn(tt0.count, 1, 12, dt.count), days: tt0.days === 6 ? 6 : 5,
    breaks: Array.from({ length: 11 }, (_, i) => intIn(Array.isArray(tt0.breaks) ? tt0.breaks[i] : undefined, 0, 120, Array.isArray(tt0.breaks) ? 0 : (dt.breaks[i] || 0))),
    ab: tt0.ab === true, abRef: typeof tt0.abRef === "string" && /^\d{4}-\d{2}-\d{2}$/.test(tt0.abRef) ? tt0.abRef : ""
  };
  const subjIds = new Set(out.subjects.map(x => x.id));
  out.lessons = Array.isArray(raw.lessons) ? raw.lessons.filter(L => L && subjIds.has(L.subjectId)).map(L => ({
    id: typeof L.id === "string" && L.id ? L.id.slice(0, 40) : uid(),
    day: intIn(L.day, 0, 5, 0), period: intIn(L.period, 0, 11, 0), span: L.span === 2 ? 2 : 1,
    week: L.week === "A" || L.week === "B" ? L.week : "", subjectId: L.subjectId,
    classId: typeof L.classId === "string" ? L.classId.slice(0, 40) : "", roomId: typeof L.roomId === "string" ? L.roomId.slice(0, 40) : "",
    planId: typeof L.planId === "string" ? L.planId.slice(0, 40) : ""
  })).slice(0, MAX_LESSONS) : [];
  /* Ausgefallene Stunden: "JJJJ-MM-TT|StundenID", nur zu vorhandenen Stunden */
  const lessonIds = new Set(out.lessons.map(L => L.id));
  out.cancelled = Array.isArray(raw.cancelled) ? raw.cancelled.filter((x, i, a) => typeof x === "string" && /^\d{4}-\d{2}-\d{2}\|/.test(x)
    && lessonIds.has(x.slice(11)) && a.indexOf(x) === i).slice(-500) : [];
  out.gradesAck = raw.gradesAck === true;
  out.panelsMin = raw.panelsMin === true;
  const sl = raw.selfLock;
  if(sl && typeof sl === "object" && typeof sl.classId === "string" && typeof sl.planId === "string" && typeof sl.assessId === "string")
    out.selfLock = { classId: sl.classId.slice(0, 60), planId: sl.planId.slice(0, 60), assessId: sl.assessId.slice(0, 60) };
  out.lastClass = typeof raw.lastClass === "string" ? raw.lastClass.slice(0, 40) : "";
  /* Wer schon Klassen hat, kennt die App – die Erststart-Frage entfällt */
  out.tipsDone = raw.tipsDone === true;
  out.onboarded = raw.onboarded === true || (Array.isArray(raw.classes) && raw.classes.length > 0);
  out.trash = Array.isArray(raw.trash) ? raw.trash.filter(e =>
    e && typeof e === "object" && ["class","plan","room"].indexOf(e.kind) >= 0 && e.payload
  ).map(e => ({
    id: typeof e.id === "string" && e.id ? e.id : uid(),
    kind: e.kind,
    name: typeof e.name === "string" ? e.name.slice(0,60) : "?",
    at: typeof e.at === "string" ? e.at : new Date().toISOString(),
    classId: typeof e.classId === "string" ? e.classId : null,
    payload: e.payload
  })).slice(-60) : [];

  out.classes = Array.isArray(raw.classes) ? raw.classes.map(c => {
    const students = Array.isArray(c?.students) ? c.students.map(s => {
      if(typeof s === "string") return { id: uid(), name: s.slice(0,40), tags:[] };   // v1-Format
      const tags = Array.isArray(s?.tags) ? s.tags.filter(x => TAGS.indexOf(x) >= 0) : [];
      if(s?.front === true && tags.indexOf("front") < 0) tags.push("front");           // altes Feld
      const lv = parseInt(s?.level, 10);
      return {
        id: safeId(s?.id),
        name: typeof s?.name === "string" ? s.name.slice(0,40) : "?",
        tags: tags.slice(0, TAGS.length),
        level: (lv >= 1 && lv <= 3) ? lv : 0,           // Stufe wie in FairMix: 0 = ohne, 1–3 = A–C
      };
    }).slice(0, MAX_STUDENTS) : [];
    const ids = new Set(students.map(s => s.id));
    return {
      id: typeof c?.id === "string" && c.id ? c.id : uid(),
      name: typeof c?.name === "string" ? c.name.slice(0,60) : "Klasse",
      archived: c?.archived === true,
      students,
      levelMode: (c?.levelMode === "hetero" || c?.levelMode === "homo") ? c.levelMode : "off",
      subNote: typeof c?.subNote === "string" ? c.subNote.slice(0, 1200) : "",
      color: typeof c?.color === "string" && /^#[0-9a-fA-F]{6}$/.test(c.color) ? c.color.toUpperCase() : "",
      /* Bewertungen je Fach */
      assess: Array.isArray(c?.assess) ? c.assess.filter(a => a && typeof a.subjectId === "string" && own(SCALE_TOKS, a.scale)).map(a => {
        const okTok = v => v === "x" || SCALE_TOKS[a.scale].indexOf(v) >= 0;
        const marks = {};
        if(a.marks && typeof a.marks === "object") Object.keys(a.marks).forEach(k => { if(ids.has(k) && own(a.marks, k) && okTok(a.marks[k])) marks[k] = a.marks[k]; });
        return { id: typeof a.id === "string" && a.id ? a.id.slice(0, 40) : uid(), subjectId: a.subjectId.slice(0, 40),
          title: typeof a.title === "string" ? a.title.slice(0, 100) : "", date: typeof a.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(a.date) ? a.date : "",
          kind: a.kind === "written" ? "written" : a.kind === "self" && a.scale === "smiley" ? "self" : "other", scale: a.scale, weight: [0.5, 1, 2, 3].indexOf(a.weight) >= 0 ? a.weight : 1,
          marks, ...(a.auto === true ? { auto: true } : {}) };
      }).slice(0, MAX_ASSESS) : [],
      gradeW: (c?.gradeW && typeof c.gradeW === "object") ? Object.keys(c.gradeW).reduce((o, k) => {
        const v = c.gradeW[k]; if(!(k in Object.prototype) && Number.isInteger(v) && v >= 0 && v <= 100) o[k.slice(0, 40)] = v; return o; }, {}) : {},
      gradeSubjects: Array.isArray(c?.gradeSubjects) ? c.gradeSubjects.filter(x => typeof x === "string").slice(0, MAX_SUBJECTS) : [],
      lastSubject: typeof c?.lastSubject === "string" ? c.lastSubject.slice(0, 40) : "",
      lastGradePlan: typeof c?.lastGradePlan === "string" ? c.lastGradePlan.slice(0, 40) : "",
      gradeRound: (c?.gradeRound && typeof c.gradeRound === "object") ? Object.keys(c.gradeRound).reduce((o, k) => {
        const r = c.gradeRound[k]; if(!(k in Object.prototype) && r && typeof r === "object") o[k.slice(0, 40)] = { fav: r.fav !== false, tend: r.tend === true }; return o; }, {}) : {},
      absLog: Array.isArray(c?.absLog) ? c.absLog.filter(e => e && typeof e.d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && Array.isArray(e.ids)).map(e => ({
        d: e.d, p: Number.isInteger(e.p) && e.p >= -1 && e.p <= 11 ? e.p : -1, n: e.n === 2 ? 2 : 1,
        s: typeof e.s === "string" ? e.s.slice(0, 40) : "", ids: e.ids.filter(x => ids.has(x)).slice(0, MAX_STUDENTS)
      })).slice(-3000) : [],
      /* Beobachtungen je Schüler (dauerhaft) und Abhaklisten */
      obs: Array.isArray(c?.obs) ? c.obs.filter(o => o && typeof o.sid === "string" && ids.has(o.sid) && typeof o.text === "string" && o.text.trim()
        && typeof o.d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o.d)).map(o => ({
        id: typeof o.id === "string" && o.id ? o.id.slice(0, 40) : uid(), sid: o.sid, d: o.d,
        s: typeof o.s === "string" ? o.s.slice(0, 40) : "", text: o.text.slice(0, 300)
      })).slice(-2000) : [],
      checks: Array.isArray(c?.checks) ? c.checks.filter(k => k && typeof k.title === "string" && k.title.trim()).map(k => ({
        id: typeof k.id === "string" && k.id ? k.id.slice(0, 40) : uid(), title: k.title.slice(0, 60),
        date: typeof k.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k.date) ? k.date : "",
        done: Array.isArray(k.done) ? k.done.filter((x, i, a) => typeof x === "string" && ids.has(x) && a.indexOf(x) === i).slice(0, MAX_STUDENTS) : []
      })).slice(0, MAX_CHECKS) : [],
      /* Aus FairMix übernommene Gruppen: Mitglieder als Schüler-IDs */
      groups: Array.isArray(c?.groups) ? c.groups.filter(g => g && Array.isArray(g.members)).map(g => ({
        id: typeof g.id === "string" && g.id ? g.id : uid(),
        name: typeof g.name === "string" ? g.name.slice(0,40) : "",
        color: Number.isInteger(g.color) && g.color >= 0 && g.color < 8 ? g.color : undefined,
        fm: g.fm === true || undefined,
        members: g.members.filter(x => ids.has(x)).filter((x, i, a) => a.indexOf(x) === i).slice(0, MAX_STUDENTS)
      })).filter(g => g.members.length).slice(0, MAX_GROUPS) : [],
      rules: Array.isArray(c?.rules) ? c.rules.filter(r =>
        r && (r.type === "apart" || r.type === "together") && ids.has(r.a) && ids.has(r.b) && r.a !== r.b
      ).map(r => ({ id: typeof r.id === "string" && r.id ? r.id : uid(), type:r.type, a:r.a, b:r.b })).slice(0, MAX_RULES) : [],
      plans: Array.isArray(c?.plans) ? c.plans.map(p => {

        const misplaced = all.filter(i => i.type !== "desk");
        if(misplaced.length){

             statt sie kommentarlos zu verwerfen. */
          const room = out.rooms.find(r => r.id === roomId);
          if(room) misplaced.forEach(i => { if(room.items.length < MAX_ROOM_ITEMS) room.items.push(i); });
        }
        return {

          name: typeof p?.name === "string" ? p.name.slice(0,60) : "Sitzplan",

          deskSize: own(DESK_SIZES, p?.deskSize) ? p.deskSize : "single",

              .map(d => { if(d.studentId && !ids.has(d.studentId)) delete d.studentId; return d; })
          } : undefined,
          seatsPerTable: [4,6,8,10,12].indexOf(p?.seatsPerTable) >= 0 ? p.seatsPerTable : 8,
          desks: all.filter(i => i.type === "desk").slice(0, MAX_DESKS).map(d => { if(d.studentId && !ids.has(d.studentId)) delete d.studentId; return d; })
        };
      }).slice(0, MAX_PLANS) : [],
      attendance: Array.isArray(c?.attendance) ? c.attendance.filter(a =>
        a && typeof a.date === "string" && Array.isArray(a.absent)
      ).map(a => ({ date: a.date.slice(0,10), absent: a.absent.filter(x => ids.has(x)).slice(0,200) }))
        .slice(-300) : [],
      history: Array.isArray(c?.history) ? c.history.filter(h => h && Array.isArray(h.pairs))
        .map(h => ({ t: typeof h.t === "string" ? h.t : "", ...(h.src === "fairmix" ? { src: "fairmix" } : {}),
                     pairs: h.pairs.filter(x => typeof x === "string" && x.split("|").every(id => ids.has(id))).slice(0, 400) }))   // nur noch vorhandene Schüler
        .slice(-HISTORY_MAX) : [],
      lesson: (c?.lesson && typeof c.lesson === "object") ? {
        date: typeof c.lesson.date === "string" ? c.lesson.date.slice(0,10) : "",
        absent: Array.isArray(c.lesson.absent) ? c.lesson.absent.filter(x => ids.has(x)).slice(0,200) : [],
        picked: Array.isArray(c.lesson.picked) ? c.lesson.picked.filter(x => ids.has(x)).slice(0,200) : [],
        notes: (c.lesson.notes && typeof c.lesson.notes === "object")
          ? Object.keys(c.lesson.notes).filter(k => ids.has(k))
              .reduce((o,k) => { o[k] = String(c.lesson.notes[k]).slice(0,200); return o; }, {})
          : {}
      } : { date:"", absent:[], picked:[], notes:{} }
    };
  }) : [];
  return out;
}

/* --- Migration v1 -> v2: alte Pläne enthielten Möbel und Tische gemischt --- */
function migrateV1(raw){
  const out = emptyDB();
  out.lang = raw.lang === "en" ? "en" : "de";
  (Array.isArray(raw.classes) ? raw.classes : []).forEach(oldC => {
    const students = (Array.isArray(oldC.students) ? oldC.students : [])
      .map(n => ({ id: uid(), name: String(n).slice(0,40), tags:[] }));
    const cls = { id: uid(), name: String(oldC.name || "Klasse").slice(0,60), students,
                  rules:[], plans:[], history:[], attendance:[], lesson:{ date:"", absent:[], picked:[], notes:{} } };
    (Array.isArray(oldC.plans) ? oldC.plans : []).forEach(oldP => {
      const items = Array.isArray(oldP.items) ? oldP.items : [];
      const room = { id: uid(), name: cls.name + " – " + String(oldP.name || ""), items: [] };
      const plan = { id: uid(), name: String(oldP.name || "Sitzplan").slice(0,60), roomId: room.id, desks: [] };
      items.forEach(raw2 => {
        const it = sanitizeItem(raw2);
        if(!it) return;
        if(it.type === "desk"){
          const match = students.find(s => s.name === it.label);   // Name -> ID auflösen
          if(match) it.studentId = match.id;
          plan.desks.push(it);
        } else room.items.push(it);
      });
      out.rooms.push(room);
      cls.plans.push(plan);
    });
    out.classes.push(cls);
  });
  return out;
}

function load(){
  let raw = Store.get(KEY);
  let parsed = null, broken = false, clean = null;
  /* Jeder Fehler beim Lesen, Umwandeln oder Prüfen: Rohstand unter KEY.defekt aufheben,
     bevor das nächste Speichern ihn überschreibt */
  const keep = txt => { broken = true; try{ if(txt) window.localStorage.setItem(KEY + ".defekt", txt); }catch(x){} };
  if(raw){
    try{ parsed = JSON.parse(raw); if(parsed && parsed.v !== 2) parsed = migrateV1(parsed); clean = parsed ? sanitizeDB(parsed) : null; }
    catch(e){ keep(raw); clean = null; }
  }
  if(!clean && !raw){
    const old = Store.get("sitzplan.v1");
    if(old){ try{ clean = sanitizeDB(migrateV1(JSON.parse(old))); }catch(e){ broken = true; } }
  }
  DB = clean || emptyDB();
  purgeTrash();
  prevState();                                        // räumt eine abgelaufene Kopie vor der Sicherung weg
  LANG = DB.lang;
  if(broken) setTimeout(() => toast(t("dataBroken")), 400);
}

let saveTimer = null, warnedFull = false;
/* Sofort schreiben – beim Wechsel in den Hintergrund darf nichts in der Warteschleife hängen */
function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  DB.lang = LANG;
  const ok = Store.set(KEY, JSON.stringify(DB));
  if(!ok && !warnedFull){ warnedFull = true; toast(t("storageFull")); }
  if(ok) warnedFull = false;
  return ok;
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 200);     // fasst schnelle Folgeänderungen zusammen
}

/* ---- Papierkorb: Löschen ist umkehrbar, das verhindert Datenverlust ---- */
function daysSince(iso){
  const t0 = Date.parse(iso);
  if(!isFinite(t0)) return 999;
  return Math.floor((Date.now() - t0) / 86400000);
}
function purgeTrash(){
  if(!Array.isArray(DB.trash)) { DB.trash = []; return; }
  const before = DB.trash.length;
  DB.trash = DB.trash.filter(e => daysSince(e.at) < TRASH_DAYS);
  if(DB.trash.length !== before) save();
}
function trashPush(kind, name, payload, classId){
  if(!Array.isArray(DB.trash)) DB.trash = [];
  DB.trash.push({ id: uid(), kind, name, at: new Date().toISOString(),
                  classId: classId || null, payload: clone(payload) });
  while(DB.trash.length > 60) DB.trash.shift();
}
function trashRestore(entryId){
  const i = DB.trash.findIndex(e => e.id === entryId);
  if(i < 0) return;
  const e = DB.trash[i];
  if(e.kind === "class"){
    const c = sanitizeDB({ v:2, classes:[e.payload] }).classes[0];
    if(c) DB.classes.push(c);
  } else if(e.kind === "room"){
    const r = sanitizeDB({ v:2, rooms:[e.payload] }).rooms[0];
    if(r) DB.rooms.push(r);
  } else if(e.kind === "plan"){
    const host = DB.classes.find(c => c.id === e.classId) || DB.classes[0];
    if(!host) return;                                  // ohne Klasse gibt es keinen Ort dafür
    const p = sanitizeDB({ v:2, classes:[{ name:"x", students:[], plans:[e.payload] }] }).classes[0].plans[0];
    if(p) host.plans.push(p);
  }
  DB.trash.splice(i, 1);
  save();
  toast(t("restored"));
  renderStart();
}

/* Raumgröße: 150 Pixel entsprechen einem Meter. Jeder Raum trägt seine
   eigene Größe; ROOM_W/ROOM_H gelten für den gerade geöffneten Raum und
   werden von useRoomSize() gesetzt (Vorlagen, Export und Gesten lesen sie). */
const PX_PER_M = 150, ROOM_MIN_M = 4, ROOM_MAX_M = 40;
const ROOM_DEF_W = 1400, ROOM_DEF_H = 1000;
const ROOM_MAX_PX = ROOM_MAX_M * PX_PER_M;
let ROOM_W = ROOM_DEF_W, ROOM_H = ROOM_DEF_H;
const FLOORS = ["plain", "parquet", "tiles", "carpet", "stone"];
function roomDims(r){
  return { w: r && r.w ? r.w : ROOM_DEF_W, h: r && r.h ? r.h : ROOM_DEF_H };
}
function useRoomSize(r){
  const d = roomDims(r);
  ROOM_W = d.w; ROOM_H = d.h;
  const st = document.getElementById("stage");
  if(st){
    st.style.width = ROOM_W + "px"; st.style.height = ROOM_H + "px";
    st.className = "floor-" + (r && FLOORS.indexOf(r.floor) >= 0 ? r.floor : "plain");
  }
}
/* Führt fn mit der Größe eines anderen Raums aus und stellt danach den offenen wieder her */
function withRoomSize(r, fn){
  const keepW = ROOM_W, keepH = ROOM_H;
  const d = roomDims(r); ROOM_W = d.w; ROOM_H = d.h;
  try{ return fn(); } finally { ROOM_W = keepW; ROOM_H = keepH; }
}

/* ============ 6. Undo / Redo ============ */
const UNDO_MAX = 60;
let undoStack = [], redoStack = [];
/* Der Schnappschuss merkt sich zusätzlich Namen und Regeln der Klasse.
   Vorher ließ sich ein versehentlich umbenannter oder gelöschter Name nicht zurückholen. */
function snapshot(){
  const c = curClass(), p = curPlan(), r = curRoom();
  return {
    classId: c ? c.id : null,
    students: c ? clone(c.students) : null,
    rules: c ? clone(c.rules) : null,
    groups: c ? clone(c.groups || []) : null,
    levelMode: c ? (c.levelMode || "off") : null,
    planId: p ? p.id : null,
    desks: p ? clone(p.desks) : null,
    planMeta: p ? { exam: !!p.exam, examPrev: p.examPrev ? clone(p.examPrev) : null, deskSize: p.deskSize } : null,
    roomId: r ? r.id : null,
    room: r ? clone(r.items) : null,
    roomSize: r ? { w: r.w, h: r.h, floor: r.floor } : null
  };
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  updateUndoButtons();
}
function restore(state){
  const c = state.classId ? DB.classes.find(x => x.id === state.classId) : null;
  if(c && state.students) c.students = clone(state.students);
  if(c && state.rules) c.rules = clone(state.rules);
  if(c && state.groups) c.groups = clone(state.groups);
  if(c && state.levelMode) c.levelMode = state.levelMode;
  const p = (c && state.planId) ? c.plans.find(x => x.id === state.planId) : null;
  if(p && state.desks) p.desks = clone(state.desks);
  if(p && state.planMeta){
    p.exam = state.planMeta.exam; p.deskSize = state.planMeta.deskSize;
    if(state.planMeta.examPrev) p.examPrev = clone(state.planMeta.examPrev); else delete p.examPrev;
  }
  const r = state.roomId ? DB.rooms.find(x => x.id === state.roomId) : null;
  if(r && state.room) r.items = clone(state.room);
  if(r && state.roomSize) Object.assign(r, state.roomSize);
  selected.clear();
  lastConflicts = [];
  renderStage(true);
  renderUnseated();
  renderClassScreen();
  save();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoButtons();
  haptic();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoButtons();
  haptic();
}
function updateUndoButtons(){
  $("#btn-undo").disabled = undoStack.length === 0;
  $("#btn-redo").disabled = redoStack.length === 0;
  const cu = $("#btn-undo-class");
  if(cu) cu.disabled = undoStack.length === 0;
}

/* ============ 9. Modale Dialoge ============ */
let modalPrevFocus = null;
function focusables(){
  return Array.prototype.filter.call(
    $("#sheet").querySelectorAll("button, input, select, textarea, [href]"),
    el => !el.disabled
  );
}
/* Ohne Fokusfalle springt die Tastatur aus dem Dialog heraus in die Seite dahinter */
function onModalKey(e){
  if(e.key !== "Tab") return;
  const list = focusables();
  if(!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function closeModal(){
  $("#modal").classList.remove("on");
  $("#modal").removeEventListener("keydown", onModalKey, true);
  $("#sheet").textContent = "";
  $("#sheet").classList.remove("welcome", "selfsheet");
  if(modalPrevFocus && modalPrevFocus.focus){ try{ modalPrevFocus.focus(); }catch(e){} }
  modalPrevFocus = null;
}
$("#modal").onclick = e => { if(e.target.id === "modal") closeModal(); };
/* Auf Touchgeräten folgt dem Antippen eines Platzes ein „Klick“ an derselben Stelle – der würde
   im gerade geöffneten Fenster landen (Hintergrund schließt, Smiley wird gewählt). Kurz abfangen. */
let modalOpenedAt = 0, stageTouchUpAt = -1e9;
$("#modal").addEventListener("click", e => {
  const fromStageTap = modalOpenedAt >= stageTouchUpAt && modalOpenedAt - stageTouchUpAt < 80;   // Fenster ging durch einen Tipp auf den Plan auf
  if(fromStageTap && Date.now() - modalOpenedAt < 450 && e.isTrusted){ e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if($("#modal").classList.contains("on")) closeModal();
    else if(presenting) setPresenting(false);
  }
  if(!$("#screen-editor").classList.contains("active") || viewLocked() || selfMode) return;
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if(mod && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); }
  if((e.key === "Delete" || e.key === "Backspace") && selected.size && document.activeElement === document.body){
    e.preventDefault(); deleteSelection();
  }
  /* Pfeiltasten verschieben pixelgenau — mit Umschalt in Einerschritten */
  const arrows = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
  if(arrows[e.key] && selected.size && document.activeElement === document.body){
    e.preventDefault();
    const step = e.shiftKey ? 1 : 5;
    const set = movingSet();
    if(!set.length) return;
    if(!keyMoveActive){ pushUndo(); keyMoveActive = true; }
    clearTimeout(keyMoveTimer);
    keyMoveTimer = setTimeout(() => { keyMoveActive = false; save(); }, 700);
    set.forEach(it => {
      it.x += arrows[e.key][0] * step;
      it.y += arrows[e.key][1] * step;
      keepInRoom(it, 0);
      const el = elCache.get(it.id);
      if(el) placeEl(el, it);
    });
  }
});
/* Baut einen Dialog auf — ausschließlich per DOM-API, nie per innerHTML mit Nutzertext */
function sheetBase(title){
  const sheet = $("#sheet");
  sheet.textContent = "";
  delete sheet.dataset.sens;                           // „sensibel“ setzen nur Blätter mit Noten oder Beobachtungen
  const h = document.createElement("h3");
  h.textContent = title;
  sheet.appendChild(h);
  sheet.setAttribute("aria-label", title);
  modalPrevFocus = document.activeElement;
  modalOpenedAt = Date.now();
  $("#modal").classList.add("on");
  $("#modal").addEventListener("keydown", onModalKey, true);
  setTimeout(() => { const l = focusables(); if(l.length) l[0].focus(); }, 40);
  return sheet;
}
function sheetButtons(sheet, okLabel, onOk, danger){
  const row = document.createElement("div");
  row.className = "row";
  const cancel = document.createElement("button");
  cancel.className = "ghost"; cancel.textContent = t("cancel"); cancel.onclick = closeModal;
  const ok = document.createElement("button");
  ok.className = "primary"; ok.textContent = okLabel;
  if(danger) ok.style.background = "var(--warn)";
  ok.onclick = onOk;
  row.appendChild(cancel); row.appendChild(ok);
  sheet.appendChild(row);
  return ok;
}
function askText(title, placeholder, value, okLabel, cb){
  const sheet = sheetBase(title);
  const inp = document.createElement("input");
  inp.className = "field"; inp.type = "text";
  inp.placeholder = placeholder || ""; inp.value = value || ""; inp.maxLength = 60;
  sheet.appendChild(inp);
  const submit = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } closeModal(); cb(v); };
  sheetButtons(sheet, okLabel, submit);
  inp.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  setTimeout(() => inp.focus(), 60);
}
function askConfirm(title, text, okLabel, cb, onCancel){
  const sheet = sheetBase(title);
  const p = document.createElement("p");
  p.className = "hint"; p.style.fontSize = "14px"; p.textContent = text;
  sheet.appendChild(p);
  const ok = sheetButtons(sheet, okLabel, () => { closeModal(); cb(); }, true);
  if(onCancel){ const c = ok.parentNode.querySelector("button.ghost"); if(c) c.onclick = () => { closeModal(); setTimeout(onCancel, 60); }; }
}

    });

function prevState(){
  try{
    const raw = Store.get(KEY_PREV);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || typeof o.data !== "string" || daysSince(o.at) > 14){
      try{ window.localStorage.removeItem(KEY_PREV); }catch(e){}   // abgelaufene Kopie nicht ewig aufheben
      return null;
    }
    return o;
  }catch(e){ try{ window.localStorage.removeItem(KEY_PREV); }catch(x){} return null; }
}
function undoRestore(){
  const o = prevState(); if(!o) return;
  let parsed = null;
  try{ parsed = JSON.parse(o.data); }catch(e){ toast(t("backupBad")); return; }
  const clean = sanitizeDB(parsed);
  if(!clean){ toast(t("backupBad")); return; }
  DB = clean; LANG = DB.lang;
  curClassId = null; curPlanId = null; curRoomId = null;
  undoStack = []; redoStack = []; updateUndoButtons();
  try{ window.localStorage.removeItem(KEY_PREV); }catch(e){}
  flushSave(); applyTheme(); applyLang(); show("start"); renderStart();
  toast(t("restoreUndone"));
}
function renderBackupReminder(){
  const box = $("#backup-reminder");
  if(!box) return;
  box.textContent = "";
  const prev = prevState();
  if(prev){
    const card = document.createElement("div");
    card.className = "board-card"; card.style.display = "block";
    const p0 = document.createElement("div");
    p0.style.fontSize = "13.5px"; p0.style.lineHeight = "1.6";
    p0.textContent = t("restoreUndoText");
    const row0 = document.createElement("div"); row0.className = "minirow";
    const back = document.createElement("button");
    back.className = "minibtn blue"; back.textContent = t("restoreUndo");
    back.onclick = () => askConfirm(t("restoreUndoQ"), t("restoreUndoT"), t("restoreUndo"), undoRestore);
    const hide = document.createElement("button");
    hide.className = "minibtn"; hide.textContent = t("restoreKeep");
    hide.onclick = () => { try{ window.localStorage.removeItem(KEY_PREV); }catch(e){} renderStart(); };
    row0.appendChild(back); row0.appendChild(hide);
    card.appendChild(p0); card.appendChild(row0);
    box.appendChild(card);
  }
  const stale = !DB.lastBackup || daysSince(DB.lastBackup) >= 30;
  if(!DB.classes.length || !stale) return;
  const card = document.createElement("div");
  card.className = "board-card";
  card.style.display = "block";
  card.style.borderColor = "rgba(232,180,74,.55)";
  const p = document.createElement("div");
  p.style.fontSize = "13.5px"; p.style.lineHeight = "1.6";

  const row = document.createElement("div");

  now.onclick = () => $("#btn-backup").onclick();
  const later = document.createElement("button");
  later.className = "minibtn"; later.textContent = t("later");
  later.onclick = () => { DB.lastBackup = new Date().toISOString(); save(); renderStart(); };
  row.appendChild(now); row.appendChild(later);
  card.appendChild(p); card.appendChild(row);
  box.appendChild(card);
}

function addPairRule(type){
  const c = curClass(); if(!c) return;
  const a = $("#pair-a").value, b = $("#pair-b").value;
  if(c.students.length < 2){ toast(t("needTwoStudents")); return; }
  if(!a || !b || a === b){ toast(t("pairPick")); return; }
  const exists = c.rules.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a));
  if(exists && exists.type === type){ toast(t("pairExists")); return; }
  if(!exists && c.rules.length >= MAX_RULES){ toast(t("limitRules").replace("{n}", String(MAX_RULES))); return; }
  pushUndo();
  if(exists) c.rules = c.rules.filter(r => r !== exists);   // widersprüchliche Regel ersetzen
  c.rules.push({ id: uid(), type, a, b });
  $("#pair-a").value = ""; $("#pair-b").value = "";
  save(); renderNames();
}
