const SMILEY_TOKS = ["s1","s2","s3","s4"];
const SMILEY = { s1: "😀", s2: "🙂", s3: "😐", s4: "🙁" };
const SMILEY_PDF = { s1: "++", s2: "+", s3: "-", s4: "--" };
const SCALE_TOKS = { grade: GRADE_TOKS, points: POINT_TOKS, smiley: SMILEY_TOKS };
function tokNum(tok, scale){
  if(scale === "grade"){ const m = /^([1-6])([+-]?)$/.exec(tok || ""); if(!m) return null; return +m[1] + (m[2] === "+" ? -0.3 : m[2] === "-" ? 0.3 : 0); }
  if(scale === "points"){ const v = parseInt(tok, 10); return isFinite(v) && v >= 0 && v <= 15 && String(v) === tok ? v : null; }
  return null;
}
const pointsToGrade = p => tokNum(GRADE_TOKS[POINT_TOKS.indexOf(String(p))], "grade");
const tokLabel = (tok, forPdf) => tok === "x" ? t("gMissing") : SMILEY[tok] ? (forPdf ? SMILEY_PDF[tok] : SMILEY[tok]) : String(tok || "");

const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? (LANG === "de" ? m[3] + "." + m[2] + "." : m[3] + "/" + m[2]) : ""; };
function courseAssess(c, subjectId){ return (c.assess || []).filter(a => a.subjectId === subjectId && a.kind !== "self").sort((a, b) => (a.date || "").localeCompare(b.date || "") || 0); }
/* Selbsteinschätzungen getrennt – zählen nie in Durchschnitte */
function selfAssess(c, subjectId){ return (c.assess || []).filter(a => a.subjectId === subjectId && a.kind === "self").sort((a, b) => (a.date || "").localeCompare(b.date || "")); }
/* Lehrerbewertung der Mitarbeit am selben Tag – zum Vergleich mit der Selbsteinschätzung */
function teacherSameDay(c, subjectId, date, sid){
  const a = (c.assess || []).filter(x => x.subjectId === subjectId && x.date === date && x.kind === "other" && x.marks[sid]).sort((x, y) => (y.auto ? 1 : 0) - (x.auto ? 1 : 0))[0];

/* Durchschnitte im Maßstab des Fachs: nur Punkte → Punkte, sonst Noten (Punkte umgerechnet) */
function courseScale(list){ const num = list.filter(a => a.scale !== "smiley"); return num.length && num.every(a => a.scale === "points") ? "points" : "grade"; }

function studentAverages(c, subjectId, sid){
  const list = courseAssess(c, subjectId), sc = courseScale(list);
  const part = kind => { let s = 0, w = 0; list.filter(a => a.kind === kind).forEach(a => { const v = valIn(a, a.marks[sid], sc); if(v !== null){ s += v * a.weight; w += a.weight; } }); return w ? s / w : null; };
  const wr = part("written"), ot = part("other");
  const W = (own(c.gradeW || {}, subjectId) ? c.gradeW[subjectId] : 50) / 100;
  /* Nur Teile mit Wert und Gewicht > 0 – bei 100 % schriftlich zählt Mündliches gar nicht */
  const parts = [[wr, W], [ot, 1 - W]].filter(([v, w]) => v !== null && w > 0);
  const sw = parts.reduce((a, [, w]) => a + w, 0);

function assessAverage(a, c){

  const v = ids.map(id => tokNum(a.marks[id], a.scale)).filter(x => x !== null);

/* ---- Grafiken (SVG, eine Farbe, leise Achsen) ---- */

function distChart(a){

  svgEl("line", { x1: 0, x2: W, y1: H - pb, y2: H - pb, class: "gaxis" }, svg);
  cats.forEach((cat, i) => {

function lineChart(points, scale, caption){
  const W = 320, H = 150, pl = 30, pr = 30, pt = 14, pb = 24;
  const lo = scale === "points" ? 0 : 1, hi = scale === "points" ? 15 : 6;
  const yOf = v => scale === "points" ? pt + (H - pt - pb) * (hi - v) / (hi - lo) : pt + (H - pt - pb) * (v - lo) / (hi - lo);
  const xOf = i => points.length < 2 ? (pl + W - pr) / 2 : pl + (W - pl - pr) * i / (points.length - 1);
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "gchart", role: "img",
    "aria-label": caption + ": " + points.map(p => p.label + " " + fmtNum(p.v, scale === "points" ? 1 : 1)).join(", ") });
  const ticks = scale === "points" ? [15, 10, 5, 0] : [1, 2, 3, 4, 5, 6];
  ticks.forEach(v => {
    svgEl("line", { x1: pl, x2: W - pr, y1: yOf(v), y2: yOf(v), class: "ggrid" }, svg);
    const tx = svgEl("text", { x: pl - 6, y: yOf(v) + 3.5, class: "glab", "text-anchor": "end" }, svg); tx.textContent = String(v);
  });
  if(points.length > 1) svgEl("polyline", { points: points.map((p, i) => xOf(i) + "," + yOf(p.v)).join(" "), class: "gline" }, svg);
  points.forEach((p, i) => {
    const c = svgEl("circle", { cx: xOf(i), cy: yOf(p.v), r: 4.5, class: "gdotc" }, svg);
    const tt = svgEl("title", {}, c); tt.textContent = p.label + ": " + fmtNum(p.v, scale === "points" ? 1 : 2);
    if(i === 0 || i === points.length - 1 || points.length <= 6){
      const tl = svgEl("text", { x: xOf(i), y: H - 7, class: "glab", "text-anchor": "middle" }, svg); tl.textContent = p.label;
    }
  });
  const last = points[points.length - 1];
  if(last){ const lv = svgEl("text", { x: Math.min(W - 2, xOf(points.length - 1) + 7), y: yOf(last.v) - 7, class: "gval", "text-anchor": "start" }, svg); lv.textContent = fmtNum(last.v, scale === "points" ? 1 : 1); }
  const wrap = document.createElement("div"); wrap.className = "gfig";
  const cap = document.createElement("div"); cap.className = "gcap"; cap.textContent = caption;
  wrap.appendChild(cap); wrap.appendChild(svg);
  return wrap;
}

/* Rundungsregel je Klasse und Fach: zugunsten der Schülerin/des Schülers bei ,5 und mit Tendenzen (+/−) */
function roundRule(c, sid){ const r = own(c.gradeRound || {}, sid) ? c.gradeRound[sid] : null; return { fav: !r || r.fav !== false, tend: !!r && r.tend === true }; }
function proposeGrade(c, sid, av){
  if(!av || av.total === null || av.total === undefined) return null;
  const R = roundRule(c, sid), v = av.total, eps = 1e-9;
  if(av.scale === "points"){
    /* Punkte: höher ist besser – „zugunsten“ rundet ,5 auf, kaufmännisch ebenfalls */
    return String(Math.max(0, Math.min(15, Math.floor(v + 0.5 + eps))));
  }
  if(!R.tend){
    const f = Math.floor(v), frac = v - f;
    let n = Math.abs(frac - 0.5) < eps ? (R.fav ? f : f + 1) : Math.round(v);
    return String(Math.max(1, Math.min(6, n)));
  }
  /* Mit Tendenz: nächster Wert aus 1+ … 6; bei Gleichstand entscheidet die Regel */
  let best = null;
  GRADE_TOKS.forEach(tok => {
    const x = tokNum(tok, "grade"), d = Math.abs(x - v);
    if(!best || d < best.d - eps || (Math.abs(d - best.d) < eps && (R.fav ? x < best.x : x > best.x))) best = { tok, x, d };
  });
  return best.tok;
}
const smileyWord = tok => t("gSm_" + tok);
function csvValue(tok){ return tok === "x" ? t("gMissing") : SMILEY[tok] ? smileyWord(tok) : String(tok || ""); }
function exportGradesCsv(c, s){
  try{
    const list = courseAssess(c, s.id), sc = courseScale(list), dg = sc === "points" ? 1 : 2;
    const head = [t("csvName")].concat(list.map(a => fmtDate(a.date) + " " + a.title + " (" + (a.kind === "written" ? t("gW") : t("gO")) + (a.weight !== 1 ? " ×" + fmtNum(a.weight, a.weight % 1 ? 1 : 0) : "") + ")"))
      .concat(["Ø " + t("gW"), "Ø " + t("gO"), t("gTotal"), t("gProposal"), t("absMissedShort")]);
    const lines = [head.map(csvCell).join(";")];
    c.students.forEach(st => {
      const av = studentAverages(c, s.id, st.id);
      const cells = [st.name].concat(list.map(a => csvValue(a.marks[st.id])))
        .concat([av.written, av.other, av.total].map(v => v === null ? "" : fmtNum(v, dg)))
        .concat([proposeGrade(c, s.id, av) || "", String(missedLessons(c, st.id).bySubject[s.id] || 0)]);
      lines.push(cells.map(csvCell).join(";"));
    });
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    if(download(blob, safeName(c.name + " " + s.name + " " + t("gPdfTitle")) + ".csv", "text/csv")) toast(t("gCsvOk"));
    else toast(t("exportFail"));
  }catch(e){ toast(t("exportFail")); }
}
/* ---- Fehlstunden je Unterrichtsstunde (aus dem Stundenplan) ----
   Beim Start des Unterrichtsmodus und bei jeder Änderung der Anwesenheit wird für die laufende
   Stunde festgehalten, wer fehlt. Ohne passende Stunde im Stundenplan zählt der Eintrag als eine Stunde. */
function currentLessonFor(c, date){
  date = date || new Date();
  const day = (date.getDay() + 6) % 7;
  if(!c || day >= DB.tt.days) return null;
  const wk = abWeek(date), times = periodTimes(), m = date.getHours() * 60 + date.getMinutes();
  /* Direkt nach der Klasse filtern: Überschneidungen (A/B ohne Bezugswoche) liefern sonst die falsche Stunde */
  const dk = isoDay(date);
  return DB.lessons.find(L => L.classId === c.id && L.day === day && (!L.week || !wk || L.week === wk) && times[L.period]
    && !isCancelled(L, dk) && times[L.period].start <= m && m < times[Math.min(times.length - 1, L.period + L.span - 1)].end) || null;
}
function recordLessonAbsence(c){
  if(!c || !c.lesson) return false;
  /* Gezählt wird nur eine Stunde aus dem Stundenplan – außerhalb (Pause, Nachmittag) entsteht keine Phantomstunde */
  const L = currentLessonFor(c); if(!L) return false;
  const d = c.lesson.date || todayKey(), p = L.period;
  c.absLog = Array.isArray(c.absLog) ? c.absLog : [];
  const e = c.absLog.find(x => x.d === d && x.p === p);
  const ids = c.lesson.absent.slice();
  if(!e){
    if(!ids.length) return false;                   // nichts zu notieren
    c.absLog.push({ d, p, n: L.span, s: L.subjectId, ids });
    while(c.absLog.length > 3000) c.absLog.shift();
    return true;
  }
  if(e.ids.join() === ids.join()) return false;
  e.ids = ids; return true;
}
/* Läuft der Unterrichtsmodus über den Stundenwechsel, wird auch die nächste Stunde erfasst */
setInterval(() => { if(lessonMode){ const c = curClass(); if(recordLessonAbsence(c)) save(); } }, 60000);
function missedLessons(c, sid){
  const out = { total: 0, bySubject: {}, dates: [] }, off = cancelledSlots(c);
  (c.absLog || []).forEach(e => {
    if(e.ids.indexOf(sid) < 0 || off.has(e.d + "|" + e.p)) return;
    out.total += e.n; out.bySubject[e.s || ""] = (out.bySubject[e.s || ""] || 0) + e.n; out.dates.push(e.d);
  });
  return out;
}
/* ---- Gesprächsblatt: eine Seite (oder mehr) je Schüler für Elterngespräche ---- */
function talkSheetPages(c, st){
  const W = A4P_W, H = A4P_H, M = 44, pages = [];
  let cur = [], y = 0;
  const grey = "0.353 0.420 0.459";
  const start = () => {
    cur = [];
    cur.push(pdfText(M, H - M - 10, 18, st.name));
    cur.push(pdfText(M, H - M - 30, 10.5, c.name + " · " + t("talkTitle") + " · " + new Date().toLocaleDateString(LANG === "en" ? "en-GB" : "de-DE"), grey));
    y = H - M - 62;
  };
  const need = h => { if(y - h < M + 10){ pages.push({ content: cur.join("\n"), w: W, h: H }); start(); } };
  start();
  const subjects = courseSubjects(c).filter(s => courseAssess(c, s.id).some(a => a.marks[st.id]) || selfAssess(c, s.id).some(a => a.marks[st.id]));
  if(!subjects.length){ cur.push(pdfText(M, y, 11, t("talkNoGrades"), grey)); y -= 22; }
  subjects.forEach(s => {
    const list = courseAssess(c, s.id), sc = courseScale(list), dg = sc === "points" ? 1 : 2;
    const av = studentAverages(c, s.id, st.id), pv = proposeGrade(c, s.id, av);
    const mine = list.filter(a => a.marks[st.id]);
    need(70);
    cur.push("0.93 0.95 0.97 rg " + M + " " + (y - 6).toFixed(1) + " " + (W - 2 * M) + " 22 re f");
    cur.push(pdfText(M + 6, y, 13, s.name));
    const sumTxt = "Ø " + t("gW") + " " + fmtNum(av.written, dg) + "   Ø " + t("gO") + " " + fmtNum(av.other, dg) + "   " + t("gTotal") + " " + fmtNum(av.total, dg) + (pv ? "   " + t("gProposal") + " " + pv : "");
    cur.push(pdfText(W - M - 6 - pdfTextW(sumTxt, 9.5), y + 1, 9.5, sumTxt, grey));
    y -= 26;
    /* Verlauf als kleine Linie (bessere Werte oben) */
    const pts = mine.map(a => valIn(a, a.marks[st.id], sc)).filter(v => v !== null);
    if(pts.length >= 2){
      need(70);
      const cx0 = M + 10, cw = 220, ch = 50, top = y - 4, lo = sc === "points" ? 0 : 1, hi = sc === "points" ? 15 : 6;
      const yOf = v => sc === "points" ? top - ch + ch * (v - lo) / (hi - lo) : top - ch * (v - lo) / (hi - lo);
      [lo, hi].forEach(v => {
        cur.push("0.85 0.87 0.9 RG 0.5 w " + cx0 + " " + yOf(v).toFixed(1) + " m " + (cx0 + cw) + " " + yOf(v).toFixed(1) + " l S");
        cur.push(pdfText(cx0 - 9, yOf(v) - 3, 7.5, String(v), grey));
      });
      cur.push("0.169 0.420 0.733 RG 1.6 w " + pts.map((v, i) => (cx0 + cw * i / (pts.length - 1)).toFixed(1) + " " + yOf(v).toFixed(1) + (i ? " l" : " m")).join(" ") + " S");
      pts.forEach((v, i) => cur.push("0.169 0.420 0.733 rg " + pdfEllipse(cx0 + cw * i / (pts.length - 1), yOf(v), 2.4, 2.4) + " f"));
      cur.push(pdfText(cx0 + cw + 10, top - ch / 2, 8.5, t("gTrend") + " (" + t("gTrendTop").replace("{v}", sc === "points" ? "15" : "1") + ")", grey));
      y -= ch + 24;
    }
    mine.forEach(a => {
      need(15);
      cur.push(pdfText(M + 10, y, 10, fmtDate(a.date)));
      let ti = a.title; while(ti.length > 3 && pdfTextW(ti, 10) > 240) ti = ti.slice(0, -2) + "…";
      cur.push(pdfText(M + 60, y, 10, ti));
      cur.push(pdfText(M + 310, y, 9, a.kind === "written" ? t("gWritten") : t("gOther"), grey));
      cur.push(pdfText(M + 430, y, 10.5, tokLabel(a.marks[st.id], true)));
      y -= 14;
    });
    const selfs = selfAssess(c, s.id).filter(a => a.marks[st.id]);
    if(selfs.length){
      need(30); y -= 4;
      cur.push(pdfText(M + 10, y, 10.5, t("selfTitle"), "0.357 0.176 0.620")); y -= 15;
      selfs.forEach(a => {
        need(15);
        const tm = teacherSameDay(c, s.id, a.date, st.id);
        cur.push(pdfText(M + 10, y, 10, fmtDate(a.date)));
        cur.push(pdfText(M + 60, y, 10, t("selfShort") + ": " + smileyWord(a.marks[st.id]) + (tm ? "   " + t("selfTeacher") + ": " + tokLabel(tm, true) : "")));
        y -= 14;
      });
    }
    y -= 10;
  });
  /* Beobachtungen (älteste zuerst) und offene Abhaklisten */
  const ob = (c.obs || []).filter(o => o.sid === st.id).slice().sort((a, b) => a.d.localeCompare(b.d));
  if(ob.length){
    need(40);
    cur.push(pdfText(M, y, 13, t("obsTitle"))); y -= 18;
    ob.forEach(o => {
      const sj = subjectById(o.s);
      const lines = pdfWrap(o.text, 78);
      need(14 * lines.length + 4);
      cur.push(pdfText(M + 10, y, 9.5, fmtDate(o.d) + (sj ? " " + (sj.short || sj.name) : ""), grey));
      lines.forEach(l => { cur.push(pdfText(M + 80, y, 10, l)); y -= 13; });
      y -= 3;
    });
    y -= 8;
  }
  const openChecks = (c.checks || []).filter(k => k.done.indexOf(st.id) < 0);
  if(openChecks.length){
    need(36);
    cur.push(pdfText(M, y, 13, t("ckOpen"))); y -= 17;
    pdfWrap(openChecks.map(k => k.title + (k.date ? " (" + fmtDate(k.date) + ")" : "")).join(", "), 90).forEach(l => { need(14); cur.push(pdfText(M + 10, y, 10, l)); y -= 13; });
    y -= 10;
  }
  /* Fehlzeiten */
  const mi = missedLessons(c, st.id);
  const days = attendanceRows(c).filter(r => r.absent.indexOf(st.id) >= 0).map(r => r.date);
  need(60);
  cur.push(pdfText(M, y, 13, t("talkAbsence"))); y -= 18;
  const nTxt = (one, many, n) => n === 1 ? t(one) : t(many).replace("{n}", String(n));
  cur.push(pdfText(M + 10, y, 10.5, nTxt("talkAbsDay1", "talkAbsDays", days.length) + (mi.total ? "   ·   " + nTxt("talkAbsLesson1", "talkAbsLessons", mi.total) : ""))); y -= 15;
  if(mi.total){
    const parts = Object.keys(mi.bySubject).map(id => (subjectById(id) ? subjectById(id).name : t("absNoSubject")) + " " + mi.bySubject[id]).join(", ");
    pdfWrap(parts, 90).forEach(l => { need(14); cur.push(pdfText(M + 10, y, 9.5, l, grey)); y -= 13; });
  }
  if(days.length){ pdfWrap(days.map(fmtDate).join(", "), 95).forEach(l => { need(14); cur.push(pdfText(M + 10, y, 9.5, l, grey)); y -= 13; }); }
  /* Platz für Notizen im Gespräch */
  y -= 10; need(120);
  cur.push(pdfText(M, y, 13, t("talkNotes"))); y -= 10;
  for(let k = 0; k < 6 && y - 22 > M; k++){ y -= 22; cur.push("0.8 0.82 0.85 RG 0.5 w " + M + " " + y.toFixed(1) + " m " + (W - M) + " " + y.toFixed(1) + " l S"); }
  pages.push({ content: cur.join("\n"), w: W, h: H });
  return pages;
}

const MAX_CHECKS = 100;
const cancelKey = (L, d) => d + "|" + L.id;
function isCancelled(L, d){ return Array.isArray(DB.cancelled) && DB.cancelled.indexOf(cancelKey(L, d)) >= 0; }
function setCancelled(L, d, on){
  const k = cancelKey(L, d);
  DB.cancelled = (Array.isArray(DB.cancelled) ? DB.cancelled : []).filter(x => x !== k);
  if(!on) return;
  DB.cancelled.push(k);
  while(DB.cancelled.length > 500) DB.cancelled.shift();
}
/* "Datum|Stunde" aller ausgefallenen Stunden einer Klasse – schon gezählte Fehlstunden bleiben gespeichert,
   zählen aber nicht mit. Nimmt man den Ausfall zurück, sind sie wieder da. */
function cancelledSlots(c){
  const byId = new Map(DB.lessons.map(L => [L.id, L])), out = new Set();
  (DB.cancelled || []).forEach(x => { const L = byId.get(x.slice(11)); if(L && L.classId === c.id) out.add(x.slice(0, 10) + "|" + L.period); });
  return out;
}
/* Datum einer Stunde in der angezeigten Woche (bei A/B die Woche, die gerade gewählt ist) */
/* Montag der Woche, die der Stundenplan meint: am Wochenende schon die kommende */
function ttRefMonday(){
  const now = new Date(), d = mondayOf(now);
  if((now.getDay() + 6) % 7 >= DB.tt.days) d.setDate(d.getDate() + 7);
  return d;
}
function ttDateFor(L){
  const d = ttRefMonday();
  let add = L.day;
  if(DB.tt.ab && ttWeekView){ const wk = abWeek(d); if(wk && wk !== ttWeekView) add += 7; }
  d.setDate(d.getDate() + add);
  return isoDay(d);
}
function fmtDateLong(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if(!m) return "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return I18N[LANG].ttDays[(d.getDay() + 6) % 7] + ", " + fmtDate(iso);
}

function bioAuth(ok, fail){
  if(lockBusy) return;                                   // Abfrage läuft schon – zweiten Tipp ignorieren
  const F = window.Fingerprint;
  if(!F){ if(fail) fail({ code: "noplugin" }); return; }
  lockBusy = true;
  clearTimeout(lockBusyTimer);
  lockBusyTimer = setTimeout(() => { lockBusy = false; }, 60000);   // falls die Antwort verloren geht
  const android = !!(window.cordova && window.cordova.platformId === "android");
  const done = () => { lockBusy = false; clearTimeout(lockBusyTimer); };
  try{
    F.show({ title: t("lockTitle"), description: t("lockDesc"), disableBackup: false, confirmationRequired: false,
             fallbackButtonTitle: t("lockFallback"),
             /* Android: der einzige Knopf führt zur Geräte-PIN – so beschriften */
             cancelButtonTitle: android ? t("lockFallback") : t("cancel") },
      () => { done(); lockOpen = true; ok(); },
      e => { done(); if(fail) fail(e || {}); });
  }catch(e){ done(); if(fail) fail({ code: "noplugin" }); }
}
/* Ohne nutzbare Entsperrung (Biometrie entfernt, Plugin fehlt) bietet die App an, die Sperre
   auszuschalten – das kann nur, wer das Gerät selbst entsperrt hat und die Einstellungen ändern konnte */
const LOCK_UNUSABLE = [-101, -104, -106, -110, "noplugin"];
function lockError(e){
  const c = e && e.code;
  if(LOCK_UNUSABLE.indexOf(c) >= 0 && DB.settings.lock === true){
    askConfirm(t("lockBrokenQ"), t("lockBrokenT"), t("lockBrokenOk"), () => { DB.settings.lock = false; save(); renderSettings(); toast(t("lockOff")); });
    return;
  }
  toast(t(LOCK_UNUSABLE.indexOf(c) >= 0 ? "lockNoBio" : c === -111 || c === -112 ? "lockLockedOut" : "lockCancelled"));
}
/* true: gesperrt – die Entsperrung läuft, danach geht es mit retry weiter */
function needUnlock(retry){
  if(!lockedNow()) return false;
  bioAuth(retry, lockError);
  return true;
}
function lockButton(parent, retry){
  const b = document.createElement("button"); b.className = "cbtn outline lockbtn2"; b.id = "lock-open"; b.style.width = "100%"; b.style.marginTop = "6px";
  b.appendChild(icon("lock")); const sp = document.createElement("span"); sp.textContent = t("lockOpenBtn"); b.appendChild(sp);
  b.onclick = () => bioAuth(retry, lockError);
  parent.appendChild(b);
  return b;
}
function toggleLock(){
  const S = DB.settings;
  if(S.lock){
    /* Ausschalten nur nach Entsperren – sonst könnte es jeder mit dem Gerät in der Hand */
    bioAuth(() => { S.lock = false; save(); renderSettings(); toast(t("lockOff")); }, lockError);
    return;
  }
  const F = window.Fingerprint;
  if(!F){ toast(t("lockNoBio")); return; }
  F.isAvailable(() => bioAuth(() => { S.lock = true; save(); renderSettings(); toast(t("lockOn")); }, lockError),
    () => toast(t("lockNoBio")), { allowBackup: true });
}
/* Beim Sperren sensible Ansichten schließen */
function relock(){
  if(DB.settings.lock !== true || !lockOpen) return;
  lockOpen = false;
  if(gradeMode) endGradeMode();
  const onGrades = $("#screen-grades").classList.contains("active") || $("#screen-assess").classList.contains("active");
  if($("#modal").classList.contains("on") && !selfMode && (onGrades || $("#sheet").dataset.sens === "1")) closeModal();
  if(onGrades) goHome();
}
function lockPause(){ lockPausedAt = Date.now(); }
function lockResume(){ if(lockPausedAt && Date.now() - lockPausedAt >= LOCK_GRACE) relock(); lockPausedAt = 0; }
document.addEventListener("pause", lockPause, false);
document.addEventListener("resume", lockResume, false);
document.addEventListener("visibilitychange", () => { if(document.hidden) lockPause(); else lockResume(); });

/* Einmal beim ersten Start: Hinweis auf die Genehmigung der Schulleitung */

}

/* Lief beim Beenden der App eine Selbsteinschätzung, geht es genau dort weiter */
(function resumeSelfLock(){
  const L = DB.selfLock; if(!L) return;
  const c = DB.classes.find(x => x.id === L.classId);
  const ok = c && c.plans.some(p => p.id === L.planId) && (c.assess || []).some(a => a.id === L.assessId && a.kind === "self");
  if(!ok){ delete DB.selfLock; save(); return; }
  setCurClass(c.id); openPlan(L.planId); startSelfMode(L.assessId);
})();

/* Nach dem Drehen des Geräts ändert sich die Höhe der Fläche stark. Ohne Neueinpassen
   rechnet die App mit den alten Maßen weiter und der Plan rutscht aus dem Bild. */
let lastWrapW = 0, lastWrapH = 0, resizeTimer = null;
function handleViewportChange(force){
  if(!$("#screen-editor").classList.contains("active")) return;
  const el = $("#stage-wrap");
  const w = el.clientWidth, h = el.clientHeight;
  if(w < 40 || h < 40) return;
  const changed = Math.abs(w - lastWrapW) > 24 || Math.abs(h - lastWrapH) > 24;
  lastWrapW = w; lastWrapH = h;
  if(force || changed || presenting) fitToScreen();     // deutliche Änderung: neu einpassen
  else applyTransform();
}
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => handleViewportChange(false), 120);
});
window.addEventListener("orientationchange", () => {
  setTimeout(() => handleViewportChange(true), 260);    // Maße stehen erst nach dem Umbau fest
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => handleViewportChange(false), 160);
  });
}
/* Ohne eigene Behandlung beendet die Zurücktaste unter Android sofort die App */
function navBack(){
  if($("#modal").classList.contains("on")){ closeModal(); return true; }
  if($("#screen-editor").classList.contains("active")){
    if(presenting){ setPresenting(false); return true; }
    if(selfMode) return true;                         // Selbsteinschätzung: nur über langes Drücken auf ✕
    if(checkMode){ endCheckMode(); return true; }
    if(gradeMode){ $("#gb-exit").onclick(); return true; }
    if(lessonMode){ setLesson(false); return true; }
    if(editMode === "room" && curPlanId){ setEditMode("desks"); return true; }
    if(swapSrc){ swapSrc = null; renderStage(false); updateEditorChrome(); return true; }
    if(curPlanId){ goPlans(); return true; }
    goRooms(); return true;
  }
  if($("#screen-assess").classList.contains("active")){ show("grades"); renderGrades(); return true; }
  if(["names","rooms","plans","info","settings","timetable","grades"].some(id => $("#screen-" + id).classList.contains("active"))){
    goHome(); return true;
  }
  return false;                                    // Startseite: App darf sich schließen
}
/* Liegt die WebView neben Status- und Navigationsleiste (nicht randlos), meldet Android
   trotzdem Abstände über env(safe-area-*) – die würden doppelt zählen. Randlos (Android 15+)
   ist die WebView so groß wie der Bildschirm; dann bleiben die Abstände nötig. */
function checkAndroidInsets(){
  /* Offene Tastatur verkleinert die Ansicht – das ist kein Hinweis auf Systemleisten */
  const ae = document.activeElement;
  if(ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT" || ae.isContentEditable)) return;
  const scr = Math.max(screen.width, screen.height), view = Math.max(window.innerWidth, window.innerHeight);
  const framed = scr - view > 20;
  const had = document.documentElement.classList.contains("android");
  document.documentElement.classList.toggle("android", framed);
  if(had !== framed && $("#screen-editor").classList.contains("active")) setTimeout(fitToScreen, 60);
}
(function registerBackButton(){
  document.addEventListener("deviceready", () => {
    if(window.cordova && window.cordova.platformId === "android"){
      if(window.StatusBar){ try{ StatusBar.overlaysWebView(false); }catch(e){} }
      applyTheme(); checkAndroidInsets();
      window.addEventListener("orientationchange", () => setTimeout(checkAndroidInsets, 300));
    }
  }, false);
  document.addEventListener("deviceready", () => {        // Cordova unter Android
    document.addEventListener("backbutton", e => {
      e.preventDefault();
      if(!navBack() && navigator.app && navigator.app.exitApp) navigator.app.exitApp();
    }, false);
  }, false);
  const P = capPlugins();
  if(P && P.App && P.App.addListener){
    P.App.addListener("backButton", () => {
      if(!navBack() && P.App.exitApp) P.App.exitApp();
    });
  }
  try{ history.replaceState({ app: 1 }, ""); history.pushState({ app: 1 }, ""); }catch(e){}
  window.addEventListener("popstate", () => {
    const handled = navBack();
    try{ history.pushState({ app: 1 }, ""); }catch(e){}
    if(!handled){ /* Startseite erreicht — der Browser darf beim nächsten Mal zurück */ }
  });
})();
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => {
  if(e.target.closest && e.target.closest("#stage")) e.preventDefault();
});
/* Service Worker nur im Web: in der Cordova-App liegen die Dateien ohnehin auf dem Gerät */
if(!window.cordova && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
/* Letzte Änderungen sichern, bevor das System die App anhält oder beendet.
   Cordova meldet das über "pause"; im Browser über visibilitychange/pagehide. */
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushSave(); });
document.addEventListener("pause", flushSave, false);
