<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FairSeat laden</title>
<meta name="theme-color" content="#003366">
<meta name="description" content="FairSeat – Sitzplan und Notenbuch in einer App. Offline, ohne Konto. Eine Klasse kostenlos.">
<meta property="og:title" content="FairSeat – Sitzplan &amp; Noten">
<meta property="og:description" content="Sitzplan und Notenbuch in einer App: direkt am Platz bewerten, Selbsteinschätzung, Stundenplan. Offline, ohne Konto.">
<meta property="og:image" content="https://simaehlmann-cloud.github.io/FairSeat/fairseat/icon.png">
<!--
  Neutrale Download-Seite für „FairSeat weiterempfehlen“. Die App verlinkt nur
  diese Seite (Apple erlaubt in der iOS-App keine Hinweise auf andere Plattformen).
  Handys werden automatisch in ihren Store geleitet; ?stay hält die Seite an.
  Sobald es FairSeat bei Google Play gibt: zweiten Knopf ergänzen und unten
  bei "android" das Ziel eintragen.
-->
<style>
  :root { --bg:#bcdcff; --card:#fff; --text:#003366; --border:#0055aa; --muted:#3d5a80; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121220; --card:#1e1e30; --text:#e6e6ee; --border:#5b9ce6; --muted:#a9b4c8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height:1.5; }
  main { max-width:460px; margin:0 auto; background:var(--card); border:2px solid var(--border);
         border-radius:16px; padding:28px 22px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { font-size:26px; margin:12px 0 4px; }
  p { margin:8px 0; }
  .muted { color:var(--muted); font-size:15px; }
  .btns { display:flex; flex-direction:column; gap:10px; margin:22px 0 8px; }
  .btns a { display:block; padding:14px; border-radius:12px; background:var(--border); color:#fff;
            text-decoration:none; font-weight:700; font-size:17px; }
  .hint { min-height:1.5em; font-size:14px; color:var(--muted); }
  footer { margin-top:24px; font-size:14px; }
  footer a { color:var(--border); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="FairSeat">
  <h1>FairSeat</h1>
  <p id="claim">Sitzplan und Notenbuch in einer App: direkt am Platz bewerten, Selbsteinschätzung der Schüler, Stundenplan und Fehlzeiten.</p>
  <p class="muted" id="sub">Offline · ohne Konto · ohne Werbung · eine Klasse kostenlos</p>
  <div class="btns">
    <a id="ios" href="https://apps.apple.com/app/id6818996972">App Store (iPhone &amp; iPad)</a>
  </div>
  <p class="hint" id="hint"></p>
  <footer><a id="imp" href="impressum.html">Impressum</a> · <a id="ds" href="datenschutz.html">Datenschutz</a></footer>
</main>
<script>
(function(){
  var en = !/^de\b/i.test(navigator.language || '');
  if (en) {
    document.documentElement.lang = 'en';
    document.title = 'Get FairSeat';
    document.getElementById('claim').textContent = 'Seating plan and gradebook in one app: mark students right at their seat, student self-assessment, timetable and attendance.';
    document.getElementById('sub').textContent = 'Offline · no account · no ads · one class free';
    document.getElementById('imp').textContent = 'Legal notice'; document.getElementById('imp').href = 'impressum-en.html';
    document.getElementById('ds').textContent = 'Privacy policy'; document.getElementById('ds').href = 'datenschutz-en.html';
  }
  if (/[?&]stay\b/.test(location.search)) return;
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var target = ios ? 'ios' : null;
  if (!target) {
    if (/Android/.test(ua)) document.getElementById('hint').textContent = en
      ? 'FairSeat is currently available for iPhone and iPad.' : 'FairSeat gibt es derzeit für iPhone und iPad.';
    return;
  }
  document.getElementById('hint').textContent = en ? 'Opening the App Store …' : 'Der App Store wird geöffnet …';
  setTimeout(function(){ location.replace(document.getElementById(target).href); }, 400);
})();
</script>
</body>
</html>
